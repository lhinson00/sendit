name: TSSAA brackets
on:
  schedule:
    # Friday night in Chicago, both CST and CDT. Every 10 minutes while games are on.
    - cron: "*/10 23 * * 5"
    - cron: "*/10 0-6 * * 6"
    - cron: "20 12 * * 6"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  brackets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-tssaa-brackets.mjs
      - name: publish
        run: |
          git config user.name "sauce-tssaa"
          git config user.email "sauce-tssaa@users.noreply.github.com"
          git add data/tssaa-brackets.json
          git diff --cached --quiet && exit 0
          git commit -m "Update TSSAA football playoff brackets."
          git pull --rebase origin main
          git push
