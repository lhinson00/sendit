name: TSSAA basketball
on:
  schedule:
    # GitHub will not start a job every 15 minutes. It often waits hours, then skips the starts it missed.
    # These are start attempts. Once a job is running, the script below pulls every 15 minutes for almost 6 hours.
    - cron: "13 0,4,8,12,16,20 * * *"
    - cron: "43 2,6,10,14,18,22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tssaa-scores
  cancel-in-progress: true
jobs:
  hoops:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pull CoachT every 15 minutes
        run: |
          set +e
          deadline=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/refresh-tssaa-scores.mjs
            node --input-type=module -e "import {readFileSync} from 'node:fs'; const f=JSON.parse(readFileSync('data/tssaa.json','utf8')); if(!Array.isArray(f.games)||f.games.length<100) process.exit(1);"
            if [ $? -ne 0 ]; then
              echo "refusing to publish a bad football file"
              sleep 900
              continue
            fi
            git add data/tssaa.json data/tssaa-hoops.json
            if git diff --cached --quiet; then
              echo "no change"
            else
              git config user.name "sauce-tssaa"
              git config user.email "sauce-tssaa@users.noreply.github.com"
              git commit -m "Update TSSAA scores."
              git pull --rebase origin main && git push origin main || git rebase --abort
            fi
            sleep 900
          done
