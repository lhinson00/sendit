name: TSSAA basketball
on:
  schedule:
    # Every evening in Chicago, CST and CDT. Scores update while games are on, then a morning catch.
    - cron: "*/15 22-23 * * *"
    - cron: "*/15 0-5 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hoops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-tssaa-hoops.mjs
      - name: publish
        run: |
          git config user.name "sauce-tssaa"
          git config user.email "sauce-tssaa@users.noreply.github.com"
          git add data/tssaa-hoops.json
          git diff --cached --quiet && exit 0
          git commit -m "Update TSSAA basketball scores."
          git pull --rebase origin main
          git push
