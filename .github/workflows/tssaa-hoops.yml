name: TSSAA basketball
on:
  schedule:
    # GitHub often delays a single every-15 cron, so game nights are listed on their own too.
    - cron: "*/15 * * * *"
    - cron: "*/15 22-23 * * 1-6"
    - cron: "*/15 0-5 * * 2-6"
    - cron: "20 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hoops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-tssaa-hoops.mjs
      - run: node scripts/refresh-tssaa-scores.mjs
      - name: publish
        run: |
          git config user.name "sauce-tssaa"
          git config user.email "sauce-tssaa@users.noreply.github.com"
          git add data/tssaa-hoops.json data/tssaa.json
          git diff --cached --quiet && exit 0
          git commit -m "Update TSSAA scores."
          git pull --rebase origin main
          git push
