name: TSSAA basketball
on:
  schedule:
    # Every 15 minutes. GitHub often delays the evening window and then skips the runs it missed.
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hoops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-tssaa-hoops.mjs
      - name: publish
        run: |
          git config user.name "sauce-tssaa"
          git config user.email "sauce-tssaa@users.noreply.github.com"
          git add data/tssaa-hoops.json
          git diff --cached --quiet && exit 0
          git commit -m "Update TSSAA basketball scores."
          git pull --rebase origin main
          git push
