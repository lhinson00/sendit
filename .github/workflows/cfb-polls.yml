name: College polls
on:
  schedule:
    - cron: "0 13,19,23 * * 0"
    - cron: "0 15 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-cfb-polls.mjs
      - name: publish
        run: |
          git config user.name "sauce-polls"
          git config user.email "sauce-polls@users.noreply.github.com"
          git add data/cfb-polls.json
          git diff --cached --quiet && exit 0
          git commit -m "Update college football polls."
          git push
