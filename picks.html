<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sauce Pick Em</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#07080c;--card:#12141b;--line:#2c313d;--orange:#ff7a18;--text:#f6f1ea;--muted:#9a938a;--live:#3ee0a0;--hot:#ff5d5d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif}
body{width:min(680px,100%);margin:0 auto;padding:0 12px 100px}
header{display:flex;align-items:flex-end;padding:16px 0 8px}
header b{font-family:"Bebas Neue",sans-serif;font-size:32px;letter-spacing:.05em}
header b em{color:var(--orange);font-style:normal}
header a{margin-left:auto;color:var(--muted);text-decoration:none;font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.seg button{border:1px solid var(--line);background:#10131a;color:var(--text);border-radius:10px;padding:10px;font-weight:800}
.seg button.on{border-color:var(--orange);color:#1a0e05;background:var(--orange)}
.sub{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:6px 2px 10px}
input{width:100%;background:#10131a;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);margin-bottom:10px}
.match{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 8px;overflow:hidden}
.match .top{display:flex;justify-content:space-between;padding:8px 10px 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr 1fr}
.pick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 12px;border:0;background:transparent;color:inherit;border-top:1px solid #222733}
.pick img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}
.pick b{font-size:13px;text-align:center}
.pick span{font-size:11px;color:var(--muted)}
.pick.on{background:#2a170c;box-shadow:inset 0 -3px 0 var(--orange)}
.pick.win{box-shadow:inset 0 -3px 0 var(--live)}
.pick.loss.on{box-shadow:inset 0 -3px 0 var(--hot)}
.lockbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px;background:#0c0e13;border-top:1px solid var(--line)}
.lockbar .go{background:var(--orange);color:#1a0e05;border:0;border-radius:10px;padding:12px 18px;font-weight:800}
.lockbar .sec{background:#171b24;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:#1b140e;border:1px solid var(--orange);padding:8px 12px;border-radius:8px;display:none}
</style>
</head>
<body>
<header><b>SAUCE <em>PICK EM</em></b><a href="/">Home</a></header>
<div class="seg">
  <button type="button" id="lgNfl" class="on">NFL</button>
  <button type="button" id="lgCfb">College</button>
</div>
<div class="seg">
  <button type="button" class="on" data-tab="card">Card</button>
  <button type="button" data-tab="board">Standings</button>
</div>
<p class="sub"><span id="meta">Loading slate…</span><b id="count">0 picks</b></p>
<div id="cardView">
  <input id="cardName" maxlength="24" placeholder="Name on this board"/>
  <div id="games"></div>
</div>
<div id="boardView" hidden></div>
<div class="lockbar" id="lockbar">
  <button type="button" class="sec" id="unlock">Unlock</button>
  <button type="button" class="go" id="lock">Lock card</button>
</div>
<div class="toast" id="toast"></div>
<script>
const SUPA_URL="https://cgxgyxzyunokiqfedtqp.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNneGd5eHp5dW5va2lxZmVkdHFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzQ2OTMsImV4cCI6MjEwNTc1MDY5M30.LBhCjY33GLZZ3BbpLVqoyx8ND20Egow0yH_rkui09pU";
const state={lg:"nfl",games:[],cards:{nfl:{picks:{},name:"",locked:false},cfb:{picks:{},name:"",locked:false}}};
const $ = id => document.getElementById(id);
function toast(m){ const t=$("toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",1600); }
function weekKey(lg){
  const fmt=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"});
  const parts=fmt.formatToParts(new Date());
  const g=k=>parts.find(x=>x.type===k).value;
  const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  const dow=map[g("weekday")];
  const dt=new Date(Date.UTC(+g("year"),+g("month")-1,+g("day")));
  dt.setUTCDate(dt.getUTCDate()-(dow>=3?dow-3:dow+4));
  return "pem-"+lg+"-"+dt.toISOString().slice(0,10);
}
function card(){ return state.cards[state.lg]; }
function loadLocal(){
  ["nfl","cfb"].forEach(lg=>{
    try{ state.cards[lg]=Object.assign({picks:{},name:"",locked:false}, JSON.parse(localStorage.getItem("saucePick."+weekKey(lg))||"{}")); }
    catch(e){ state.cards[lg]={picks:{},name:"",locked:false}; }
  });
  $("cardName").value=card().name||"";
}
function saveLocal(){
  card().name=$("cardName").value.trim();
  localStorage.setItem("saucePick."+weekKey(state.lg), JSON.stringify(card()));
  const n=Object.keys(card().picks).length;
  $("count").textContent=n+" / "+state.games.length;
}
function headers(extra){ return Object.assign({apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"}, extra||{}); }
function rankOf(comp){
  const r=comp.curatedRank && comp.curatedRank.current ? comp.curatedRank.current : comp.curatedRank;
  const n=Number(r);
  return n>0 && n<90 ? n : 99;
}
function isSec(comp){ return String((comp.team||{}).conferenceId)==="8"; }
function dates(){
  const out=[];
  for(let i=0;i<=3;i++){
    const d=new Date(Date.now()+i*86400000);
    out.push(d.toLocaleString("en-CA",{timeZone:"America/Chicago"}).slice(0,10).replace(/-/g,""));
  }
  return out;
}
async function eventsFor(lg){
  const base=lg==="nfl"
    ? "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard"
    : "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard";
  const seen=new Set(), evs=[];
  const days=lg==="nfl"?[""]:dates();
  for(const day of days){
    const url=base+(day?"?dates="+day+"&limit=200":"");
    const d=await (await fetch(url,{cache:"no-store"})).json();
    (d.events||[]).forEach(ev=>{ if(!seen.has(ev.id)){ seen.add(ev.id); evs.push(ev); } });
  }
  if(lg==="cfb") return evs.filter(ev=>((ev.competitions||[])[0].competitors||[]).some(c=>isSec(c)||rankOf(c)<=25));
  return evs;
}
function mapEv(ev,lg){
  const c=(ev.competitions||[])[0]||{};
  const st=((c.status||{}).type)||{};
  const comps=c.competitors||[];
  const away=comps.find(x=>x.homeAway==="away")||comps[0]||{};
  const home=comps.find(x=>x.homeAway==="home")||comps[1]||{};
  const team=x=>{
    const t=x.team||{};
    return {id:String(t.id||""), ab:t.abbreviation||"", name:t.shortDisplayName||t.displayName||"Team", score:x.score||"", rank:rankOf(x), logo:t.logo||("https://a.espncdn.com/i/teamlogos/"+(lg==="nfl"?"nfl":"ncaa")+"/500/"+t.id+".png")};
  };
  return {id:String(ev.id), state:st.state||"pre", detail:st.shortDetail||"", away:team(away), home:team(home)};
}
async function loadSlate(){
  const lg=state.lg;
  const evs=await eventsFor(lg);
  state.games=evs.map(ev=>mapEv(ev,lg)).sort((a,b)=>String(a.detail).localeCompare(String(b.detail)));
  $("meta").textContent=lg==="nfl"?"NFL · this week":"College · SEC and top 25 · this weekend";
  paint();
}
function started(g){ return g.state==="in"||g.state==="post"; }
async function pushCard(){
  const body={week:weekKey(state.lg), name:card().name.slice(0,24), lineup:card().picks, pts:0, locked_at:new Date().toISOString()};
  const r=await fetch(SUPA_URL+"/rest/v1/cards?on_conflict=week,name",{method:"POST",headers:headers({"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
}
async function paintBoard(){
  const r=await fetch(SUPA_URL+"/rest/v1/cards?week=eq."+encodeURIComponent(weekKey(state.lg))+"&select=name,lineup",{headers:headers()});
  const rows=r.ok?await r.json():[];
  const scored=rows.map(row=>{
    const picks=typeof row.lineup==="string"?JSON.parse(row.lineup):(row.lineup||{});
    let w=0,l=0,left=0;
    state.games.forEach(g=>{
      const pick=picks[g.id]; if(!pick) return;
      if(g.state!=="post"){ left++; return; }
      const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:"";
      if(winner&&pick===winner) w++; else if(winner) l++;
    });
    return {name:row.name,w,l,left};
  }).sort((a,b)=>b.w-a.w||a.l-b.l);
  const title=state.lg==="nfl"?"NFL standings":"College standings";
  $("boardView").innerHTML=`<p class="sub"><b>${title}</b><span>Separate board</span></p>`+(scored.map((x,i)=>`<div class="row"><b>#${i+1} ${x.name}</b><span>${x.w}-${x.l} · ${x.left} left</span></div>`).join("")||`<p class="sub">No locked cards on this board.</p>`);
}
function paint(){
  const picks=card().picks;
  $("games").innerHTML=state.games.map(g=>{
    const side=(tm,other)=>{
      const on=picks[g.id]===tm.id;
      const done=g.state==="post";
      const win=done&&+tm.score>+other.score;
      const loss=done&&on&&!win;
      return `<button type="button" class="pick${on?" on":""}${win?" win":""}${loss?" loss":""}" data-g="${g.id}" data-t="${tm.id}"><img alt="" src="${tm.logo}"/><b>${tm.rank<=25?"#"+tm.rank+" ":""}${tm.name}</b><span>${tm.score||tm.ab}</span></button>`;
    };
    return `<article class="match"><div class="top"><span>${g.detail||"Upcoming"}</span><span>${picks[g.id]?"Picked":""}</span></div><div class="vs">${side(g.away,g.home)}${side(g.home,g.away)}</div></article>`;
  }).join("")||`<p class="sub">No games in this slate.</p>`;
  $("games").querySelectorAll(".pick").forEach(b=>b.onclick=()=>{
    const g=state.games.find(x=>x.id===b.dataset.g);
    if(!g||!b.dataset.t) return;
    if(card().locked) return toast("Unlock to change an open game");
    if(started(g)) return toast("That game has started");
    card().picks[g.id]=b.dataset.t;
    saveLocal(); paint();
  });
  saveLocal();
  $("lock").textContent=card().locked?"Locked":"Lock card";
}
function setLg(lg){
  state.lg=lg;
  $("lgNfl").classList.toggle("on", lg==="nfl");
  $("lgCfb").classList.toggle("on", lg==="cfb");
  $("cardName").value=card().name||"";
  loadSlate();
}
$("lgNfl").onclick=()=>setLg("nfl");
$("lgCfb").onclick=()=>setLg("cfb");
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on", x===b));
  const board=b.dataset.tab==="board";
  $("cardView").hidden=board; $("boardView").hidden=!board; $("lockbar").style.display=board?"none":"flex";
  if(board) paintBoard();
});
$("cardName").oninput=saveLocal;
$("lock").onclick=async()=>{
  saveLocal();
  if(!card().name) return toast("Add your name");
  if(!Object.keys(card().picks).length) return toast("Pick a game first");
  card().locked=true; saveLocal();
  try{ await pushCard(); toast(state.lg==="nfl"?"NFL card locked":"College card locked"); }
  catch(e){ toast("Saved on this phone"); }
  paint();
};
$("unlock").onclick=()=>{ card().locked=false; saveLocal(); toast("Open games can change"); paint(); };
loadLocal(); loadSlate();
</script>
</body>
</html>
