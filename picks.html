<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sauce Pick Em</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#07080c;--orange:#ff7a18;--text:#f7f2ea;--muted:#9b9288;--line:#2a241c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,sans-serif}
body{max-width:760px;margin:0 auto;min-height:100dvh}
.top{display:flex;align-items:flex-end;padding:14px 16px 10px;background:linear-gradient(90deg,#2a1408,#07080c 62%);border-bottom:2px solid var(--orange)}
.top b{font-family:"Bebas Neue",sans-serif;font-size:34px;letter-spacing:.04em}
.top em{color:var(--orange);font-style:normal}
.top a,.top button{margin-left:auto;border:0;background:none;color:#ffc46b;font-weight:800;letter-spacing:.12em;text-decoration:none}
.screen{display:none}.screen.on{display:block;padding-bottom:84px}
.doors{display:grid;gap:12px;padding:18px}
.door{border:0;border-radius:18px;padding:28px 18px;text-align:left;color:#fff;background:#120e0c linear-gradient(115deg,rgba(255,122,24,.35),transparent 42%);border:1px solid rgba(255,122,24,.4)}
.door b{display:block;font-family:"Bebas Neue",sans-serif;font-size:54px;line-height:.9}
.door span{color:#e8d7c6}
.strip{display:flex;gap:18px;padding:12px 16px;color:var(--muted);font-size:11px;letter-spacing:.14em;font-weight:800}
.strip strong{display:block;color:#fff;font-family:"Bebas Neue",sans-serif;font-size:26px;letter-spacing:0}
.day{margin:8px 16px 4px;color:var(--orange);font-size:11px;letter-spacing:.16em;font-weight:800}
.plate{margin:8px 12px;background:#101218;border:1px solid #2a241c;border-radius:16px;overflow:hidden}
.plate .meta{display:flex;justify-content:space-between;padding:8px 12px;color:#9b9288;font-size:11px;font-weight:800;letter-spacing:.08em}
.sides{display:grid;grid-template-columns:1fr 64px 1fr}
.side{border:0;background:transparent;color:inherit;padding:12px 8px;text-align:center}
.side img{width:54px;height:54px;background:#fff;border-radius:14px;object-fit:contain;padding:5px}
.side b{display:block;margin-top:6px;font-size:14px}
.side span{color:#9b9288;font-size:11px}
.side.on{background:#2a170c;box-shadow:inset 0 -3px 0 var(--orange)}
.vs{display:grid;place-items:center;color:var(--orange);font-family:"Bebas Neue",sans-serif;font-size:20px}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:none;grid-template-columns:1fr 1fr;background:#101218;border-top:2px solid var(--orange)}
.nav.on{display:grid}
.nav button{border:0;background:transparent;color:#9b9288;padding:16px;font-weight:800;letter-spacing:.08em}
.nav button.on{color:#140800;background:var(--orange)}
.seat{width:100%;border:0;background:#101218;color:inherit;display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:14px;text-align:left;border-bottom:1px solid #221e18}
.seat .rk{font-family:"Bebas Neue",sans-serif;font-size:32px;color:var(--orange)}
.seat b{font-size:18px}
.seat span{color:#9b9288;font-size:12px}
.meter{height:6px;border-radius:99px;background:#241e18;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#3ee0a0,#ff7a18)}
.rec{font-family:"Bebas Neue",sans-serif;font-size:28px}
.backbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:12px;background:#1b140e;border-bottom:2px solid var(--orange)}
.backbar button{border:0;background:var(--orange);color:#140800;font-weight:800;padding:10px 14px;border-radius:999px}
.backbar b{font-family:"Bebas Neue",sans-serif;font-size:30px}
.scard{display:block;margin:8px 12px;padding:12px;background:#101218;border:1px solid #2a241c;border-radius:8px;color:inherit;text-decoration:none}
.scard.live{border-color:#3ee0a0;background:#0c1612;box-shadow:inset 3px 0 0 #3ee0a0}
.scard.hit{border-color:#3ee0a0}
.scard.miss{border-color:#ff5a3c}
.scard .line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.scard .nm{display:flex;align-items:center;gap:8px;font-family:"Bebas Neue",sans-serif;font-size:20px}
.scard .nm.r{justify-content:flex-end}
.scard img{width:36px;height:36px;background:#fff;border-radius:50%;object-fit:contain;padding:3px}
.scard .sc{font-family:"Bebas Neue",sans-serif;font-size:34px;display:flex;gap:8px}
.scard .sc em{font-style:normal;min-width:1.1em;text-align:center}
.scard .win{color:#3ee0a0}
.scard .pick{box-shadow:inset 0 -2px 0 #ff7a18}
.scard .sub{margin-top:6px;color:#c9c2b8;font-size:12px}
.lockbar{display:none;gap:8px;padding:12px;position:sticky;bottom:64px;background:#1b140e}
.lockbar.on{display:grid;grid-template-columns:1fr auto}
.lockbar input{background:#101218;border:1px solid #3a2a18;color:#fff;border-radius:10px;padding:12px}
.lockbar button{border:0;background:var(--orange);color:#140800;font-weight:800;border-radius:10px;padding:0 16px}
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#1b140e;border:1px solid var(--orange);padding:8px 12px;display:none}
</style>
</head>
<body>
<header class="top"><b>SAUCE <em>PICK EM</em></b><a href="/">HOME</a></header>
<section class="screen on" id="choose">
  <div class="doors">
    <button class="door" id="lgNfl" type="button"><b>NFL</b><span>Week slate</span></button>
    <button class="door" id="lgCfb" type="button"><b>COLLEGE</b><span>SEC and ranked</span></button>
  </div>
</section>
<section class="screen" id="slate">
  <div class="strip"><span>PICKS<strong id="made">0</strong></span><span>RECORD<strong id="rec">0-0</strong></span><span>OPEN<strong id="open">0</strong></span></div>
  <div id="games"></div>
  <div class="lockbar" id="lockbar"><input id="cardName" maxlength="24" placeholder="Name on the board"/><button id="lock" type="button">Lock</button></div>
</section>
<section class="screen" id="board"><div id="boardList"></div></section>
<section class="screen" id="match"></section>
<nav class="nav" id="nav"><button class="on" data-view="slate" type="button">SLATE</button><button data-view="board" type="button">BOARD</button></nav>
<div class="toast" id="toast"></div>
<script>
const SUPA_URL="https://cgxgyxzyunokiqfedtqp.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNneGd5eHp5dW5va2lxZmVkdHFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzQ2OTMsImV4cCI6MjEwNTc1MDY5M30.LBhCjY33GLZZ3BbpLVqoyx8ND20Egow0yH_rkui09pU";
const state={lg:"nfl",games:[],board:[],cards:{nfl:{picks:{},name:"",locked:false},cfb:{picks:{},name:"",locked:false}}};
const $ = id => document.getElementById(id);
function toast(m){ const t=$("toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",1400); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id)); $("nav").classList.toggle("on", id==="slate"||id==="board"); }
function weekKey(lg){
  const fmt=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"});
  const parts=fmt.formatToParts(new Date()); const g=k=>parts.find(x=>x.type===k).value;
  const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}; const dow=map[g("weekday")];
  const dt=new Date(Date.UTC(+g("year"),+g("month")-1,+g("day"))); dt.setUTCDate(dt.getUTCDate()-(dow>=3?dow-3:dow+4));
  return "pem-"+lg+"-"+dt.toISOString().slice(0,10);
}
function card(){ return state.cards[state.lg]; }
function loadLocal(){ ["nfl","cfb"].forEach(lg=>{ try{ state.cards[lg]=Object.assign({picks:{},name:"",locked:false}, JSON.parse(localStorage.getItem("saucePick."+weekKey(lg))||"{}")); }catch(e){ state.cards[lg]={picks:{},name:"",locked:false}; } }); $("cardName").value=card().name||""; }
function headers(extra){ return Object.assign({apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"}, extra||{}); }
function rankOf(comp){ const r=comp.curatedRank&&comp.curatedRank.current?comp.curatedRank.current:comp.curatedRank; const n=Number(r); return n>0&&n<90?n:99; }
function isSec(comp){ return String((comp.team||{}).conferenceId)==="8"; }
function dates(){ const out=[]; for(let i=0;i<=3;i++){ const d=new Date(Date.now()+i*86400000); out.push(d.toLocaleString("en-CA",{timeZone:"America/Chicago"}).slice(0,10).replace(/-/g,"")); } return out; }
async function eventsFor(lg){
  const base=lg==="nfl"?"https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard":"https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard";
  const seen=new Set(), evs=[]; const days=lg==="nfl"?[""]:dates();
  for(const day of days){ const d=await (await fetch(base+(day?"?dates="+day+"&limit=200":""),{cache:"no-store"})).json(); (d.events||[]).forEach(ev=>{ if(!seen.has(ev.id)){ seen.add(ev.id); evs.push(ev); } }); }
  if(lg==="cfb") return evs.filter(ev=>((ev.competitions||[])[0].competitors||[]).some(c=>isSec(c)||rankOf(c)<=25));
  return evs;
}
function recOf(c){ const r=(c.records||[]).find(x=>x.type==="total")||(c.records||[])[0]; return r?r.summary:""; }
function mapEv(ev,lg){
  const c=(ev.competitions||[])[0]||{}; const st=((c.status||{}).type)||{}; const comps=c.competitors||[];
  const away=comps.find(x=>x.homeAway==="away")||comps[0]||{}; const home=comps.find(x=>x.homeAway==="home")||comps[1]||{};
  const team=x=>{ const t=x.team||{}; return {id:String(t.id||""), ab:t.abbreviation||"", name:t.shortDisplayName||t.displayName||"Team", score:x.score||"", rec:recOf(x), logo:t.logo||("https://a.espncdn.com/i/teamlogos/"+(lg==="nfl"?"nfl":"ncaa")+"/500/"+t.id+".png")}; };
  const broad=((c.broadcasts||[])[0]||{}).names||[];
  return {id:String(ev.id), state:st.state||"pre", detail:st.shortDetail||"", kick:ev.date||"", away:team(away), home:team(home), tv:broad.join(" / ")};
}
function started(g){ return g.state==="in"||g.state==="post"; }
function dayLabel(iso){ return new Date(iso).toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric",timeZone:"America/Chicago"}); }
function saveLocal(){
  card().name=$("cardName").value.trim();
  localStorage.setItem("saucePick."+weekKey(state.lg), JSON.stringify(card()));
  const ready=state.games.length&&Object.keys(card().picks).length===state.games.length;
  $("lockbar").classList.toggle("on", ready);
  const picks=card().picks; let w=0,l=0,open=0;
  state.games.forEach(g=>{ if(!started(g)) open++; const pick=picks[g.id]; if(!pick||g.state!=="post") return; const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:""; if(winner&&pick===winner) w++; else if(winner) l++; });
  $("made").textContent=Object.keys(picks).length+"/"+state.games.length; $("rec").textContent=w+"-"+l; $("open").textContent=open;
}
function paint(){
  const picks=card().picks;
  let day="";
  $("games").innerHTML=state.games.map(g=>{
    const head=day===dayLabel(g.kick)?"":(day=dayLabel(g.kick), `<div class="day">${day}</div>`);
    return head+`<article class="plate"><div class="meta"><span>${g.detail||"UPCOMING"}</span><span>${g.tv||""}</span></div><div class="sides">
      <button class="side${picks[g.id]===g.away.id?" on":""}" data-g="${g.id}" data-t="${g.away.id}" type="button"><img alt="" src="${g.away.logo}"/><b>${g.away.name}</b><span>${g.away.score||g.away.rec}</span></button>
      <div class="vs">AT</div>
      <button class="side${picks[g.id]===g.home.id?" on":""}" data-g="${g.id}" data-t="${g.home.id}" type="button"><img alt="" src="${g.home.logo}"/><b>${g.home.name}</b><span>${g.home.score||g.home.rec}</span></button>
    </div></article>`;
  }).join("");
  $("games").querySelectorAll(".side").forEach(b=>b.onclick=()=>pick(b.dataset.g,b.dataset.t));
  saveLocal();
}
function pick(id,tid){
  const g=state.games.find(x=>x.id===id); if(!g) return;
  if(card().locked) return toast("Locked"); if(started(g)) return toast("Started");
  card().picks[id]=tid; saveLocal(); paint();
}
async function pushCard(){
  const body={week:weekKey(state.lg), name:card().name.slice(0,24), lineup:card().picks, pts:0, locked_at:new Date().toISOString()};
  const r=await fetch(SUPA_URL+"/rest/v1/cards?on_conflict=week,name",{method:"POST",headers:headers({"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
}
function resultOf(g,pick){
  if(g.state!=="post") return "open";
  const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:"";
  return !winner?"push":pick===winner?"hit":"miss";
}
function openCard(name){
  state.openName=name;
  const row=(state.board||[]).find(x=>x.name===name); if(!row) return;
  const picks=row.picks||{};
  const rows=state.games.filter(g=>picks[g.id]).map(g=>{
    const cls=resultOf(g,picks[g.id]);
    const live=g.state==="in"?" live":"";
    const href="/?league="+(state.lg==="nfl"?"nfl":"cfb")+"&game="+g.id;
    const as=g.away.score||(g.state==="pre"?"–":"0");
    const hs=g.home.score||(g.state==="pre"?"–":"0");
    const aw=cls==="hit"&&picks[g.id]===g.away.id?" win":cls==="miss"&&picks[g.id]===g.away.id?"":"";
    const hw=cls==="hit"&&picks[g.id]===g.home.id?" win":"";
    return `<a class="scard ${cls}${live}" href="${href}"><div class="line">
      <div class="nm${picks[g.id]===g.away.id?" pick":""}${aw}"><img alt="" src="${g.away.logo}"/><span>${g.away.name}</span></div>
      <div class="sc"><em class="${aw.trim()}">${as}</em><em class="${hw.trim()}">${hs}</em></div>
      <div class="nm r${picks[g.id]===g.home.id?" pick":""}${hw}"><span>${g.home.name}</span><img alt="" src="${g.home.logo}"/></div>
    </div><div class="sub">${g.detail||""}</div></a>`;
  }).join("");
  $("match").innerHTML=`<div class="backbar"><button id="backBoard" type="button">Board</button><b>${name}</b><span style="margin-left:auto;font-family:Bebas Neue,sans-serif;font-size:28px;color:#ff7a18">${row.w}-${row.l}</span></div>${rows}`;
  show("match");
  $("backBoard").onclick=()=>show("board");
}
async function paintBoard(){
  const r=await fetch(SUPA_URL+"/rest/v1/cards?week=eq."+encodeURIComponent(weekKey(state.lg))+"&week=like.pem-*&select=name,lineup",{headers:headers()});
  const rows=r.ok?await r.json():[];
  const scored=rows.map(row=>{ const picks=typeof row.lineup==="string"?JSON.parse(row.lineup):(row.lineup||{}); let w=0,l=0,done=0; state.games.forEach(g=>{ const pick=picks[g.id]; if(!pick||g.state!=="post") return; done++; const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:""; if(winner&&pick===winner) w++; else if(winner) l++; }); return {name:row.name,w,l,done,picks}; }).sort((a,b)=>b.w-a.w||a.l-b.l||a.name.localeCompare(b.name));
  state.board=scored;
  $("boardList").innerHTML=scored.length?scored.map((x,i)=>{
    const pct=x.done?Math.round(x.w/x.done*100):0;
    return `<button class="seat" type="button" data-who="${x.name}"><div class="rk">${i+1}</div><div><b>${x.name}</b><span>${Object.keys(x.picks).length} picks</span><div class="meter"><i style="width:${pct}%"></i></div></div><div class="rec">${x.w}-${x.l}</div></button>`;
  }).join(""):"<p style='padding:20px;color:#9b9288'>No locked cards in this league.</p>";
  $("boardList").querySelectorAll("[data-who]").forEach(b=>b.onclick=()=>openCard(b.dataset.who));
}
async function load(){ state.games=(await eventsFor(state.lg)).map(ev=>mapEv(ev,state.lg)).sort((a,b)=>String(a.kick).localeCompare(String(b.kick))); paint(); }
function setLg(lg){ state.lg=lg; loadLocal(); show("slate"); document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on", x.dataset.view==="slate")); load(); }
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on",x===b)); show(b.dataset.view); if(b.dataset.view==="board"){ load().then(paintBoard); } });
setInterval(()=>{ if($("board").classList.contains("on")||$("match").classList.contains("on")) load().then(()=>{ if($("board").classList.contains("on")) paintBoard(); if($("match").classList.contains("on")&&state.openName) openCard(state.openName); }); }, 30000);
$("lgNfl").onclick=()=>setLg("nfl"); $("lgCfb").onclick=()=>setLg("cfb");
$("cardName").oninput=saveLocal;
$("lock").onclick=async()=>{
  saveLocal();
  if(!card().name) return toast("Name");
  if(Object.keys(card().picks).length!==state.games.length) return toast("Finish the slate");
  card().locked=true; saveLocal();
  try{ await pushCard(); toast("On the board"); paintBoard(); show("board"); }
  catch(e){ toast("Not saved"); }
};
loadLocal();
</script>
</body>
</html>
