<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sauce Pick Em</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#07080c;--orange:#ff7a18;--text:#f6f1ea;--muted:#9a938a;--line:#2a241c;--card:#12151c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,sans-serif}
body{max-width:720px;margin:0 auto;padding-bottom:88px}
.top{display:flex;align-items:flex-end;padding:16px 16px 10px;border-bottom:2px solid var(--orange)}
.top b{font-family:"Bebas Neue",sans-serif;font-size:34px;letter-spacing:.05em}
.top b em{color:var(--orange);font-style:normal}
.top a{margin-left:auto;color:var(--muted);text-decoration:none;font-size:12px;font-weight:800}
.tabs{display:flex;gap:8px;padding:12px 16px 0}
.tabs button{border:0;background:transparent;color:var(--muted);font-weight:800;letter-spacing:.08em;padding:8px 0;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-color:var(--orange)}
.strip{display:flex;gap:18px;padding:10px 16px 6px;color:var(--muted);font-size:12px;font-weight:800}
.strip strong{color:var(--text);font-family:"Bebas Neue",sans-serif;font-size:22px;font-weight:500}
.match{margin:10px 12px;background:linear-gradient(180deg,#171b24,#10131a);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ask{padding:10px 14px 0;font-size:11px;letter-spacing:.14em;color:var(--orange);font-weight:800}
.row{display:grid;grid-template-columns:1fr 92px 1fr;align-items:stretch}
.team{border:0;background:transparent;color:inherit;padding:14px 10px 16px;text-align:center}
.team img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:16px;padding:6px}
.team b{display:block;margin-top:6px;font-size:16px}
.team span{display:block;color:var(--muted);font-size:12px;font-weight:700}
.team.on{background:linear-gradient(180deg,rgba(255,122,24,.35),rgba(255,122,24,.08));box-shadow:inset 0 -4px 0 var(--orange)}
.team.win{box-shadow:inset 0 -4px 0 #3ee0a0}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;color:var(--muted);font-weight:800}
.mid em{font-style:normal;color:var(--text);font-size:12px}
.bar{height:4px;margin:0 14px 12px;background:#2a241c;border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--orange)}
.bar u{display:block;height:100%;background:#3a342c;text-decoration:none}
.preview{display:none;border-top:1px solid var(--line);padding:12px 14px 14px;background:#0c0e14}
.match.open .preview{display:block}
.kicker{font-family:"Bebas Neue",sans-serif;font-size:28px;letter-spacing:.03em;margin:0 0 8px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.facts span{border:1px solid #3a2a18;border-radius:99px;padding:5px 10px;font-size:12px;color:#ffc46b}
.lead{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lead div{background:#101218;border-radius:10px;padding:8px 10px}
.lead span{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;font-weight:800}
.dock{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);width:min(720px,calc(100% - 16px));display:grid;grid-template-columns:1fr 1fr 1fr;background:#101218;border:1px solid #3a2a18;border-radius:14px;overflow:hidden}
.dock button{border:0;background:transparent;color:var(--muted);padding:14px;font-weight:800}
.dock button.on{background:var(--orange);color:#140800}
.view{display:none}.view.on{display:block}
.line{display:flex;justify-content:space-between;margin:8px 12px;padding:12px;background:#12151c;border-radius:12px}
input{width:calc(100% - 24px);margin:8px 12px;background:#101218;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#1b140e;border:1px solid var(--orange);padding:8px 12px;display:none}
</style>
</head>
<body>
<header class="top"><b>SAUCE <em>PICK EM</em></b><a href="/">HOME</a></header>
<div class="tabs"><button type="button" id="lgNfl" class="on">NFL</button><button type="button" id="lgCfb">COLLEGE</button></div>
<div class="strip"><span>PICKS <strong id="made">0</strong></span><span>RECORD <strong id="rec">0-0</strong></span><span>OPEN <strong id="open">0</strong></span></div>
<section class="view on" id="slate"><div id="games"></div></section>
<section class="view" id="ticket"><input id="cardName" maxlength="24" placeholder="Name"/><div id="ticketList"></div></section>
<section class="view" id="board"><div id="boardList"></div></section>
<div class="dock"><button type="button" class="on" data-view="slate">Picks</button><button type="button" data-view="ticket">Ticket</button><button type="button" data-view="board">Board</button></div>
<div class="toast" id="toast"></div>
<script>
const SUPA_URL="https://cgxgyxzyunokiqfedtqp.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNneGd5eHp5dW5va2lxZmVkdHFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzQ2OTMsImV4cCI6MjEwNTc1MDY5M30.LBhCjY33GLZZ3BbpLVqoyx8ND20Egow0yH_rkui09pU";
const state={lg:"nfl",openId:"",games:[],extra:{},cards:{nfl:{picks:{},name:"",locked:false},cfb:{picks:{},name:"",locked:false}}};
const $ = id => document.getElementById(id);
function toast(m){ const t=$("toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",1200); }
function weekKey(lg){
  const fmt=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"});
  const parts=fmt.formatToParts(new Date()); const g=k=>parts.find(x=>x.type===k).value;
  const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}; const dow=map[g("weekday")];
  const dt=new Date(Date.UTC(+g("year"),+g("month")-1,+g("day"))); dt.setUTCDate(dt.getUTCDate()-(dow>=3?dow-3:dow+4));
  return "pem-"+lg+"-"+dt.toISOString().slice(0,10);
}
function card(){ return state.cards[state.lg]; }
function loadLocal(){ ["nfl","cfb"].forEach(lg=>{ try{ state.cards[lg]=Object.assign({picks:{},name:"",locked:false}, JSON.parse(localStorage.getItem("saucePick."+weekKey(lg))||"{}")); }catch(e){ state.cards[lg]={picks:{},name:"",locked:false}; } }); $("cardName").value=card().name||""; }
function headers(extra){ return Object.assign({apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"}, extra||{}); }
function rankOf(comp){ const r=comp.curatedRank&&comp.curatedRank.current?comp.curatedRank.current:comp.curatedRank; const n=Number(r); return n>0&&n<90?n:99; }
function isSec(comp){ return String((comp.team||{}).conferenceId)==="8"; }
function dates(){ const out=[]; for(let i=0;i<=3;i++){ const d=new Date(Date.now()+i*86400000); out.push(d.toLocaleString("en-CA",{timeZone:"America/Chicago"}).slice(0,10).replace(/-/g,"")); } return out; }
async function eventsFor(lg){
  const base=lg==="nfl"?"https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard":"https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard";
  const seen=new Set(), evs=[]; const days=lg==="nfl"?[""]:dates();
  for(const day of days){ const d=await (await fetch(base+(day?"?dates="+day+"&limit=200":""),{cache:"no-store"})).json(); (d.events||[]).forEach(ev=>{ if(!seen.has(ev.id)){ seen.add(ev.id); evs.push(ev); } }); }
  if(lg==="cfb") return evs.filter(ev=>((ev.competitions||[])[0].competitors||[]).some(c=>isSec(c)||rankOf(c)<=25));
  return evs;
}
function recOf(c){ const r=(c.records||[]).find(x=>x.type==="total")||(c.records||[])[0]; return r?r.summary:""; }
function mapEv(ev,lg){
  const c=(ev.competitions||[])[0]||{}; const st=((c.status||{}).type)||{}; const comps=c.competitors||[];
  const away=comps.find(x=>x.homeAway==="away")||comps[0]||{}; const home=comps.find(x=>x.homeAway==="home")||comps[1]||{};
  const team=x=>{ const t=x.team||{}; return {id:String(t.id||""), ab:t.abbreviation||"", name:t.shortDisplayName||t.displayName||"Team", score:x.score||"", rank:rankOf(x), rec:recOf(x), logo:t.logo||("https://a.espncdn.com/i/teamlogos/"+(lg==="nfl"?"nfl":"ncaa")+"/500/"+t.id+".png")}; };
  const odd=(c.odds||[])[0]||{}; const broad=((c.broadcasts||[])[0]||{}).names||[]; const venue=c.venue||{};
  const mlA=(odd.awayTeamOdds||{}).moneyLine, mlH=(odd.homeTeamOdds||{}).moneyLine;
  return {id:String(ev.id), state:st.state||"pre", detail:st.shortDetail||"", kick:ev.date||c.date||"", away:team(away), home:team(home), spread:odd.details||"", over:odd.overUnder?String(odd.overUnder):"", mlA:mlA?String(mlA):"", mlH:mlH?String(mlH):"", tv:broad.join(" / "), place:[venue.fullName,(venue.address||{}).city].filter(Boolean).join(" · "), note:(ev.competitions[0].notes||[])[0]&&ev.competitions[0].notes[0].headline||""};
}
function started(g){ return g.state==="in"||g.state==="post"; }
function saveLocal(){
  card().name=$("cardName").value.trim();
  localStorage.setItem("saucePick."+weekKey(state.lg), JSON.stringify(card()));
  const picks=card().picks; let w=0,l=0,open=0;
  state.games.forEach(g=>{ if(!started(g)) open++; const pick=picks[g.id]; if(!pick||g.state!=="post") return; const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:""; if(winner&&pick===winner) w++; else if(winner) l++; });
  $("made").textContent=Object.keys(picks).length+"/"+state.games.length; $("rec").textContent=w+"-"+l; $("open").textContent=open;
}
async function loadExtra(id){
  if(state.extra[id]) return state.extra[id];
  const sport=state.lg==="nfl"?"nfl":"college-football";
  try{
    const d=await (await fetch("https://site.api.espn.com/apis/site/v2/sports/football/"+sport+"/summary?event="+id,{cache:"no-store"})).json();
    const leaders=(d.leaders||[]).slice(0,3).map(cat=>{
      const a=(cat.leaders||[])[0], h=(cat.leaders||[])[1];
      const one=x=>x&&x.athlete?x.athlete.shortName+" "+(x.displayValue||""):"";
      return {name:cat.displayName||cat.name, a:one(a), h:one(h)};
    });
    const prev=((d.article||{}).headline)||((d.header||{}).competitions||[])[0]&&"";
    state.extra[id]={leaders, headline:d.article&&d.article.headline||""};
  }catch(e){ state.extra[id]={leaders:[], headline:""}; }
  return state.extra[id];
}
function paint(){
  const picks=card().picks;
  $("games").innerHTML=state.games.map(g=>{
    const side=(tm,ml)=>{
      const on=picks[g.id]===tm.id; const other=tm===g.away?g.home:g.away; const win=g.state==="post"&&+tm.score>+other.score;
      return `<button type="button" class="team${on?" on":""}${win?" win":""}" data-g="${g.id}" data-t="${tm.id}"><img alt="" src="${tm.logo}"/><b>${tm.rank<=25?"#"+tm.rank+" ":""}${tm.name}</b><span>${tm.score||tm.rec||""} ${ml?ml:""}</span></button>`;
    };
    const ex=state.extra[g.id];
    const leads=ex&&ex.leaders&&ex.leaders.length?ex.leaders.map(x=>`<div><span>${x.name}</span><b>${x.a||"—"}</b><b>${x.h||"—"}</b></div>`).join(""):"";
    return `<article class="match${state.openId===g.id?" open":""}"><div class="ask">WHO WINS</div><div class="row">${side(g.away,g.mlA)}<button type="button" class="mid" data-open="${g.id}"><em>${g.detail||"AT"}</em><span>${g.tv||"PREVIEW"}</span></button>${side(g.home,g.mlH)}</div><div class="bar"><i style="width:50%"></i><u style="width:50%"></u></div><div class="preview"><p class="kicker">${(ex&&ex.headline)||g.note||g.away.name+" at "+g.home.name}</p><div class="facts"><span>${g.place||"Site"}</span><span>${g.spread||"Line"}</span><span>${g.over?("O/U "+g.over):"Total"}</span><span>${g.tv||"TV"}</span></div><div class="lead">${leads}</div></div></article>`;
  }).join("");
  $("games").querySelectorAll("[data-open]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.open;
    state.openId=state.openId===id?"":id;
    if(state.openId) await loadExtra(id);
    paint();
  });
  $("games").querySelectorAll(".team").forEach(b=>b.onclick=()=>{
    const g=state.games.find(x=>x.id===b.dataset.g); if(!g) return;
    if(card().locked) return toast("Locked"); if(started(g)) return toast("Started");
    card().picks[g.id]=b.dataset.t; saveLocal(); paint();
  });
  saveLocal();
}
function paintTicket(){
  const picks=card().picks;
  $("ticketList").innerHTML=state.games.filter(g=>picks[g.id]).map(g=>{ const tm=picks[g.id]===g.away.id?g.away:g.home; return `<div class="line"><b>${tm.name}</b><span>${g.away.ab} at ${g.home.ab}</span></div>`; }).join("");
}
async function paintBoard(){
  const r=await fetch(SUPA_URL+"/rest/v1/cards?week=eq."+encodeURIComponent(weekKey(state.lg))+"&select=name,lineup",{headers:headers()});
  const rows=r.ok?await r.json():[];
  const scored=rows.map(row=>{ const picks=typeof row.lineup==="string"?JSON.parse(row.lineup):(row.lineup||{}); let w=0,l=0; state.games.forEach(g=>{ const pick=picks[g.id]; if(!pick||g.state!=="post") return; const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:""; if(winner&&pick===winner) w++; else if(winner) l++; }); return {name:row.name,w,l}; }).sort((a,b)=>b.w-a.w||a.l-b.l);
  $("boardList").innerHTML=scored.map((x,i)=>`<div class="line"><b>${i+1}  ${x.name}</b><span>${x.w}-${x.l}</span></div>`).join("");
}
async function load(){ state.games=(await eventsFor(state.lg)).map(ev=>mapEv(ev,state.lg)).sort((a,b)=>String(a.kick).localeCompare(String(b.kick))); state.openId=""; paint(); }
function setLg(lg){ state.lg=lg; $("lgNfl").classList.toggle("on",lg==="nfl"); $("lgCfb").classList.toggle("on",lg==="cfb"); loadLocal(); load(); }
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on",x===b)); document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===b.dataset.view)); if(b.dataset.view==="board") paintBoard(); if(b.dataset.view==="ticket") paintTicket(); });
$("lgNfl").onclick=()=>setLg("nfl"); $("lgCfb").onclick=()=>setLg("cfb"); $("cardName").oninput=saveLocal;
loadLocal(); load();
</script>
</body>
</html>
