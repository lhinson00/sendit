<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#05060a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Sauce"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/icon-180.png"/>
<title>Sauce Pick Em</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#07080c;--orange:#ff7a18;--text:#f7f2ea;--muted:#9b9288;--line:#2a241c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,sans-serif}
body{max-width:1120px;margin:0 auto;min-height:100dvh;background:#05060a}
.top{display:flex;align-items:center;padding:14px 16px 10px;background:linear-gradient(90deg,#2a1408,#07080c 62%);border-bottom:2px solid var(--orange)}
.top b{font-family:"Bebas Neue",sans-serif;font-size:34px;letter-spacing:.04em}
.top em{color:var(--orange);font-style:normal}
.top a{margin-left:auto;border:0;background:none;color:#ffc46b;font-weight:800;letter-spacing:.12em;text-decoration:none}
.screen{display:none}.screen.on{display:block;padding-bottom:84px}
body:has(.lockbar.on) .screen.on{padding-bottom:150px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px}
.door{border:0;border-radius:18px;padding:22px 14px;text-align:left;color:#fff;background:#120e0c linear-gradient(115deg,rgba(255,122,24,.35),transparent 42%);border:1px solid rgba(255,122,24,.4)}
.door img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:16px;padding:6px}
.door b{display:block;font-family:"Bebas Neue",sans-serif;font-size:54px;line-height:.9}
.door span{color:#e8d7c6}
.strip{display:flex;gap:18px;padding:12px 16px;color:var(--muted);font-size:11px;letter-spacing:.14em;font-weight:800}
.strip strong{display:block;color:#fff;font-family:"Bebas Neue",sans-serif;font-size:26px;letter-spacing:0}
.day{margin:8px 16px 4px;color:var(--orange);font-size:11px;letter-spacing:.16em;font-weight:800}
.plate{margin:8px 12px;background:#101218;border:1px solid #2a241c;border-radius:16px;overflow:hidden}
.plate .meta{display:flex;justify-content:space-between;padding:8px 12px;color:#9b9288;font-size:11px;font-weight:800;letter-spacing:.08em}
.sides{display:grid;grid-template-columns:1fr 64px 1fr}
.side{border:0;background:transparent;color:inherit;padding:12px 8px;text-align:center}
.side img{width:54px;height:54px;background:#fff;border-radius:14px;object-fit:contain;padding:5px}
.side b{display:block;margin-top:6px;font-size:14px}
.side span{color:#9b9288;font-size:11px}
.side.on{background:#2a170c;box-shadow:inset 0 -3px 0 var(--orange)}
.vs{display:grid;place-items:center;color:var(--orange);font-family:"Bebas Neue",sans-serif;font-size:20px}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:none;grid-template-columns:1fr 1fr;background:#101218;border-top:2px solid var(--orange);padding-left:104px;box-sizing:border-box;z-index:30}
.nav.full{display:grid}
.navback{position:fixed;left:12px;bottom:8px;z-index:40;height:40px;padding:0 16px;border:0;border-radius:999px;background:#ff7a18;color:#140c08;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px;box-shadow:0 8px 18px rgba(0,0,0,.4)}
.nav button{border:0;background:transparent;color:#9b9288;padding:16px 8px;font-weight:800;letter-spacing:.08em}
.nav button.on{color:#140800;background:var(--orange)}
.seat{width:100%;border:0;background:#101218;color:inherit;display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:14px;text-align:left;border-bottom:1px solid #221e18}
.seat .rk{font-family:"Bebas Neue",sans-serif;font-size:32px;color:var(--orange)}
.seat b{font-size:18px}
.seat span{color:#9b9288;font-size:12px}
.meter{height:6px;border-radius:99px;background:#241e18;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#3ee0a0,#ff7a18)}
.rec{font-family:"Bebas Neue",sans-serif;font-size:28px}
:root{--orange:#ff7a18;--pad:14px;--muted:#9b9288;--text:#f4efe6}
.bar{display:flex;align-items:center;gap:10px;padding:8px var(--pad) 4px}
.back{border:0;background:0;color:var(--orange);font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:0;font-size:12px}
.list{display:grid;gap:14px;padding:8px var(--pad) 28px}
.gcard{display:block;width:100%;text-align:left;color:inherit;font:inherit;text-decoration:none;background:#101218;border:1px solid #2a241c;border-radius:8px;padding:16px}
.gcard.done{border-color:#fff}
.gcard .nm.win,.gcard .nm.win span{color:#3ee0a0}
.gcard .sc em.win{color:#3ee0a0;text-shadow:0 0 12px rgba(62,224,160,.25)}
.gcard .sc em.miss{color:#ff5a3c}
.gcard .nm.miss .star{color:#ff5a3c}
.gcard.live{border-color:#3ee0a0;background:#0c1612;box-shadow:inset 3px 0 0 #3ee0a0}
.gstat{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.gcard .bigline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:8px 0 6px}
.gcard .nm{font-family:"Bebas Neue",sans-serif;font-size:18px;line-height:1.05;display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.gcard .nm.r{justify-content:flex-end}
.gcard .nm .who{display:block;max-width:118px}
.pickside{border:0;background:transparent;color:inherit;font:inherit;padding:0;text-align:left}.pickside.r{text-align:right}.star{color:#5c564e;font-size:16px}.nm .star:first-child,.nm.r .star:last-child{color:#ff7a18}
.logoplate{width:36px;height:36px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex:none;box-shadow:0 0 0 1px #fff}
.logoplate img{width:28px;height:28px;object-fit:contain;background:transparent}
.gcard .sc{display:flex;align-items:center;justify-content:center;gap:10px;font-family:"Bebas Neue",sans-serif;font-size:36px;line-height:1;color:#fff}
.gcard .sc em{font-style:normal;min-width:1.15em;text-align:center}
.gcard .sc span{font-size:20px;color:#6a645c}
.gcard.live .sc em{color:var(--orange)}
.gcard .sub{font-size:12px;color:#c9c2b8;margin-top:6px;line-height:1.4}
.backbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:12px;background:#1b140e;border-bottom:2px solid var(--orange)}
.backbar button{border:0;background:var(--orange);color:#140800;font-weight:800;padding:10px 14px;border-radius:999px}
.backbar b{font-family:"Bebas Neue",sans-serif;font-size:30px}
.scard.live{border-color:#3ee0a0;background:#0c1612;box-shadow:inset 3px 0 0 #3ee0a0}
.scard.hit{border-color:#3ee0a0}
.scard.miss{border-color:#ff5a3c}
.scard .line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.scard .nm{display:flex;align-items:center;gap:8px;font-family:"Bebas Neue",sans-serif;font-size:20px}
.scard .nm.r{justify-content:flex-end}
.scard img{width:36px;height:36px;background:#fff;border-radius:50%;object-fit:contain;padding:3px}
.scard .sc{font-family:"Bebas Neue",sans-serif;font-size:34px;display:flex;gap:8px}
.scard .sc em{font-style:normal;min-width:1.1em;text-align:center}
.scard .win{color:#3ee0a0}
.scard .pick{box-shadow:inset 0 -2px 0 #ff7a18}
.scard .sub{margin-top:6px;color:#c9c2b8;font-size:12px}
#slate{padding-bottom:128px}.lockbar{display:none;margin:0;padding:0}
.lockbar.on{display:block;position:fixed;left:50%;bottom:64px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));z-index:20;background:transparent;padding:0;box-sizing:border-box}
.lockbar button{width:100%;height:44px;border:0;background:var(--orange);color:#140800;font-weight:800;border-radius:12px}
.whoami{margin:10px 16px 0;font-family:"Bebas Neue",sans-serif;font-size:28px;letter-spacing:.04em}
.whoami:empty{display:none}
.nameask{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:80;display:none;align-items:flex-end;justify-content:center}
.nameask.on{display:flex}
.nameask form{width:min(520px,100%);background:#101218;border-top:1px solid #3a2a18;padding:18px 16px 28px;display:grid;gap:10px}
.nameask p{margin:0;color:#9b9288;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.nameask input{background:#0c0d12;border:1px solid #3a2a18;color:#fff;border-radius:10px;padding:14px;font-size:16px}
.nameask button{border:0;background:var(--orange);color:#140800;font-weight:800;border-radius:10px;padding:14px}
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#1b140e;border:1px solid var(--orange);padding:8px 12px;display:none}
</style>
</head>
<body>
<header class="top"><b>SAUCE <em>PICK EM</em></b><a href="/">HOME</a></header>
<button type="button" class="navback" id="navBack">Back</button>
<section class="screen on" id="choose">
  <div class="doors">
    <button class="door" id="lgNfl" type="button"><img alt="" src="https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png"/><b>NFL</b><span>Week slate</span></button>
    <button class="door" id="lgCfb" type="button"><img alt="" src="https://a.espncdn.com/redesign/assets/img/icons/ESPN-icon-football-college.png"/><b>COLLEGE</b><span>SEC and ranked</span></button>
  </div>
</section>
<section class="screen" id="slate">
  <div class="strip"><span>PICKS<strong id="made">0</strong></span><span>RECORD<strong id="rec">0-0</strong></span><span>OPEN<strong id="open">0</strong></span></div>
  <p class="whoami" id="whoLine"></p>
  <div id="games"></div>
</section>
<section class="screen" id="board"><div id="boardList"></div></section>
<section class="screen" id="match"></section>
<nav class="nav" id="nav"><button class="on" data-view="slate" type="button">SLATE</button><button data-view="board" type="button">BOARD</button></nav>
<div class="lockbar" id="lockbar"><button id="lock" type="button">Lock</button></div>
<div class="toast" id="toast"></div>
<div class="nameask" id="nameAsk"><form onsubmit="return false">
  <p>Name on the board</p>
  <input id="nameAskInput" maxlength="24" placeholder="Your name" autocomplete="nickname"/>
  <button id="nameAskGo" type="button">Lock it</button>
</form></div>
<script>
const SUPA_URL="https://cgxgyxzyunokiqfedtqp.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNneGd5eHp5dW5va2lxZmVkdHFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzQ2OTMsImV4cCI6MjEwNTc1MDY5M30.LBhCjY33GLZZ3BbpLVqoyx8ND20Egow0yH_rkui09pU";
const state={lg:"nfl",games:[],board:[],cards:{nfl:{picks:{},name:"",locked:false},cfb:{picks:{},name:"",locked:false}}};
const $ = id => document.getElementById(id);
function toast(m){ const t=$("toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",1400); }
const hist=["choose"];
function screenNow(){ return hist[hist.length-1]||"choose"; }
function show(id, opt){
  opt=opt||{};
  if(!opt.back && hist[hist.length-1]!==id) hist.push(id);
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id));
  $("nav").classList.toggle("full", id!=="choose");
  paintLock();
  pinPick();
}
function goBack(){
  const ask=$("nameAsk");
  if(ask && ask.classList.contains("on")){ ask.classList.remove("on"); return; }
  if(hist.length<=1){ location.href="/"; return; }
  hist.pop();
  show(hist[hist.length-1], {back:true});
  if(screenNow()==="board") load().then(paintBoard);
}
function paintLock(){
  const btn=$("lock");
  const bar=$("lockbar");
  if(!btn||!bar) return;
  const here=screenNow();
  const need=state.games.filter(g=>!started(g));
  const ready=need.length>0&&need.every(g=>card().picks[g.id]);
  if(card().locked){
    btn.textContent="Unlock";
    bar.classList.toggle("on", here==="slate"||here==="board");
  }else{
    btn.textContent="Lock";
    bar.classList.toggle("on", here==="slate" && ready);
  }
}
function weekAnchor(){
  const fmt=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"});
  const parts=fmt.formatToParts(new Date()); const g=k=>parts.find(x=>x.type===k).value;
  const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}; const dow=map[g("weekday")];
  const dt=new Date(Date.UTC(+g("year"),+g("month")-1,+g("day")));
  dt.setUTCDate(dt.getUTCDate()-(dow>=3?dow-3:dow+4));
  return dt;
}
function weekKey(lg){
  return "pem-"+lg+"-"+weekAnchor().toISOString().slice(0,10);
}
function slateStamps(){
  const wed=weekAnchor();
  const out=[];
  for(let i=1;i<=5;i++){
    const dt=new Date(wed);
    dt.setUTCDate(wed.getUTCDate()+i);
    const m=String(dt.getUTCMonth()+1).padStart(2,"0"), d=String(dt.getUTCDate()).padStart(2,"0");
    out.push(dt.getUTCFullYear()+m+d);
  }
  return out;
}
function card(){ return state.cards[state.lg]; }
function loadLocal(){ ["nfl","cfb"].forEach(lg=>{ try{ state.cards[lg]=Object.assign({picks:{},name:"",locked:false}, JSON.parse(localStorage.getItem("saucePick."+weekKey(lg))||"{}")); }catch(e){ state.cards[lg]={picks:{},name:"",locked:false}; } }); const who=$("whoLine"); if(who) who.textContent=card().name||""; }
function headers(extra){ return Object.assign({apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"}, extra||{}); }
function rankOf(comp){ const r=comp.curatedRank&&comp.curatedRank.current?comp.curatedRank.current:comp.curatedRank; const n=Number(r); return n>0&&n<90?n:99; }
function isSec(comp){ return String((comp.team||{}).conferenceId)==="8"; }
function onSlateDay(ev){
  const iso=ev.date||(((ev.competitions||[])[0]||{}).date)||"";
  if(!iso) return false;
  const ymd=new Date(iso).toLocaleDateString("en-CA",{timeZone:"America/Chicago"}).replace(/-/g,"");
  return slateStamps().indexOf(ymd)>=0;
}
async function eventsFor(lg){
  const base=lg==="nfl"?"https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard":"https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard";
  const seen=new Set(), evs=[];
  for(const day of slateStamps()){
    const d=await (await fetch(base+"?dates="+day+"&limit=300",{cache:"no-store"})).json();
    (d.events||[]).forEach(ev=>{ if(!seen.has(ev.id) && onSlateDay(ev)){ seen.add(ev.id); evs.push(ev); } });
  }
  if(lg==="cfb") return evs.filter(ev=>((ev.competitions||[])[0].competitors||[]).some(c=>isSec(c)||rankOf(c)<=25));
  return evs;
}
function recOf(c){ const r=(c.records||[]).find(x=>x.type==="total")||(c.records||[])[0]; return r?r.summary:""; }
function mapEv(ev,lg){
  const c=(ev.competitions||[])[0]||{}; const st=((c.status||{}).type)||{}; const comps=c.competitors||[];
  const away=comps.find(x=>x.homeAway==="away")||comps[0]||{}; const home=comps.find(x=>x.homeAway==="home")||comps[1]||{};
  const team=x=>{ const t=x.team||{}; return {id:String(t.id||""), ab:t.abbreviation||"", name:t.displayName||t.shortDisplayName||"Team", score:x.score||"", rec:recOf(x), logo:t.logo||("https://a.espncdn.com/i/teamlogos/"+(lg==="nfl"?"nfl":"ncaa")+"/500/"+t.id+".png")}; };
  const broad=((c.broadcasts||[])[0]||{}).names||[];
  const sit=c.situation||{}; const last=(sit.lastPlay&&(sit.lastPlay.text||sit.lastPlay))||""; const down=[sit.shortDownDistanceText,sit.possessionText].filter(Boolean).join(" · "); return {id:String(ev.id), state:st.state||"pre", detail:st.shortDetail||"", kick:ev.date||"", away:team(away), home:team(home), tv:broad.join(" / "), play:down||last};
}
function started(g){ return g.state==="in"||g.state==="post"; }
function dayLabel(iso){ return new Date(iso).toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric",timeZone:"America/Chicago"}); }
function saveLocal(){
  localStorage.setItem("saucePick."+weekKey(state.lg), JSON.stringify(card()));
  const who=$("whoLine"); if(who) who.textContent=card().name||"";
  const need=state.games.filter(g=>!started(g));
  const ready=need.length>0&&need.every(g=>card().picks[g.id]);
  paintLock();
  const picks=card().picks; let w=0,l=0,open=0;
  state.games.forEach(g=>{ if(!started(g)) open++; const pick=picks[g.id]; if(!pick||g.state!=="post") return; const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:""; if(winner&&pick===winner) w++; else if(winner) l++; });
  $("made").textContent=Object.keys(picks).length+"/"+state.games.length; $("rec").textContent=w+"-"+l; $("open").textContent=open;
}
function paint(){
  const picks=card().picks;
  let last="";
  $("games").innerHTML=`<div class="list">`+state.games.map(g=>{
    const day=dayLabel(g.kick);
    const head=day!==last?`<div class="day">${day}</div>`:"";
    last=day;
    const when=g.detail||"";
    return head+`<article class="gcard">
      <div class="gstat"><span>${when}</span><span>${g.tv||""}</span></div>
      <div class="bigline">
        <button class="nm pickside" data-g="${g.id}" data-t="${g.away.id}" type="button"><span class="star">${picks[g.id]===g.away.id?"★":"☆"}</span><span class="logoplate"><img alt="" src="${g.away.logo}"/></span><span class="who">${g.away.name}</span></button>
        <div class="sc"><em>–</em><span>–</span><em>–</em></div>
        <button class="nm r pickside" data-g="${g.id}" data-t="${g.home.id}" type="button"><span class="who">${g.home.name}</span><span class="logoplate"><img alt="" src="${g.home.logo}"/></span><span class="star">${picks[g.id]===g.home.id?"★":"☆"}</span></button>
      </div>
    </article>`;
  }).join("")+`</div>`;
  $("games").querySelectorAll(".pickside").forEach(b=>b.onclick=()=>pick(b.dataset.g,b.dataset.t));
  saveLocal();
}
function pick(id,tid){
  const g=state.games.find(x=>x.id===id); if(!g) return;
  if(card().locked) return toast("Locked"); if(started(g)) return toast("Started");
  card().picks[id]=tid; saveLocal(); paint();
}
async function pushCard(){
  const body={week:weekKey(state.lg), name:card().name.slice(0,24), lineup:card().picks, pts:0, locked_at:new Date().toISOString()};
  const r=await fetch(SUPA_URL+"/rest/v1/cards?on_conflict=week,name",{method:"POST",headers:headers({"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
}
function resultOf(g,pick){
  if(g.state!=="post") return "open";
  const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:"";
  return !winner?"push":pick===winner?"hit":"miss";
}
function openCard(name){
  state.openName=name;
  const row=(state.board||[]).find(x=>x.name===name); if(!row) return;
  const picks=row.picks||{};
  const mine=String(name||"").trim().toLowerCase()===String(card().name||"").trim().toLowerCase();
  const rows=state.games.filter(g=>picks[g.id]).map(g=>{
    const reveal=mine || started(g);
    const cls=reveal?resultOf(g,picks[g.id]):"open";
    const live=g.state==="in"?" live":"";
    const done=g.state==="post"?" done":"";
    const href="/?league="+(state.lg==="nfl"?"nfl":"cfb")+"&game="+g.id;
    const aWin=reveal&&cls==="hit"&&picks[g.id]===g.away.id?" win":reveal&&cls==="miss"&&picks[g.id]===g.away.id?" miss":"";
    const hWin=reveal&&cls==="hit"&&picks[g.id]===g.home.id?" win":reveal&&cls==="miss"&&picks[g.id]===g.home.id?" miss":"";
    const when=g.state==="in"?("LIVE · "+(g.detail||"")):g.state==="post"?(g.detail||"Final"):(g.detail||"");
    const starA=reveal&&picks[g.id]===g.away.id?"★":"☆";
    const starH=reveal&&picks[g.id]===g.home.id?"★":"☆";
    return `<a class="gcard${live}${done}" href="${href}">
      <div class="gstat"><span>${when}</span><span>${g.tv||""}</span></div>
      <div class="bigline">
        <div class="nm${aWin}"><span class="star">${starA}</span><span class="logoplate"><img alt="" src="${g.away.logo}"/></span><span class="who">${g.away.name}</span></div>
        <div class="sc"><em class="${aWin.trim()}">${g.away.score||"–"}</em><span>–</span><em class="${hWin.trim()}">${g.home.score||"–"}</em></div>
        <div class="nm r${hWin}"><span class="who">${g.home.name}</span><span class="logoplate"><img alt="" src="${g.home.logo}"/></span><span class="star">${starH}</span></div>
      </div>
      <div class="sub">${reveal?(g.play||""):"Pick hidden until kickoff"}</div>
    </a>`;
  }).join("");
  $("match").innerHTML=`<div class="list">${rows}</div>`;
  show("match");
}
async function paintBoard(){
  const r=await fetch(SUPA_URL+"/rest/v1/cards?week=eq."+encodeURIComponent(weekKey(state.lg))+"&week=like.pem-*&select=name,lineup",{headers:headers()});
  const rows=r.ok?await r.json():[];
  const scored=rows.map(row=>{ const picks=typeof row.lineup==="string"?JSON.parse(row.lineup):(row.lineup||{}); let w=0,l=0,done=0; state.games.forEach(g=>{ const pick=picks[g.id]; if(!pick||g.state!=="post") return; done++; const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:""; if(winner&&pick===winner) w++; else if(winner) l++; }); return {name:row.name,w,l,done,picks}; }).sort((a,b)=>b.w-a.w||a.l-b.l||a.name.localeCompare(b.name));
  state.board=scored;
  $("boardList").innerHTML=scored.length?scored.map((x,i)=>{
    const pct=x.done?Math.round(x.w/x.done*100):0;
    return `<button class="seat" type="button" data-who="${x.name}"><div class="rk">${i+1}</div><div><b>${x.name}</b><span>${Object.keys(x.picks).length} picks</span><div class="meter"><i style="width:${pct}%"></i></div></div><div class="rec">${x.w}-${x.l}</div></button>`;
  }).join(""):"<p style='padding:20px;color:#9b9288'>No locked cards in this league.</p>";
  $("boardList").querySelectorAll("[data-who]").forEach(b=>b.onclick=()=>openCard(b.dataset.who));
}
async function load(){ state.games=(await eventsFor(state.lg)).map(ev=>mapEv(ev,state.lg)).sort((a,b)=>String(a.kick).localeCompare(String(b.kick))); paint(); }
function setLg(lg){ state.lg=lg; loadLocal(); show("slate"); document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on", x.dataset.view==="slate")); load(); }
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on",x===b)); show(b.dataset.view); if(b.dataset.view==="board"){ load().then(paintBoard); } });
setInterval(()=>{ if($("board").classList.contains("on")||$("match").classList.contains("on")) load().then(()=>{ if($("board").classList.contains("on")) paintBoard(); if($("match").classList.contains("on")&&state.openName) openCard(state.openName); }); }, 30000);
function askName(){
  return new Promise(resolve=>{
    const box=$("nameAsk"), input=$("nameAskInput");
    box.classList.add("on");
    input.value="";
    input.focus();
    $("nameAskGo").onclick=()=>{
      const name=input.value.trim().slice(0,24);
      if(!name) return;
      box.classList.remove("on");
      resolve(name);
    };
  });
}
$("lgNfl").onclick=()=>setLg("nfl"); $("lgCfb").onclick=()=>setLg("cfb");
$("navBack").onclick=goBack;
$("lock").onclick=async()=>{
  if(card().locked){
    card().locked=false;
    saveLocal();
    toast("Unlocked. Started games stay.");
    return;
  }
  const need=state.games.filter(g=>!started(g));
  if(!need.length || need.some(g=>!card().picks[g.id])) return toast("Finish the open games");
  if(!card().name){
    const name=await askName();
    if(!name) return;
    card().name=name;
  }
  card().locked=true; saveLocal();
  try{ await pushCard(); toast("On the board"); paintBoard(); show("board"); document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on", x.dataset.view==="board")); }
  catch(e){ card().locked=false; saveLocal(); toast("Not saved"); }
};
try{ history.scrollRestoration="manual"; }catch(e){}
function pinPick(){
  try{
    sessionStorage.setItem("saucePick.spot", JSON.stringify({
      screen: screenNow(), lg: state.lg, who: state.openName||"", y: window.scrollY||document.documentElement.scrollTop||0
    }));
  }catch(e){}
}
function stickPick(y){
  const n=Number(y)||0;
  const go=()=>{
    const max=Math.max(0, (document.documentElement.scrollHeight||0)-window.innerHeight);
    window.scrollTo(0, Math.min(n, max));
  };
  go();
  [40,120,300,700,1400].forEach(t=>setTimeout(go, t));
}
window.addEventListener("scroll", ()=>{ clearTimeout(window.PIN_T); window.PIN_T=setTimeout(pinPick, 120); }, {passive:true});
window.addEventListener("pagehide", pinPick);
loadLocal();
let spot=null;
try{ spot=JSON.parse(sessionStorage.getItem("saucePick.spot")||"null"); }catch(e){}
if(spot && spot.lg){ state.lg=spot.lg; loadLocal(); }
if(spot && spot.screen && spot.screen!=="choose"){
  const backTo=spot.screen==="match"?"board":spot.screen;
  if(backTo==="board") hist=["choose","slate","board"];
  else hist=["choose","slate"];
  show(backTo, {back:true});
  document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on", x.dataset.view===backTo));
  load().then(async ()=>{
    if(backTo==="board") await paintBoard();
    if(spot.screen==="match" && spot.who) openCard(spot.who);
    stickPick(spot.y||0);
  });
}
</script>
</body>
