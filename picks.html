<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sauce Pick Em</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#07080c;--orange:#ff7a18;--text:#f7f2ea;--muted:#9b9288;--line:#2c313d;--card:#12151c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,sans-serif}
body{max-width:720px;margin:0 auto;padding-bottom:88px}
.top{display:flex;align-items:flex-end;padding:14px 16px;border-bottom:2px solid var(--orange)}
.top b{font-family:"Bebas Neue",sans-serif;font-size:32px;letter-spacing:.04em}
.top em{color:var(--orange);font-style:normal}
.top a,.top button{margin-left:auto;background:none;border:0;color:var(--muted);font-weight:800}
.tabs{display:flex;gap:16px;padding:10px 16px 0}
.tabs button{border:0;background:none;color:var(--muted);font-weight:800;border-bottom:2px solid transparent;padding:8px 0}
.tabs button.on{color:#fff;border-color:var(--orange)}
.strip{display:flex;gap:16px;padding:8px 16px 10px;color:var(--muted);font-size:12px;font-weight:800}
.strip strong{color:#fff;font-family:"Bebas Neue",sans-serif;font-size:22px}
.screen{display:none}.screen.on{display:block}
.game{margin:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.row{display:grid;grid-template-columns:1fr 88px 1fr}
.team{border:0;background:transparent;color:inherit;padding:12px 8px;text-align:center}
.team img{width:52px;height:52px;background:#fff;border-radius:12px;object-fit:contain;padding:4px}
.team b{display:block;margin-top:4px}
.team span{color:var(--muted);font-size:12px}
.team.on{background:#2a170c;box-shadow:inset 0 -3px 0 var(--orange)}
.mid{border:0;background:transparent;color:var(--orange);font-weight:800;font-size:12px}
.sheet{margin:12px;display:grid;gap:10px}
.head{display:grid;grid-template-columns:1fr 88px 1fr;align-items:center;padding:16px 8px 8px;background:linear-gradient(90deg,#1b140e,#12151c 42%,#12151c 58%,#1b140e);border:1px solid var(--line);border-radius:16px}
.head button{border:0;background:transparent;color:inherit;text-align:center}
.head img{width:64px;height:64px;background:#fff;border-radius:14px;padding:5px}
.head b{display:block;font-family:"Bebas Neue",sans-serif;font-size:28px}
.head span,.when{color:var(--muted);font-size:12px;font-weight:700}
.head .on{outline:2px solid var(--orange);border-radius:14px}
.when{text-align:center}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pred{padding:12px 14px}
.pred .labs{display:flex;justify-content:space-between;font-size:12px;font-weight:800}
.track{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#2a241c;margin-top:6px}
.track i{background:var(--orange);height:100%}
.track u{background:#3a342c;height:100%;text-decoration:none}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.chip{background:#0c0e14;border-radius:10px;padding:10px}
.chip span{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;font-weight:800;margin-bottom:4px}
.info b{color:var(--text)}
.sec{padding:12px 14px 8px;font-size:11px;letter-spacing:.18em;color:var(--orange);font-weight:800;border-bottom:1px solid #242833}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 14px;border-top:1px solid #242833;font-size:13px;vertical-align:top}
th{color:var(--muted);font-size:11px;letter-spacing:.08em;font-weight:800;text-align:center}
td:first-child{text-align:left}
td:last-child{text-align:right}
td:nth-child(2){text-align:center;color:var(--muted);font-size:11px;letter-spacing:.06em}
.split{display:grid;grid-template-columns:1fr 1fr}
.split section{padding:0 0 10px}
.split section+section{border-left:1px solid var(--line)}
.item{display:flex;justify-content:space-between;gap:8px;padding:7px 14px;font-size:12px;border-top:1px solid #242833}
.dock{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);width:min(720px,calc(100% - 16px));display:grid;grid-template-columns:1fr 1fr 1fr;background:#101218;border:1px solid #3a2a18;border-radius:12px;overflow:hidden}
.dock button{border:0;background:transparent;color:var(--muted);padding:14px;font-weight:800}
.dock button.on{background:var(--orange);color:#140800}
.line{display:flex;justify-content:space-between;margin:8px 12px;padding:12px;background:#12151c;border-radius:12px}
.ladder{margin:8px 12px;background:#12151c;border:1px solid #2c313d;border-radius:16px;overflow:hidden}
.seat{width:100%;border:0;border-top:1px solid #242833;background:transparent;color:inherit;display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:14px;text-align:left}
.seat:first-child{border-top:0}
.seat b{font-family:"Bebas Neue",sans-serif;font-size:28px;font-weight:500}
.seat span{color:#9b9288;font-size:12px}
.seat em{font-style:normal;font-family:"Bebas Neue",sans-serif;font-size:26px;color:#ff7a18}
.cardhead{display:flex;align-items:flex-end;padding:8px 16px 0}
.cardhead button{border:0;background:none;color:#9b9288;font-weight:800}
.pickrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:8px 12px;background:#12151c;border-radius:12px;overflow:hidden}
.pickrow b{padding:12px;font-size:14px}
.pickrow b.on{background:#2a170c;box-shadow:inset 0 -3px 0 #ff7a18}
.pickrow i{font-style:normal;color:#9b9288;font-size:11px;font-weight:800}
input{width:calc(100% - 24px);margin:8px 12px;background:#101218;border:1px solid var(--line);color:#fff;padding:12px;border-radius:10px}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#1b140e;border:1px solid var(--orange);padding:8px 12px;display:none}
</style>
</head>
<body>
<header class="top"><b>SAUCE <em>PICK EM</em></b><a href="/">HOME</a></header>
<div class="tabs"><button id="lgNfl" class="on" type="button">NFL</button><button id="lgCfb" type="button">COLLEGE</button></div>
<div class="strip"><span>PICKS <strong id="made">0</strong></span><span>RECORD <strong id="rec">0-0</strong></span><span>OPEN <strong id="open">0</strong></span></div>
<section class="screen on" id="slate"><div id="games"></div></section>
<section class="screen" id="match"></section>
<section class="screen" id="ticket"><input id="cardName" maxlength="24" placeholder="Name"/><div id="ticketList"></div></section>
<section class="screen" id="board"><div id="boardList"></div></section>
<div class="dock"><button class="on" data-view="slate" type="button">Picks</button><button data-view="ticket" type="button">Ticket</button><button data-view="board" type="button">Board</button><button id="lock" type="button">Lock</button></div>
<div class="toast" id="toast"></div>
<script>
const SUPA_URL="https://cgxgyxzyunokiqfedtqp.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNneGd5eHp5dW5va2lxZmVkdHFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzQ2OTMsImV4cCI6MjEwNTc1MDY5M30.LBhCjY33GLZZ3BbpLVqoyx8ND20Egow0yH_rkui09pU";
const state={lg:"nfl",games:[],board:[],cards:{nfl:{picks:{},name:"",locked:false},cfb:{picks:{},name:"",locked:false}}};
const $ = id => document.getElementById(id);
function toast(m){ const t=$("toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",1200); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id)); }
function weekKey(lg){
  const fmt=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"});
  const parts=fmt.formatToParts(new Date()); const g=k=>parts.find(x=>x.type===k).value;
  const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}; const dow=map[g("weekday")];
  const dt=new Date(Date.UTC(+g("year"),+g("month")-1,+g("day"))); dt.setUTCDate(dt.getUTCDate()-(dow>=3?dow-3:dow+4));
  return "pem-"+lg+"-"+dt.toISOString().slice(0,10);
}
function card(){ return state.cards[state.lg]; }
function loadLocal(){ ["nfl","cfb"].forEach(lg=>{ try{ state.cards[lg]=Object.assign({picks:{},name:"",locked:false}, JSON.parse(localStorage.getItem("saucePick."+weekKey(lg))||"{}")); }catch(e){ state.cards[lg]={picks:{},name:"",locked:false}; } }); $("cardName").value=card().name||""; }
function headers(extra){ return Object.assign({apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"}, extra||{}); }
function rankOf(comp){ const r=comp.curatedRank&&comp.curatedRank.current?comp.curatedRank.current:comp.curatedRank; const n=Number(r); return n>0&&n<90?n:99; }
function isSec(comp){ return String((comp.team||{}).conferenceId)==="8"; }
function dates(){ const out=[]; for(let i=0;i<=3;i++){ const d=new Date(Date.now()+i*86400000); out.push(d.toLocaleString("en-CA",{timeZone:"America/Chicago"}).slice(0,10).replace(/-/g,"")); } return out; }
async function eventsFor(lg){
  const base=lg==="nfl"?"https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard":"https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard";
  const seen=new Set(), evs=[]; const days=lg==="nfl"?[""]:dates();
  for(const day of days){ const d=await (await fetch(base+(day?"?dates="+day+"&limit=200":""),{cache:"no-store"})).json(); (d.events||[]).forEach(ev=>{ if(!seen.has(ev.id)){ seen.add(ev.id); evs.push(ev); } }); }
  if(lg==="cfb") return evs.filter(ev=>((ev.competitions||[])[0].competitors||[]).some(c=>isSec(c)||rankOf(c)<=25));
  return evs;
}
function recOf(c){ const r=(c.records||[]).find(x=>x.type==="total")||(c.records||[])[0]; return r?r.summary:""; }
function mapEv(ev,lg){
  const c=(ev.competitions||[])[0]||{}; const st=((c.status||{}).type)||{}; const comps=c.competitors||[];
  const away=comps.find(x=>x.homeAway==="away")||comps[0]||{}; const home=comps.find(x=>x.homeAway==="home")||comps[1]||{};
  const team=x=>{ const t=x.team||{}; return {id:String(t.id||""), ab:t.abbreviation||"", name:t.shortDisplayName||t.displayName||"Team", score:x.score||"", rank:rankOf(x), rec:recOf(x), logo:t.logo||("https://a.espncdn.com/i/teamlogos/"+(lg==="nfl"?"nfl":"ncaa")+"/500/"+t.id+".png")}; };
  const broad=((c.broadcasts||[])[0]||{}).names||[]; const venue=c.venue||{};
  return {id:String(ev.id), state:st.state||"pre", detail:st.shortDetail||"", kick:ev.date||"", away:team(away), home:team(home), tv:broad.join(" / "), place:[venue.fullName,(venue.address||{}).city].filter(Boolean).join(", ")};
}
function started(g){ return g.state==="in"||g.state==="post"; }
function saveLocal(){
  card().name=$("cardName").value.trim();
  localStorage.setItem("saucePick."+weekKey(state.lg), JSON.stringify(card()));
  const picks=card().picks; let w=0,l=0,open=0;
  state.games.forEach(g=>{ if(!started(g)) open++; const pick=picks[g.id]; if(!pick||g.state!=="post") return; const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:""; if(winner&&pick===winner) w++; else if(winner) l++; });
  $("made").textContent=Object.keys(picks).length+"/"+state.games.length; $("rec").textContent=w+"-"+l; $("open").textContent=open;
}
function paint(){
  const picks=card().picks;
  $("games").innerHTML=state.games.map(g=>`<article class="game"><div class="row">
    <button class="team${picks[g.id]===g.away.id?" on":""}" data-g="${g.id}" data-t="${g.away.id}" type="button"><img alt="" src="${g.away.logo}"/><b>${g.away.name}</b><span>${g.away.score||g.away.rec}</span></button>
    <button class="mid" data-open="${g.id}" type="button">${g.detail||"AT"}<br>${g.tv||"SHEET"}</button>
    <button class="team${picks[g.id]===g.home.id?" on":""}" data-g="${g.id}" data-t="${g.home.id}" type="button"><img alt="" src="${g.home.logo}"/><b>${g.home.name}</b><span>${g.home.score||g.home.rec}</span></button>
  </div></article>`).join("");
  $("games").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openMatch(b.dataset.open));
  $("games").querySelectorAll(".team").forEach(b=>b.onclick=()=>pick(b.dataset.g,b.dataset.t));
  saveLocal();
}
function pick(id,tid){
  const g=state.games.find(x=>x.id===id); if(!g) return;
  if(card().locked) return toast("Locked"); if(started(g)) return toast("Started");
  card().picks[id]=tid; saveLocal(); paint();
}
function teamLeaders(block){
  const out={};
  ((block||{}).leaders||[]).forEach(cat=>{
    const top=(cat.leaders||[])[0]||{};
    const who=(top.athlete||{}).shortName||"";
    out[cat.displayName||cat.name]=who?(who+" "+(top.displayValue||"")):(top.displayValue||"—");
  });
  return out;
}
function openMatch(id){
  const g=state.games.find(x=>x.id===id); if(!g) return;
  show("match");
  $("match").innerHTML=`<header class="top"><b>SHEET</b><button id="back" type="button">SLATE</button></header>`;
  $("back").onclick=()=>show("slate");
  const sport=state.lg==="nfl"?"nfl":"college-football";
  fetch("https://site.api.espn.com/apis/site/v2/sports/football/"+sport+"/summary?event="+id,{cache:"no-store"}).then(r=>r.json()).then(d=>{
    const blocks=d.leaders||[];
    const aL=teamLeaders(blocks.find(x=>String((x.team||{}).id)===g.away.id)||blocks[0]);
    const hL=teamLeaders(blocks.find(x=>String((x.team||{}).id)===g.home.id)||blocks[1]);
    const cats=[...new Set(Object.keys(aL).concat(Object.keys(hL)))];
    const rows=cats.map(c=>`<tr><td>${aL[c]||"—"}</td><td>${c}</td><td>${hL[c]||"—"}</td></tr>`).join("");
    const pred=d.predictor||{};
    const awayPct=Math.round(Number((pred.awayTeam||{}).gameProjection)||50);
    const homePct=Math.round(Number((pred.homeTeam||{}).gameProjection)||(100-awayPct));
    const list=(arr,side,map)=>((arr.find(x=>String((x.team||{}).id)===side)||{})[map]||[]).slice(0,5);
    const five=side=>list(d.lastFiveGames||[],side,"events").map(ev=>`<div class="item"><span>${ev.atVs||""} ${(ev.opponent||{}).abbreviation||""}</span><b>${ev.gameResult||""} ${ev.score||""}</b></div>`).join("")||`<div class="item"><span>None</span></div>`;
    const inj=side=>list(d.injuries||[],side,"injuries").map(x=>`<div class="item"><span>${(x.athlete||{}).displayName||""}</span><b>${x.status||""}</b></div>`).join("")||`<div class="item"><span>None</span></div>`;
    const picks=card().picks;
    $("match").innerHTML=`
      <header class="top"><b>${g.away.name} at ${g.home.name}</b><button id="back" type="button">SLATE</button></header>
      <article class="sheet">
        <div class="head">
          <button class="${picks[g.id]===g.away.id?"on":""}" data-t="${g.away.id}" type="button"><img src="${g.away.logo}" alt=""/><b>${g.away.ab}</b><span>${g.away.rec}</span></button>
          <div class="when">${g.detail||"AT"}<br>${g.tv||""}</div>
          <button class="${picks[g.id]===g.home.id?"on":""}" data-t="${g.home.id}" type="button"><img src="${g.home.logo}" alt=""/><b>${g.home.ab}</b><span>${g.home.rec}</span></button>
        </div>
        <section class="cat"><div class="sec">PREDICTOR</div><div class="pred"><div class="labs"><span>${g.away.ab} ${awayPct}%</span><span>${g.home.ab} ${homePct}%</span></div><div class="track"><i style="width:${awayPct}%"></i><u style="width:${homePct}%"></u></div></div></section>
        <section class="cat"><div class="sec">GAME</div><div class="info"><div class="chip"><span>SITE</span><b>${g.place||"—"}</b></div><div class="chip"><span>TV</span><b>${g.tv||"—"}</b></div></div></section>
        <section class="cat"><div class="sec">SEASON LEADERS</div><table><tr><th>${g.away.ab}</th><th>STAT</th><th>${g.home.ab}</th></tr>${rows||"<tr><td colspan='3'>No leaders</td></tr>"}</table></section>
        <section class="cat"><div class="sec">LAST FIVE</div><div class="split"><section><div class="sec">${g.away.ab}</div>${five(g.away.id)}</section><section><div class="sec">${g.home.ab}</div>${five(g.home.id)}</section></div></section>
        <section class="cat"><div class="sec">INJURIES</div><div class="split"><section><div class="sec">${g.away.ab}</div>${inj(g.away.id)}</section><section><div class="sec">${g.home.ab}</div>${inj(g.home.id)}</section></div></section>
      </article>`;
    $("back").onclick=()=>show("slate");
    $("match").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ pick(g.id,b.dataset.t); openMatch(id); });
  }).catch(()=>{ $("match").innerHTML=`<header class="top"><b>SHEET</b><button id="back" type="button">SLATE</button></header><p style="padding:16px">Could not load</p>`; $("back").onclick=()=>show("slate"); });
}
function paintTicket(){
  const picks=card().picks;
  $("ticketList").innerHTML=state.games.filter(g=>picks[g.id]).map(g=>{ const tm=picks[g.id]===g.away.id?g.away:g.home; return `<div class="line"><b>${tm.name}</b><span>${g.away.ab} at ${g.home.ab}</span></div>`; }).join("");
}
async function pushCard(){
  const body={week:weekKey(state.lg), name:card().name.slice(0,24), lineup:card().picks, pts:0, locked_at:new Date().toISOString()};
  const r=await fetch(SUPA_URL+"/rest/v1/cards?on_conflict=week,name",{method:"POST",headers:headers({"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
}
async function paintBoard(){
  const r=await fetch(SUPA_URL+"/rest/v1/cards?week=eq."+encodeURIComponent(weekKey(state.lg))+"&select=name,lineup",{headers:headers()});
  const rows=r.ok?await r.json():[];
  const scored=rows.map(row=>{ const picks=typeof row.lineup==="string"?JSON.parse(row.lineup):(row.lineup||{}); let w=0,l=0; state.games.forEach(g=>{ const pick=picks[g.id]; if(!pick||g.state!=="post") return; const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:""; if(winner&&pick===winner) w++; else if(winner) l++; }); return {name:row.name,w,l,picks}; }).sort((a,b)=>b.w-a.w||a.l-b.l||a.name.localeCompare(b.name));
  state.board=scored;
  $("boardList").innerHTML=scored.length?`<div class="ladder">`+scored.map((x,i)=>`<button class="seat" type="button" data-who="${x.name}"><b>${i+1}</b><span><b style="color:#fff;font-size:18px">${x.name}</b><br>${Object.keys(x.picks).length} picks</span><em>${x.w}-${x.l}</em></button>`).join("")+`</div>`:"<p style='padding:16px;color:#9b9288'>No cards locked this week.</p>";
  $("boardList").querySelectorAll("[data-who]").forEach(b=>b.onclick=()=>openCard(b.dataset.who));
}
function openCard(name){
  const row=(state.board||[]).find(x=>x.name===name); if(!row) return;
  const picks=row.picks||{};
  const rows=state.games.filter(g=>picks[g.id]).map(g=>{
    const a=picks[g.id]===g.away.id, h=picks[g.id]===g.home.id;
    return `<div class="pickrow"><b class="${a?"on":""}">${g.away.name}</b><i>AT</i><b class="${h?"on":""}">${g.home.name}</b></div>`;
  }).join("");
  $("match").innerHTML=`<header class="top"><b>${name}</b><button id="backBoard" type="button">BOARD</button></header><p style="padding:0 16px;color:#9b9288">${row.w}-${row.l}</p>${rows||"<p style='padding:16px'>No picks</p>"}`;
  show("match");
  $("backBoard").onclick=()=>show("board");
}
async function load(){ state.games=(await eventsFor(state.lg)).map(ev=>mapEv(ev,state.lg)).sort((a,b)=>String(a.kick).localeCompare(String(b.kick))); paint(); }
function setLg(lg){ state.lg=lg; $("lgNfl").classList.toggle("on",lg==="nfl"); $("lgCfb").classList.toggle("on",lg==="cfb"); loadLocal(); show("slate"); load(); }
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on",x===b)); show(b.dataset.view); if(b.dataset.view==="board") paintBoard(); if(b.dataset.view==="ticket") paintTicket(); });
$("lgNfl").onclick=()=>setLg("nfl"); $("lgCfb").onclick=()=>setLg("cfb"); $("cardName").oninput=saveLocal;
$("lock").onclick=async()=>{
  saveLocal();
  if(!card().name){ show("ticket"); return toast("Name"); }
  if(!Object.keys(card().picks).length) return toast("Pick");
  card().locked=true; saveLocal();
  try{ await pushCard(); toast("Locked"); paintBoard(); show("board"); }
  catch(e){ toast("Not saved"); }
};
loadLocal(); load();
</script>
</body>
</html>
