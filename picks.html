<style>

body{max-width:1120px;margin:0 auto;min-height:100dvh;background:#05060a}

.tools{display:none;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #221e18}

.navback,#navBack{position:fixed !important;right:14px !important;left:auto !important;bottom:calc(18px + env(safe-area-inset-bottom)) !important;z-index:9999 !important;display:block !important;visibility:visible !important;height:46px;padding:0 18px;border:0;border-radius:999px;background:#ff7a18;color:#140c08;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:14px;box-shadow:0 10px 28px rgba(0,0,0,.45)}

.seat b{font-size:18px}

.meter i{display:block;height:100%;background:linear-gradient(90deg,#3ee0a0,#ff7a18)}

:root{--orange:#ff7a18;--pad:14px;--muted:#9b9288;--text:#f4efe6}
.bar{display:flex;align-items:center;gap:10px;padding:8px var(--pad) 4px}
.back{border:0;background:0;color:var(--orange);font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:0;font-size:12px}

.backbar b{font-family:"Bebas Neue",sans-serif;font-size:30px}
.scard.live{border-color:#3ee0a0;background:#0c1612;box-shadow:inset 3px 0 0 #3ee0a0}
.scard.hit{border-color:#3ee0a0}
.scard.miss{border-color:#ff5a3c}
.scard .line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.scard .nm{display:flex;align-items:center;gap:8px;font-family:"Bebas Neue",sans-serif;font-size:20px}
.scard .nm.r{justify-content:flex-end}
.scard img{width:36px;height:36px;background:#fff;border-radius:50%;object-fit:contain;padding:3px}
.scard .sc{font-family:"Bebas Neue",sans-serif;font-size:34px;display:flex;gap:8px}
.scard .sc em{font-style:normal;min-width:1.1em;text-align:center}
.scard .win{color:#3ee0a0}
.scard .pick{box-shadow:inset 0 -2px 0 #ff7a18}
.scard .sub{margin-top:6px;color:#c9c2b8;font-size:12px}
#slate{padding-bottom:28px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b140e;border:1px solid var(--orange);padding:8px 12px;display:none}

.tbin input{width:92px;background:#0c0d12;border:1px solid #3a2a18;color:#fff;border-radius:8px;padding:8px 10px;font-family:"Bebas Neue",sans-serif;font-size:28px;letter-spacing:.04em;text-align:center}
.tbin input:disabled{opacity:.72}
.tbcard{border-color:rgba(255,122,24,.55)}
.tbnote{margin:8px 16px 0;color:#9b9288;font-size:12px;letter-spacing:.08em;font-weight:800;text-transform:uppercase}
.whoami{margin:10px 16px 0;font-family:"Bebas Neue",sans-serif;font-size:28px;letter-spacing:.04em}
.whoami:empty{display:none}
.nameask{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:80;display:none;align-items:flex-end;justify-content:center}
.nameask.on{display:flex}
.nameask form{width:min(520px,100%);background:#101218;border-top:1px solid #3a2a18;padding:18px 16px 28px;display:grid;gap:10px}
.nameask p{margin:0;color:#9b9288;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.nameask input{background:#0c0d12;border:1px solid #3a2a18;color:#fff;border-radius:10px;padding:14px;font-size:16px}
.nameask button{border:0;background:var(--orange);color:#140800;font-weight:800;border-radius:10px;padding:14px}
</style>

</form></div>
<script>
const SUPA_URL="https://cgxgyxzyunokiqfedtqp.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNneGd5eHp5dW5va2lxZmVkdHFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzQ2OTMsImV4cCI6MjEwNTc1MDY5M30.LBhCjY33GLZZ3BbpLVqoyx8ND20Egow0yH_rkui09pU";
const state={lg:"nfl",games:[],board:[],cards:{nfl:{picks:{},name:"",locked:false},cfb:{picks:{},name:"",locked:false}}};
const $ = id => document.getElementById(id);
function toast(m){ const t=$("toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",1400); }
const hist=["choose"];
function screenNow(){ return hist[hist.length-1]||"choose"; }
function show(id, opt){
  opt=opt||{};
  if(!opt.back && hist[hist.length-1]!==id) hist.push(id);
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id));
  $("tools").classList.toggle("on", id!=="choose");
  const back=$("navBack"); if(back){ back.hidden=false; document.body.appendChild(back); }
  paintLock();
  pinPick();
}
function goBack(){
  const ask=$("nameAsk");
  if(ask && ask.classList.contains("on")){ ask.classList.remove("on"); return; }
  if(hist.length<=1){ location.href="/"; return; }
  hist.pop();
  show(hist[hist.length-1], {back:true});
  if(screenNow()==="board") load().then(paintBoard);
}
function paintLock(){
  const btn=$("lock");
  if(!btn) return;
  const here=screenNow();
  const need=state.games.filter(g=>!started(g));
  const ready=need.length>0&&need.every(g=>card().picks[g.id])&&tbReady();
  if(card().locked){
    btn.textContent="Unlock";
    btn.hidden=!(here==="slate"||here==="board");
  }else{
    btn.textContent="Lock";
    btn.hidden=!(here==="slate" && ready);
  }
}
function weekAnchor(){
  const fmt=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"});
  const parts=fmt.formatToParts(new Date()); const g=k=>parts.find(x=>x.type===k).value;
  const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}; const dow=map[g("weekday")];
  const dt=new Date(Date.UTC(+g("year"),+g("month")-1,+g("day")));
  dt.setUTCDate(dt.getUTCDate()-(dow>=3?dow-3:dow+4));
  return dt;
}
function weekKey(lg){
  return "pem-"+lg+"-"+weekAnchor().toISOString().slice(0,10);
}
function slateStamps(){
  const wed=weekAnchor();
  const out=[];
  for(let i=1;i<=5;i++){
    const dt=new Date(wed);
    dt.setUTCDate(wed.getUTCDate()+i);
    const m=String(dt.getUTCMonth()+1).padStart(2,"0"), d=String(dt.getUTCDate()).padStart(2,"0");
    out.push(dt.getUTCFullYear()+m+d);
  }
  return out;
}
function card(){ return state.cards[state.lg]; }
function loadLocal(){ ["nfl","cfb"].forEach(lg=>{ try{ state.cards[lg]=Object.assign({picks:{},name:"",locked:false,tb:""}, JSON.parse(localStorage.getItem("saucePick."+weekKey(lg))||"{}")); }catch(e){ state.cards[lg]={picks:{},name:"",locked:false,tb:""}; } const c=state.cards[lg]; c.picks=c.picks||{}; if((c.tb==null||c.tb==="") && c.picks._tb!=null) c.tb=c.picks._tb; }); const who=$("whoLine"); if(who) who.textContent=card().name||""; }
function headers(extra){ return Object.assign({apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"}, extra||{}); }
function rankOf(comp){ const r=comp.curatedRank&&comp.curatedRank.current?comp.curatedRank.current:comp.curatedRank; const n=Number(r); return n>0&&n<90?n:99; }
function isSec(comp){ return String((comp.team||{}).conferenceId)==="8"; }
function onSlateDay(ev){
  const iso=ev.date||(((ev.competitions||[])[0]||{}).date)||"";
  if(!iso) return false;
  const ymd=new Date(iso).toLocaleDateString("en-CA",{timeZone:"America/Chicago"}).replace(/-/g,"");
  return slateStamps().indexOf(ymd)>=0;
}
async function eventsFor(lg){
  const base=lg==="nfl"?"https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard":"https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard";
  const seen=new Set(), evs=[];
  for(const day of slateStamps()){
    const d=await (await fetch(base+"?dates="+day+"&limit=300",{cache:"no-store"})).json();
    (d.events||[]).forEach(ev=>{ if(!seen.has(ev.id) && onSlateDay(ev)){ seen.add(ev.id); evs.push(ev); } });
  }
  if(lg==="cfb") return evs.filter(ev=>((ev.competitions||[])[0].competitors||[]).some(c=>isSec(c)||rankOf(c)<=25));
  return evs;
}
function recOf(c){ const r=(c.records||[]).find(x=>x.type==="total")||(c.records||[])[0]; return r?r.summary:""; }
function mapEv(ev,lg){
  const c=(ev.competitions||[])[0]||{}; const st=((c.status||{}).type)||{}; const comps=c.competitors||[];
  const away=comps.find(x=>x.homeAway==="away")||comps[0]||{}; const home=comps.find(x=>x.homeAway==="home")||comps[1]||{};
  const team=x=>{ const t=x.team||{}; return {id:String(t.id||""), ab:t.abbreviation||"", name:t.displayName||t.shortDisplayName||"Team", score:x.score||"", rec:recOf(x), rank:rankOf(x), logo:t.logo||("https://a.espncdn.com/i/teamlogos/"+(lg==="nfl"?"nfl":"ncaa")+"/500/"+t.id+".png")}; };
  const broad=((c.broadcasts||[])[0]||{}).names||[];
  const sit=c.situation||{}; const last=(sit.lastPlay&&(sit.lastPlay.text||sit.lastPlay))||""; const down=[sit.shortDownDistanceText,sit.possessionText].filter(Boolean).join(" · "); return {id:String(ev.id), state:st.state||"pre", detail:st.shortDetail||"", kick:ev.date||"", away:team(away), home:team(home), tv:broad.join(" / "), play:down||last};
}
function started(g){ return g.state==="in"||g.state==="post"; }
function isVols(t){ return !!(t && (t.id==="2633" || /^tennessee volunteers$/i.test(t.name||""))); }
function isTitans(t){ return !!(t && (t.id==="10" || /tennessee titans/i.test(t.name||""))); }
function recKey(rec){
  const m=String(rec||"").match(/(\d+)\s*-\s*(\d+)(?:\s*-\s*(\d+))?/);
  if(!m) return [-1,-1];
  const w=+m[1], l=+m[2], t=+(m[3]||0), g=w+l+t;
  return [g?w/g:-1, w];
}
function tbPick(){
  const games=state.games||[];
  if(!games.length) return null;
  if(state.lg==="cfb"){
    const vols=games.find(g=>isVols(g.away)||isVols(g.home));
    if(vols) return {game:vols, why:"Vols"};
    let best=null, bestR=99;
    games.forEach(g=>{
      const r=Math.min(g.away.rank||99, g.home.rank||99);
      if(r<bestR){ bestR=r; best=g; }
    });
    if(best && bestR<99){
      const who=(best.away.rank||99)===bestR?best.away:best.home;
      return {game:best, why:"No. "+bestR+" "+(who.ab||who.name)};
    }
  } else {
    const titans=games.find(g=>isTitans(g.away)||isTitans(g.home));
    if(titans) return {game:titans, why:"Titans"};
    let best=null, key=[-1,-1];
    games.forEach(g=>{
      [g.away,g.home].forEach(t=>{
        const k=recKey(t.rec);
        if(k[0]>key[0] || (k[0]===key[0] && k[1]>key[1])){ key=k; best=g; }
      });
    });
    if(best && key[0]>=0) return {game:best, why:"Best record"};
  }
  return {game:games[0], why:"First game"};
}
function tbTotal(g){
  if(!g || g.state!=="post") return null;
  const a=Number(g.away.score), h=Number(g.home.score);
  return isFinite(a)&&isFinite(h)?a+h:null;
}
function tbMeasure(guess, actual){
  if(actual==null || guess==null || guess==="" || !isFinite(Number(guess))) return {miss:1, dist:9999, over:1};
  const n=Number(guess), dist=Math.abs(n-actual);
  return {miss:0, dist, over:n>actual?1:0};
}
function tbReady(){
  const pick=tbPick();
  if(!pick || started(pick.game)) return true;
  return card().tb!=="" && card().tb!=null && isFinite(Number(card().tb));
}
function dayLabel(iso){ return new Date(iso).toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric",timeZone:"America/Chicago"}); }
function saveLocal(){
  localStorage.setItem("saucePick."+weekKey(state.lg), JSON.stringify(card()));
  const who=$("whoLine"); if(who) who.textContent=card().name||"";
  const need=state.games.filter(g=>!started(g));
  const ready=need.length>0&&need.every(g=>card().picks[g.id])&&tbReady();
  paintLock();
  const picks=card().picks; let w=0,l=0,open=0;
  state.games.forEach(g=>{ if(!started(g)) open++; const pick=picks[g.id]; if(!pick||g.state!=="post") return; const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:""; if(winner&&pick===winner) w++; else if(winner) l++; });
  $("made").textContent=Object.keys(picks).filter(k=>k!=="_tb").length+"/"+state.games.length; $("rec").textContent=w+"-"+l; $("open").textContent=open;
}
function tbCard(){
  const pick=tbPick();
  if(!pick) return "";
  const g=pick.game;
  const showSc=g.state==="in"||g.state==="post";
  const total=tbTotal(g);
  const guess=card().tb;
  const locked=!!(card().locked||started(g));
  let note="";
  if(total!=null){
    if(guess===""||guess==null) note="No total entered";
    else {
      const d=Math.abs(Number(guess)-total);
      note=(d===0?"Exact":d+" off")+" · final "+total;
    }
  }
  return `<article class="gcard tbcard">
    <div class="gstat"><span>Tiebreaker · ${pick.why}</span><span>${g.detail||""}</span></div>
    <div class="bigline">
      <div class="nm"><span class="logoplate"><img alt="" src="${g.away.logo}"/></span><span class="who">${g.away.name}</span></div>
      <div class="sc"><em>${showSc?(g.away.score||"0"):"–"}</em><span>–</span><em>${showSc?(g.home.score||"0"):"–"}</em></div>
      <div class="nm r"><span class="who">${g.home.name}</span><span class="logoplate"><img alt="" src="${g.home.logo}"/></span></div>
    </div>
    <label class="tbin">${locked?"Submitted":"Total points"}<input id="tbIn" inputmode="numeric" maxlength="3" value="${locked?"":(guess==null?"":guess)}" placeholder="${locked?"In":""}" ${locked?"disabled":""}/></label>
    ${note?`<div class="sub">${note}</div>`:""}
  </article>`;
}
function paint(){
  const picks=card().picks;
  let last="";
  $("games").innerHTML=`<div class="list">`+tbCard()+state.games.map(g=>{
    const day=dayLabel(g.kick);
    const head=day!==last?`<div class="day">${day}</div>`:"";
    last=day;
    const when=g.detail||"";
    const cls=resultOf(g, picks[g.id]);
    const mark=cls==="hit"?" hit":cls==="miss"?" miss":"";
    const live=g.state==="in"?" live":"";
    const showSc=g.state==="in"||g.state==="post";
    return head+`<article class="gcard${live}${mark}">
      <div class="gstat"><span>${when}</span><span>${g.tv||""}</span></div>
      <div class="bigline">
        <button class="nm pickside" data-g="${g.id}" data-t="${g.away.id}" type="button"><span class="star">${picks[g.id]===g.away.id?"★":"☆"}</span><span class="logoplate"><img alt="" src="${g.away.logo}"/></span><span class="who">${g.away.name}</span></button>
        <div class="sc"><em>${showSc?(g.away.score||"0"):"–"}</em><span>–</span><em>${showSc?(g.home.score||"0"):"–"}</em></div>
        <button class="nm r pickside" data-g="${g.id}" data-t="${g.home.id}" type="button"><span class="who">${g.home.name}</span><span class="logoplate"><img alt="" src="${g.home.logo}"/></span><span class="star">${picks[g.id]===g.home.id?"★":"☆"}</span></button>
      </div>
    </article>`;
  }).join("")+`</div>`;
  $("games").querySelectorAll(".pickside").forEach(b=>b.onclick=()=>pick(b.dataset.g,b.dataset.t));
  const tbIn=$("tbIn");
  if(tbIn) tbIn.oninput=()=>{
    const n=tbIn.value.replace(/[^\d]/g,"").slice(0,3);
    tbIn.value=n;
    card().tb=n===""?"":Number(n);
    saveLocal();
  };
  saveLocal();
}
function pick(id,tid){
  const g=state.games.find(x=>x.id===id); if(!g) return;
  if(card().locked) return toast("Locked"); if(started(g)) return toast("Started");
  card().picks[id]=tid; saveLocal(); paint();
}
async function pushCard(){
  const lineup=Object.assign({}, card().picks);
  delete lineup._tb;
  if(card().tb!=="" && card().tb!=null && isFinite(Number(card().tb))) lineup._tb=Number(card().tb);
  const body={week:weekKey(state.lg), name:card().name.slice(0,24), lineup, pts:0, locked_at:new Date().toISOString()};
  const r=await fetch(SUPA_URL+"/rest/v1/cards?on_conflict=week,name",{method:"POST",headers:headers({"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
}
function resultOf(g,pick){
  if(!pick || g.state!=="post") return "open";
  const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:"";
  return !winner?"push":pick===winner?"hit":"miss";
}
function openCard(name){
  state.openName=name;
  const row=(state.board||[]).find(x=>x.name===name); if(!row) return;
  const picks=row.picks||{};
  const mine=String(name||"").trim().toLowerCase()===String(card().name||"").trim().toLowerCase();
  const rows=state.games.filter(g=>picks[g.id]).map(g=>{
    const reveal=mine || started(g);
    const cls=reveal?resultOf(g,picks[g.id]):"open";
    const live=g.state==="in"?" live":"";
    const mark=cls==="hit"?" hit":cls==="miss"?" miss":"";
    const href="/?league="+(state.lg==="nfl"?"nfl":"cfb")+"&game="+g.id;
    const aWin=reveal&&cls==="hit"&&picks[g.id]===g.away.id?" win":reveal&&cls==="miss"&&picks[g.id]===g.away.id?" miss":"";
    const hWin=reveal&&cls==="hit"&&picks[g.id]===g.home.id?" win":reveal&&cls==="miss"&&picks[g.id]===g.home.id?" miss":"";
    const when=g.state==="in"?("LIVE · "+(g.detail||"")):g.state==="post"?(g.detail||"Final"):(g.detail||"");
    const starA=reveal&&picks[g.id]===g.away.id?"★":"☆";
    const starH=reveal&&picks[g.id]===g.home.id?"★":"☆";
    return `<a class="gcard${live}${mark}" href="${href}">
      <div class="gstat"><span>${when}</span><span>${g.tv||""}</span></div>
      <div class="bigline">
        <div class="nm${aWin}"><span class="star">${starA}</span><span class="logoplate"><img alt="" src="${g.away.logo}"/></span><span class="who">${g.away.name}</span></div>
        <div class="sc"><em class="${aWin.trim()}">${g.away.score||"–"}</em><span>–</span><em class="${hWin.trim()}">${g.home.score||"–"}</em></div>
        <div class="nm r${hWin}"><span class="who">${g.home.name}</span><span class="logoplate"><img alt="" src="${g.home.logo}"/></span><span class="star">${starH}</span></div>
      </div>
      <div class="sub">${reveal?(g.play||""):"Pick hidden until kickoff"}</div>
    </a>`;
  }).join("");
  const tb=tbPick();
  const guess=picks._tb;
  let head="";
  if(tb){
    const actual=tbTotal(tb.game);
    let extra="";
    if(guess!=null && guess!==""){
      extra=" · In";
      if(actual!=null){
        const d=Math.abs(Number(guess)-actual);
        extra=" · "+(d===0?"Exact":d+" off");
      }
    }
    head=`<p class="tbnote">Tiebreaker · ${tb.why}${extra}</p>`;
  }
  $("match").innerHTML=`<div class="list">${head}${rows}</div>`;
  show("match");
}
async function paintBoard(){
  const r=await fetch(SUPA_URL+"/rest/v1/cards?week=eq."+encodeURIComponent(weekKey(state.lg))+"&week=like.pem-*&select=name,lineup",{headers:headers()});
  const rows=r.ok?await r.json():[];
  const tb=tbPick();
  const tbLine=tb?`<p class="tbnote">Tiebreaker · ${tb.why} · ${tb.game.away.ab||tb.game.away.name} at ${tb.game.home.ab||tb.game.home.name}</p>`:"";
  const actual=tb?tbTotal(tb.game):null;
  const scored=rows.map(row=>{
    const picks=typeof row.lineup==="string"?JSON.parse(row.lineup):(row.lineup||{});
    let w=0,l=0,done=0;
    state.games.forEach(g=>{
      const pick=picks[g.id];
      if(!pick||g.state!=="post") return;
      done++;
      const winner=+g.away.score>+g.home.score?g.away.id:+g.home.score>+g.away.score?g.home.id:"";
      if(winner&&pick===winner) w++; else if(winner) l++;
    });
    const guess=picks._tb;
    const meas=tbMeasure(guess, actual);
    let note="";
    if(guess!=null && guess!=="") note="In";
    if(actual!=null){
      if(meas.miss) note="No total";
      else note=meas.dist===0?"Exact":meas.dist+" off";
    }
    return {name:row.name,w,l,done,picks,guess,meas,note};
  }).sort((a,b)=>{
    const rec=b.w-a.w||a.l-b.l;
    if(rec || actual==null) return rec||a.name.localeCompare(b.name);
    return a.meas.miss-b.meas.miss||a.meas.dist-b.meas.dist||a.meas.over-b.meas.over||a.name.localeCompare(b.name);
  });
  let place=0, prev="";
  scored.forEach((x,i)=>{
    const key=x.w+"-"+x.l+(actual==null?"":"|"+x.meas.miss+"|"+x.meas.dist+"|"+x.meas.over);
    if(key!==prev){ place=i+1; prev=key; }
    x.place=place;
  });
  state.board=scored;
  $("boardList").innerHTML=scored.length?tbLine+scored.map(x=>{
    return `<button class="seat" type="button" data-who="${x.name}"><div class="rk">${x.place}</div><div><b>${x.name}</b>${x.note?`<span>${x.note}</span>`:""}</div><div class="rec">${x.w}-${x.l}</div></button>`;
  }).join(""):"<p style='padding:20px;color:#9b9288'>No locked cards in this league.</p>";
  $("boardList").querySelectorAll("[data-who]").forEach(b=>b.onclick=()=>openCard(b.dataset.who));
}
async function load(){ state.games=(await eventsFor(state.lg)).map(ev=>mapEv(ev,state.lg)).sort((a,b)=>String(a.kick).localeCompare(String(b.kick))); paint(); }
function setLg(lg){ state.lg=lg; loadLocal(); show("slate"); document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on", x.dataset.view==="slate")); load(); }
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on",x===b)); show(b.dataset.view); if(b.dataset.view==="board"){ load().then(paintBoard); } });
setInterval(()=>{ if($("board").classList.contains("on")||$("match").classList.contains("on")) load().then(()=>{ if($("board").classList.contains("on")) paintBoard(); if($("match").classList.contains("on")&&state.openName) openCard(state.openName); }); }, 30000);
function askName(){
  return new Promise(resolve=>{
    const box=$("nameAsk"), input=$("nameAskInput");
    box.classList.add("on");
    input.value="";
    input.focus();
    $("nameAskGo").onclick=()=>{
      const name=input.value.trim().slice(0,24);
      if(!name) return;
      box.classList.remove("on");
      resolve(name);
    };
  });
}
$("lgNfl").onclick=()=>setLg("nfl"); $("lgCfb").onclick=()=>setLg("cfb");
$("navBack").onclick=goBack;
$("lock").onclick=async()=>{
  if(card().locked){
    card().locked=false;
    saveLocal();
    toast("Unlocked. Started games stay.");
    return;
  }
  const need=state.games.filter(g=>!started(g));
  if(!need.length || need.some(g=>!card().picks[g.id])) return toast("Finish the open games");
  if(!tbReady()) return toast("Add the tiebreaker");
  if(!card().name){
    const name=await askName();
    if(!name) return;
    card().name=name;
  }
  card().locked=true; saveLocal();
  try{ await pushCard(); toast("On the board"); paintBoard(); show("board"); document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on", x.dataset.view==="board")); }
  catch(e){ card().locked=false; saveLocal(); toast("Not saved"); }
};
try{ history.scrollRestoration="manual"; }catch(e){}
function pinPick(){
  try{
    sessionStorage.setItem("saucePick.spot", JSON.stringify({
      screen: screenNow(), lg: state.lg, who: state.openName||"", y: window.scrollY||document.documentElement.scrollTop||0
    }));
  }catch(e){}
}
function stickPick(y){
  const n=Number(y)||0;
  const go=()=>{
    const max=Math.max(0, (document.documentElement.scrollHeight||0)-window.innerHeight);
    window.scrollTo(0, Math.min(n, max));
  };
  go();
  [40,120,300,700,1400].forEach(t=>setTimeout(go, t));
}
window.addEventListener("scroll", ()=>{ clearTimeout(window.PIN_T); window.PIN_T=setTimeout(pinPick, 120); }, {passive:true});
window.addEventListener("pagehide", pinPick);
loadLocal();
let spot=null;
try{ spot=JSON.parse(sessionStorage.getItem("saucePick.spot")||"null"); }catch(e){}
if(spot && spot.lg){ state.lg=spot.lg; loadLocal(); }
if(spot && spot.screen && spot.screen!=="choose"){
  const backTo=spot.screen==="match"?"board":spot.screen;
  if(backTo==="board") hist=["choose","slate","board"];
  else hist=["choose","slate"];
  show(backTo, {back:true});
  document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on", x.dataset.view===backTo));
  load().then(async ()=>{
    if(backTo==="board") await paintBoard();
    if(spot.screen==="match" && spot.who) openCard(spot.who);
    stickPick(spot.y||0);
  });
}
(function(){ const b=document.getElementById("navBack"); if(b){ b.hidden=false; document.body.appendChild(b); } })();
</script>
