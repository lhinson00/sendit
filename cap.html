<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#05060a"/>
<meta name="robots" content="noindex"/>
<title>Sauce Cap · Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<style>
@import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;600;700;800&display=swap");
:root{
  --bg:#05060a;--card:#101218;--line:#1c1e28;--orange:#ff7a18;--ember:#ffc46b;
  --live:#3ee0a0;--hot:#ff3b3b;--text:#f7f2ea;--muted:#9b9288;--pad:clamp(12px,3vw,20px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif}
body{min-height:100dvh;width:min(760px,100%);margin:0 auto;padding-bottom:96px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{padding:14px var(--pad) 10px;background:linear-gradient(90deg,#2a1408,#05060a 62%);border-bottom:2px solid var(--orange);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand b{font-family:"Bebas Neue",sans-serif;letter-spacing:.12em;font-size:28px;font-weight:400}
.brand em{font-style:normal;color:var(--orange)}
.pill{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#140800;background:var(--ember);padding:4px 8px;border-radius:999px;font-weight:800}
.weekline{margin:6px 0 0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;padding:10px var(--pad) 0;position:sticky;top:64px;z-index:19;background:linear-gradient(#05060a,#05060a 70%,transparent)}
.tabs button{flex:1;border:1px solid var(--line);background:#0c0d14;color:var(--muted);padding:10px 6px;border-radius:10px;font-weight:800;font-size:13px}
.tabs button.on{border-color:var(--orange);background:#1a120c;color:var(--ember)}
.panel{padding:12px var(--pad) 24px}
.hint{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 12px}
.steps{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;color:var(--muted);font-size:13px;line-height:1.4}
.steps i{width:28px;height:28px;border-radius:8px;background:#1a140e;border:1px solid rgba(255,122,24,.4);color:var(--orange);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px}
.steps b{color:var(--text)}
.budget{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:0 0 16px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bcell{background:#0c0d12;padding:14px 16px}
.bcell span{display:block;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.bcell b{display:block;font-variant-numeric:tabular-nums;font-size:28px;letter-spacing:-.03em;line-height:1.1;margin-top:6px;font-weight:800}
.bcell.over b{color:var(--hot)}
.bcell.ok b{color:#f7f2ea}
.board{background:#0c0d12;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.slots{display:grid}
.slot,.prow{display:grid;grid-template-columns:40px minmax(0,1fr) 70px 40px;align-items:center;gap:8px;min-height:52px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.slot:last-child,.prow:last-child{border-bottom:0}
.slot.empty{opacity:.55}
.posmark{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--ember);background:#1a140e;border:1px solid rgba(255,122,24,.28)}
.who{min-width:0}
.who b,.nm{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span,.meta{display:block;color:var(--muted);font-size:11px;margin-top:2px;letter-spacing:.01em}
.sal,.price{font-variant-numeric:tabular-nums;font-size:14px;font-weight:800;text-align:right;color:#fff}
.slot button.x,.addbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:0}
.addbtn{color:var(--orange);border-color:rgba(255,122,24,.45);font-weight:800;font-size:18px}
.prow.on{background:rgba(255,122,24,.08)}
.prow.on .addbtn{background:var(--orange);color:#140800;border-color:var(--orange)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.filters.three{grid-template-columns:1fr 1fr 1fr}
select,input[type=search],input[type=text]{width:100%;background:#0c0d14;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pool{display:grid}
.poolhead{display:grid;grid-template-columns:40px minmax(0,1fr) 70px 40px;gap:8px;padding:8px 12px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.rowbtns{display:flex;gap:6px}
.rowbtns button{border:1px solid var(--orange);background:#1a120c;color:var(--orange);border-radius:8px;padding:5px 9px;font-size:11px;font-weight:800}
.rowbtns button.ghost{border-color:var(--line);background:transparent;color:var(--muted)}
.lockbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);padding:10px var(--pad) calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#05060a 28%);z-index:30}
.lockbar .inner{display:flex;gap:8px}
.lockbar button{flex:1;border:0;border-radius:12px;padding:14px;font-weight:800}
.lockbar .go{background:var(--orange);color:#140800}
.lockbar .go:disabled{opacity:.45}
.lockbar .sec{background:#1a120c;color:var(--ember);border:1px solid var(--orange)}
.cardlist,.stand{display:grid;gap:10px}
.lrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.lrow .topr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lrow .pts{font-family:"Bebas Neue",sans-serif;font-size:36px;line-height:1;color:var(--ember)}
.lrow .sub{color:var(--muted);font-size:12px;margin-top:4px}
.livegrid{display:grid;gap:10px}
.gstrip{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin:0 0 8px}
.gchip{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:#101218;border:1px solid var(--line);border-radius:14px;padding:8px 10px;color:inherit;text-decoration:none}
.gchip.live{border-color:#3ee0a0}
.gchip img{width:22px;height:22px;object-fit:contain;background:#fff;border-radius:4px}
.gchip b{font-size:13px}
.gchip span{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ticker{background:linear-gradient(90deg,#1a120c,#101218);border:1px solid rgba(255,122,24,.35);border-radius:14px;padding:12px 14px}
.ticker b{color:var(--orange);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.ticker p{margin:6px 0 0;font-size:14px;line-height:1.4;color:#f7f2ea}
.livep{display:grid;grid-template-columns:52px 1fr auto;gap:6px 10px;align-items:center;background:linear-gradient(180deg,#14161c,#0c0d12);border:1px solid var(--line);border-radius:16px;padding:12px;color:inherit}
.livep .face{position:relative;width:52px;height:52px}
.livep .face img.head{width:52px;height:52px;object-fit:cover;border-radius:12px;background:#1a1c22;display:block}
.livep .face img.lg{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;object-fit:contain;background:#fff;border-radius:4px;padding:1px}
.livep .pts{font-family:"Bebas Neue",sans-serif;font-size:34px;color:#fff;line-height:.9;text-align:right}
.livep.live{border-color:#3ee0a0;box-shadow:0 0 24px rgba(62,224,160,.08)}
.livep.done{border-color:rgba(255,255,255,.35)}
.livep.bump{animation:pop .7s ease}
.breakhero{display:grid;grid-template-columns:68px 1fr auto;gap:12px;align-items:center;padding:4px 0 14px;border-bottom:1px solid var(--line);margin:0 0 12px}
.breakhero img.head{width:68px;height:68px;border-radius:16px;object-fit:cover;background:#1a1c22;border:1px solid var(--line)}
.breakhero h3{margin:0;font-size:20px;letter-spacing:-.03em}
.breakhero .tot{font-family:"Bebas Neue",sans-serif;font-size:52px;line-height:.85;color:#3ee0a0;text-align:right}
.breakhero .tot small{display:block;font-family:inherit;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:400}
.livestrip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:14px;background:#12141a;border:1px solid var(--line);margin:0 0 12px;font-size:13px}
.livestrip b{font-family:"Bebas Neue",sans-serif;font-size:20px;letter-spacing:.04em}
.seclab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.boxcard{background:#12141a;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 12px}
.boxcard .breakrow:last-child{border-bottom:0;padding-bottom:0}
.breakrow{display:grid;grid-template-columns:minmax(0,1fr) 70px 52px;gap:8px;align-items:baseline;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}

.breakrow{display:grid;grid-template-columns:minmax(0,1fr) 72px 56px;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.breakrow b{display:block;font-size:13px;font-weight:700;letter-spacing:.01em}
.breakrow em{display:block;font-style:normal;color:var(--muted);font-size:11px;margin-top:2px}
.breakrow .cnt{color:var(--muted);font-size:12px;text-align:right}
.breakrow .pv{font-family:"Bebas Neue",sans-serif;font-size:22px;color:#3ee0a0;text-align:right}
.breakrow.neg .pv{color:#ff6b6b}
.breakrow.zero{opacity:.42}
.breakrow.zero .pv{color:var(--muted)}
.livep{cursor:pointer}
.injbox{margin:0 0 12px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,107,107,.35);background:#1a1010}
.injbox b{display:block;color:#ff8a8a;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.injbox p{margin:6px 0 0;color:#f3e8e8;font-size:13px;line-height:1.45}
.tag-out,.tag-ir{color:#ff6b6b;font-weight:800}
.tag-q,.tag-d{color:#ffb020;font-weight:800}
.prow.hurt{border-left:3px solid #ff6b6b}
.prow.qst{border-left:3px solid #ffb020}
.livep .cast{grid-column:1/-1;margin:0;border:0;background:transparent;color:var(--orange);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:4px 0 0;cursor:pointer}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.02);background:#1a1810}100%{transform:scale(1)}}
.livep .line{grid-column:2 / -1;color:var(--muted);font-size:12px}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:999px;margin-left:6px}
.chip.live{background:#0d2a1c;color:#3ee0a0}
.chip.pre{background:#1a1a20;color:var(--muted)}
.chip.fin{background:#1c1c1c;color:#fff}
.bigscore{text-align:center;padding:8px 0 16px}
.bigscore b{font-family:"Bebas Neue",sans-serif;font-size:72px;line-height:.85;letter-spacing:.04em}
.bigscore span{display:block;color:var(--muted);margin-top:6px}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(5,6,10,.72);display:none;align-items:flex-end}
.drawer.on{display:flex}
.sheet{width:100%;max-height:88dvh;overflow:auto;background:#0b0c11;border-top:1px solid rgba(255,122,24,.45);border-radius:20px 20px 0 0;padding:10px var(--pad) 28px}
.sheetfoot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 8px}
.sheetfoot button{border:0;border-radius:12px;padding:14px 10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.sheetfoot .gc{background:#16120e;color:var(--orange);border:1px solid rgba(255,122,24,.45)}
.sheetfoot .done{background:#1a1c22;color:#e8e0d6}
.sheet .grab{width:36px;height:4px;border-radius:99px;background:#3a3a44;margin:4px auto 14px}
.sheethead{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:start;margin-bottom:4px}
.sheethead h3{margin:0;font-size:22px;letter-spacing:-.02em}
.sheethead .sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.sheethead .pay{font-variant-numeric:tabular-nums;font-size:18px;font-weight:800;padding-top:2px}
.sheet .close{width:36px;height:36px;border:0;border-radius:10px;background:#16171d;color:#c8c0b6;font-size:18px}
.rate{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px}
.rate b{font-family:"Bebas Neue",sans-serif;font-size:48px;line-height:.8;color:var(--orange)}
.rate span{color:var(--muted);font-size:13px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 16px}
.statgrid button{background:#14151c;border:1px solid #22232c;border-radius:12px;padding:10px 6px;text-align:center;color:inherit}
.statgrid button.on{border-color:rgba(255,122,24,.55);background:#1a140e}
.statgrid b{display:block;font-variant-numeric:tabular-nums;font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1}
.statgrid span{display:block;font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:5px;font-weight:700}
.glog{display:grid;gap:6px;margin-top:8px}
.flog{margin-top:4px}
.flog .grow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.flog .grow b{display:block;font-size:14px;font-weight:700}
.flog .grow span{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.35}
.flog .fp{font-family:"Bebas Neue",sans-serif;font-size:28px;line-height:.85;color:var(--orange);text-align:right}
.flog .fp small{display:block;font-family:Manrope,system-ui,sans-serif;font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin-top:3px}
.kitbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 8px}
.kitbar label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);margin-bottom:4px}
.kitbar select{width:100%;background:#101218;color:#efe6d8;border:1px solid #3a2a18;padding:10px}
.khit{font-family:"Bebas Neue",sans-serif;font-size:42px;line-height:.85;color:var(--ember)}
.kmeta{color:var(--muted);font-size:12px;margin:4px 0 10px}
.spark{display:flex;align-items:flex-end;gap:3px;height:118px;padding:8px 0 4px}
.spark i{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:#2a2218;font-style:normal;border-radius:3px 3px 0 0}
.spark i.hit{background:#3d240c}
.spark i b{font-size:9px;line-height:1;margin-bottom:3px;color:#efe6d8}
.spark i.hit b{color:var(--orange)}
.spark i em{font-size:8px;letter-spacing:.02em;color:#8a8478;margin-top:5px;font-style:normal}
.seasonnote{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin:0 0 8px}
.lab{display:inline-block;margin-left:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#140800;background:var(--orange);padding:2px 6px;border-radius:999px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#1a120c;border:1px solid var(--orange);color:var(--ember);padding:10px 14px;border-radius:10px;z-index:50;display:none;font-size:13px;font-weight:700}

.steps{opacity:.85;margin-bottom:18px}
.event{margin:0 0 16px;padding:14px 16px;border-radius:18px;border:1px solid rgba(255,122,24,.4);background:linear-gradient(180deg,#1a140e,#0c0d12)}
.event h2{margin:4px 0 6px;font-family:"Bebas Neue",sans-serif;font-size:32px;letter-spacing:.03em}
.event p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.cover{opacity:.7}
.rosterbox,.labbox{background:#0e1016;border:1px solid var(--line);border-radius:18px;padding:14px 14px 8px;margin:0 0 16px}
.rosterbox{border-color:rgba(255,122,24,.35);box-shadow:0 0 0 1px rgba(255,122,24,.08)}
.rhead{display:flex;align-items:flex-end;justify-content:space-between;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.kicker{margin:0;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);font-weight:800}
.rhead h2{margin:2px 0 0;font-family:"Bebas Neue",sans-serif;font-size:28px;letter-spacing:.04em;line-height:1}
.namebar{margin-bottom:10px}
#newCardBtn{border:1px solid var(--line);background:#101218;border-radius:10px;padding:0 14px;color:var(--muted);font-weight:800}
.namebar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}

.slots{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:36px 28px minmax(0,1fr) auto 28px;align-items:center;gap:8px;min-height:56px;padding:8px 10px;border:1px solid #2a241c;border-radius:10px;background:#101218}
.slot.empty{border-style:dashed;background:#0c0d12}
.slot.onpick{border-color:#ff7a18;box-shadow:inset 3px 0 0 #ff7a18}
.slot img.tm,.prow img.tm{width:28px;height:28px;object-fit:contain;background:#fff;border-radius:4px;padding:2px}
.prow{display:grid;grid-template-columns:36px 28px minmax(0,1fr) auto 36px;align-items:center;gap:8px;min-height:58px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.05)}
.salbar{height:6px;border-radius:99px;background:#1c1a16;margin:8px 0 10px;overflow:hidden}
.salbar i{display:block;height:100%;background:#ff7a18}
.slot .who b,.prow .who b{font-size:14px}
.slot .who span,.prow .who span{display:block;color:#8a8074;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
\n.chips{display:flex;gap:6px;overflow:auto;padding-bottom:8px}
.chips button{flex:0 0 auto;border:1px solid #2a241c;background:#101218;color:#efe8df;border-radius:99px;padding:6px 10px;font-size:12px}
.chips button.on{border-color:#ff7a18;color:#ff7a18}
\n
.desk{background:#101218;border:1px solid #2a241c;border-radius:16px;overflow:hidden}
.desk-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:14px 14px 0}
.desk-top h2{margin:0;font-size:22px}
.remain-block{text-align:right}
.remain-block span,.remain-block em{display:block;color:#8a8074;font-size:11px;font-style:normal}
.remain-block b{font-size:26px;color:#ff7a18;letter-spacing:-.03em}
.desk .namebar{padding:10px 14px 0}
.desk .slots{padding:10px 10px 4px}
.desk-pool{border-top:1px solid #2a241c;margin-top:8px;padding:10px 10px 16px;background:#0c0d12}
.desk-pool .chips.games{margin-bottom:8px}
.poolhead{display:none}
.event,.steps,.labbox,.rosterbox{display:none}
\n
body{background:#07080c}
.desk{background:linear-gradient(180deg,#16130f 0%,#101218 120px);border:1px solid #3a2a1c;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.desk .slot{background:#0e1016;border-radius:12px;border:1px solid #2c261e;margin-bottom:6px}
.desk .slot.empty{background:transparent}
.pcard{display:block;margin:0 0 8px;padding:10px 12px;border-radius:14px;background:#141820;border:1px solid #2a3140}
.pcard.on{border-color:#3ee0a0}
.pcard-top{display:grid;grid-template-columns:34px 32px 1fr auto;gap:8px;align-items:center}
.pcard-bot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #242a36;color:#9b9288;font-size:12px}
.pcard-bot b{color:#ffc46b;font-size:15px}
.addbtn{border:0;background:#ff7a18;color:#1a0e05;font-weight:800;border-radius:8px;padding:8px 10px;letter-spacing:.04em}
.addbtn:disabled{background:#2a241c;color:#8a8074}
.chips button{background:#141820;border-color:#2a3140}
\n
#tab-build .desk{background:#0e1014;border:1px solid #242830;border-radius:12px;box-shadow:none}
#tab-build .desk-top{padding:12px 12px 0}
#tab-build .desk-top h2{font-size:18px;font-weight:700}
#tab-build .remain-block b{font-size:20px}
#tab-build .slots{display:flex;flex-direction:column;gap:4px;padding:8px}
#tab-build .slot{display:grid !important;grid-template-columns:32px 22px minmax(0,1fr) auto 22px !important;min-height:40px !important;padding:4px 8px !important;margin:0 !important;border-radius:8px}

const toast = msg => { const t=$("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",2200); };

let STATE = {
  week: "",
  label: "",
  name: "",
  locked: false,
  lineup: {},
  games: [],
  pool: [],
  live: {},
  cards: [],
  log: []
};

function loadStore(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORE)||"{}");
    if(raw.active && raw.active.contest && raw.active.contest!==CONTEST){
      raw.active={name:"",locked:false,lineup:{},week:"",sealName:"",contest:CONTEST};
    }
    if(raw.cards) STATE.cards = raw.cards.filter(isThisSlate);
    if(raw.log) STATE.log = raw.log;
    if(raw.active) Object.assign(STATE, {name:raw.active.name||"", locked:!!raw.active.locked, lineup:raw.active.lineup||{}, week:raw.active.week||"", sealName:raw.active.sealName||raw.active.name||""});
  }catch(e){}
}
function saveStore(){
  try{
    localStorage.setItem(STORE, JSON.stringify({
      cards: STATE.cards,
      log: STATE.log,
      active: {week:STATE.week, name:STATE.name, locked:STATE.locked, lineup:STATE.lineup, sealName:STATE.sealName||"", contest:CONTEST}
    }));
  }catch(e){}
}

function salary(p){
  const id = Number(String(p.id).replace(/\D/g,"")) || 7;
  const band = {QB:[5600,8900],RB:[4200,9200],WR:[3800,9000],TE:[3000,7600],DST:[2400,4900]}[p.pos] || [3500,6000];
  const step = Math.round((band[1]-band[0]) / 100);
  const n = band[0] + ((id * 13 + (p.name||"").length * 17) % (step+1)) * 100;
  return Math.min(band[1], Math.max(band[0], n));
}

function spent(){
  return SLOTS.reduce((s,k)=>{
    const p = STATE.pool.find(x=>x.id===STATE.lineup[k]);
    return s + (p ? p.sal : 0);
  },0);
}
function remain(){ return BUDGET - spent(); }
function filled(){ return SLOTS.every(k=>STATE.lineup[k]); }
function usedIds(){ return new Set(SLOTS.map(k=>STATE.lineup[k]).filter(Boolean)); }

function slotLabel(k){
  if(k==="RB2") return "RB";
  if(k==="WR2"||k==="WR3") return "WR";
  return k;
}

function paintBudget(){
  const r = remain(), s = spent();
  $("remain").textContent = "$"+r.toLocaleString();
  $("spent").textContent = "$"+s.toLocaleString();
  $("remain").style.color = r<0 ? "#ff3b3b" : "#ff7a18";
  $("btnLock").textContent = "Lock";
  const ready = !STATE.locked && filled() && r>=0;
  const bar=$("lockbar");
  const onLineup = $("tab-build") && !$("tab-build").hidden;
  if(bar) bar.classList.toggle("on", !!(onLineup && ready));
  const who=$("whoLine"); if(who) who.textContent=STATE.name||"";
  const un=$("btnUnlock");
  if(un) un.hidden = !STATE.locked;
  const clr=$("btnClear");
  if(clr) clr.hidden = STATE.locked || !SLOTS.some(k=>STATE.lineup[k]);
}

function nflLogo(ab){ return "https://a.espncdn.com/i/teamlogos/nfl/500/"+String(ab||"").toLowerCase()+".png"; }
function paintSlots(){
  const filled=SLOTS.filter(k=>STATE.lineup[k]).length;
  const spent=SLOTS.reduce((n,k)=>{ const p=STATE.pool.find(x=>x.id===STATE.lineup[k]); return n+(p?p.sal:0); },0);
  const pct=Math.min(100, Math.round(spent/BUDGET*100));
  $("slots").innerHTML = SLOTS.map(k=>{
    const p = STATE.pool.find(x=>x.id===STATE.lineup[k]);
    const active = (window.PICK_SLOT||"")===k;
    if(!p) return `<button type="button" class="slot empty${active?" onpick":""}" data-pick="${k}"><div class="posmark">${slotLabel(k)}</div><span class="mark"></span><div class="who"><b>Empty</b><span>Add a ${slotLabel(k)}</span></div><div class="sal"></div><span></span></button>`;
    return `<div class="slot${active?" onpick":""}"><div class="posmark">${slotLabel(k)}</div><img class="tm" alt="" src="${nflLogo(p.team)}"/><div class="who"><b>${p.name}</b><span>${p.team}${p.opp?(" vs "+p.opp):""}${p.inj?(" · "+p.inj):""}</span></div><div class="sal">$${(p.sal/1000).toFixed(1)}k</div>${STATE.locked||slotFrozen(k)?"<span></span>":`<button class="x" data-drop="${k}" aria-label="remove">×</button>`}</div>`;
  }).join("")+`<div class="salbar" title="Salary used"><i style="width:${pct}%"></i></div>`;
  $("slots").querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{
    if(slotFrozen(b.dataset.drop)) return toast("That game started — they stay on the card");
    delete STATE.lineup[b.dataset.drop];
    saveStore(); paintAll();
  });
  $("slots").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    window.PICK_SLOT=b.getAttribute("data-pick");
    const sel=$("posFilt");
    if(sel){ sel.value = window.PICK_SLOT==="RB2"?"RB":window.PICK_SLOT==="WR2"||window.PICK_SLOT==="WR3"?"WR":window.PICK_SLOT; }
    paintSlots(); paintPool();
  });
}

function defaultStat(pos){
  if(pos==="QB") return {k:"passingYards", n:"Pass yards"};
  if(pos==="RB") return {k:"rushingYards", n:"Rush yards"};
  if(pos==="TE") return {k:"receivingYards", n:"Rec yards"};
  if(pos==="WR") return {k:"receivingYards", n:"Rec yards"};
  return {k:"", n:""};
}
const LOGS={};
function yearGames(games){
  return (games||[]).slice(-18);
}
function workScore(p){
  const g=yearGames(LOGS[p.id]||[]);
  const st=defaultStat(p.pos);
  return g.reduce((s,x)=>s+(x[st.k]||0),0);
}
function volume(p){
  const g=yearGames(LOGS[p.id]||[]);
  const sum=(k)=>g.reduce((s,x)=>s+(x[k]||0),0);
  if(p.pos==="QB") return sum("passingYards");
  if(p.pos==="RB") return sum("rushingYards")+sum("receivingYards")+sum("receptions")*5;
  return sum("receivingYards")+sum("receptions")*4;
}
function teamQbs(team){
  return STATE.pool.filter(x=>x.team===team && x.pos==="QB" && injOf(x)!=="Out" && injOf(x)!=="Injured Reserve")
    .sort((a,b)=> (a.depth||99)-(b.depth||99) || (b.starter?1:0)-(a.starter?1:0) || a.name.localeCompare(b.name));
}
function isQb2(p){
  if(p.pos!=="QB") return false;
  const q=teamQbs(p.team);
  return q[1] && q[1].id===p.id;
}
function hasBump(p){
  if(p.pos==="DST") return false;
  const bad=s=>s==="Out"||s==="Injured Reserve"||s==="Doubtful";
  const mates=STATE.pool.filter(x=>x.team===p.team && x.pos===p.pos);
  const down=mates.filter(x=>x.id!==p.id && bad(injOf(x)));
  if(!down.length) return false;
  const downIsLead=down.some(x=>x.starter || (x.depth||99)<=1);
  if(!downIsLead) return false;
  if(bad(injOf(p))) return false;
  const avail=mates.filter(x=>!bad(injOf(x)) || injOf(x)==="Doubtful" && x.id===p.id)
    .filter(x=>injOf(x)!=="Out" && injOf(x)!=="Injured Reserve")
    .sort((a,b)=>(a.depth||99)-(b.depth||99) || a.name.localeCompare(b.name));
  return avail[0] && avail[0].id===p.id;
}
function isRelevant(p){
  const inj=injOf(p);
  const scored=Object.prototype.hasOwnProperty.call(LOGS, p.id) && playedRows(LOGS[p.id]).length>0;
  if((inj==="Out"||inj==="Injured Reserve") && !scored && p.pos!=="DST") return false;
  if(p.pos==="DST") return true;
  const known=p.depth===1 || !!p.starter;
  const seat=p.depth||99;
  if(Object.prototype.hasOwnProperty.call(LOGS, p.id)){
    const card=rateOf(p);
    if(card && card.proj) return inj!=="Out" && inj!=="Injured Reserve";
    if(card && card.g>0 && (card.ppg>=6 || known || hasBump(p))) return true;
    if(hasBump(p)) return true;
    return false;
  }
  if(p.pos==="QB") return known || hasBump(p);
  if(p.pos==="RB") return seat<=2 || known;
  if(p.pos==="WR") return seat<=3 || known;
  if(p.pos==="TE") return seat<=1 || known;
  return false;
}

function sparkHtml(p){
  if(p.pos==="DST") return "";
  const st=defaultStat(p.pos);
  const games=LOGS[p.id];
  if(!games) return `<div class="spark" data-wait="${p.id}"></div>`;
  if(!games.length) return `<p class="meta">No log</p>`;
  const last=yearGames(games).slice(-18);
  const vals=last.map(g=>g[st.k]||0);
  const max=Math.max(1,...vals);
  return `<div class="spark">`+last.map((g,i)=>{
    const v=vals[i];
    const h=Math.max(6, Math.round((v/max)*40));
    return `<i class="hit" style="height:${h}px"><b>${v}</b><em>${g.opp||""}</em></i>`;
  }).join("")+`</div>`;
}
function parseSeasonGames(d){
  const by={};
  (d.seasonTypes||[]).forEach(st=>{
    if(/preseason/i.test(st.displayName||st.name||"")) return;
    (st.categories||[]).forEach(c=>(c.events||[]).forEach(ev=>{
      const meta=(d.events||{})[ev.eventId]||{};
      const names=ev.names||c.names||d.names||[];
      const stats=ev.stats||[];
      const row=by[ev.eventId]||{
        date:meta.gameDate||meta.date||"",
        week:meta.week||"",
        at:meta.atVs||"",
        score:meta.score||"",
        result:meta.gameResult||"",
        opp:(meta.opponent&&(meta.opponent.abbreviation||meta.opponent.displayName))||"",
        passingYards:0, passingTouchdowns:0, interceptions:0, passingAttempts:0,
        rushingYards:0, rushingTouchdowns:0, rushingAttempts:0,

function capWeekId(){
  const fmt=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"});
  const parts=fmt.formatToParts(new Date());
  const g=k=>parts.find(x=>x.type===k).value;
  const y=Number(g("year")), m=Number(g("month")), d=Number(g("day"));
  const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  const dow=map[g("weekday")];
  const dt=new Date(Date.UTC(y,m-1,d));
  const back = dow>=3 ? dow-3 : dow+4;
  dt.setUTCDate(dt.getUTCDate()-back);
  const wy=dt.getUTCFullYear(), wm=String(dt.getUTCMonth()+1).padStart(2,"0"), wd=String(dt.getUTCDate()).padStart(2,"0");
  return {id:"cap-"+wy+"-"+wm+"-"+wd, wed:dt};
}

function normName(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim(); }
function bandFor(pos){
  return {QB:[4900,7800],RB:[4000,8800],WR:[3000,8600],TE:[2500,6400],DST:[2000,4200]}[pos]||[3000,6000];
}
function dstFpts(d){
  d=d||{};
  const gp=2;
  const paG=(d.pa||0)/gp;
  let pa=0;
  if(paG<=0) pa=10;
  else if(paG<=6) pa=7;
  else if(paG<=13) pa=4;
  else if(paG<=20) pa=1;
  else if(paG<=27) pa=0;
  else if(paG<=34) pa=-1;
  else pa=-4;
  return (d.sacks||0)*1 + (d.to||0)*2 + (d.st||0)*6 + pa*gp;
}
function rateOf(p){
  if(!p) return {pts:0, g:0, ppg:0, proj:false};
  if(p.pos==="DST"){
    const pts=dstFpts(TEAMDEF[p.team]||{});
    return {pts, g:0, ppg:pts, proj:false};
  }
  if(!Object.prototype.hasOwnProperty.call(LOGS, p.id)) return null;
  const games=playedRows(LOGS[p.id]);
  if(games.length){
    const pts=games.reduce((s,g)=>s+gameFpts(g),0);
    return {pts, g:games.length, ppg:pts/games.length, proj:false};
  }
  const known=(p.depth===1 || p.starter) && injOf(p)!=="Out" && injOf(p)!=="Injured Reserve";
  if(!known) return {pts:0, g:0, ppg:0, proj:false};
  const prior=playedRows(PRIOR[p.id]||[]);
  if(prior.length){
    const pts=prior.reduce((s,g)=>s+gameFpts(g),0);
    return {pts:0, g:0, ppg:pts/prior.length, proj:true, prior:true};
  }
  const base={QB:15, RB:12, WR:10, TE:7}[p.pos]||8;
  return {pts:0, g:0, ppg:base, proj:true, prior:false};
}
function willPlay(p){
  if(!p || p.pos==="DST") return true;
  const seat=p.depth||99;
  if(seat===1) return true;
  if(seat>=99 && p.starter) return true;
  return false;
}
function fptsOf(p){
  if(!p) return 0;
  const card=rateOf(p);
  if(!card) return 0;
  if(p.pos==="DST") return card.ppg;
  if(willPlay(p) || hasBump(p)) return card.ppg;
  return 0;
}
function fptsFrom(s){
  s=s||{};

}

function gamesOf(p){

}
function seasonPts(p){

function leaderLine(p){
  if(p.pos==="DST"){
    const d=TEAMDEF[p.team]||{};
    const bits=[];
    if(d.pa!=null) bits.push(d.pa+" PA");
    if(d.to!=null) bits.push(d.to+" TO");
    if(d.sacks!=null) bits.push(d.sacks+" SK");
    if(d.st) bits.push(d.st+" ST TD");

    return bits.join(" · ")||"D/ST";
  }
  if(!Object.prototype.hasOwnProperty.call(LOGS, p.id)) return "…";
  const card=rateOf(p);
  if(!card) return "…";
  if(card.proj) return "PROJ "+card.ppg.toFixed(1)+(card.prior?" · last year":" · starter");
  if(!card.g) return "No games";
  const seat=(p.depth||99)<=8 ? (" · "+p.pos+p.depth) : "";
  const bench=(!willPlay(p) && !hasBump(p)) ? " · bench" : "";
  return card.pts.toFixed(1)+" in "+card.g+"G · "+card.ppg.toFixed(1)+seat+bench;

function fppgOf(p){

}
function injOf(p){ return (STATE.inj&&STATE.inj[p.id])||""; }
function projOf(p){
  if(injOf(p)==="Out"||injOf(p)==="Injured Reserve") return 0;

}
function posCeil(pos){
  const base={QB:26, RB:22, WR:22, TE:16, DST:14}[pos]||20;
  let m=base;
  (STATE.pool||[]).forEach(p=>{
    if(p.pos!==pos) return;
    const card=rateOf(p);
    if(card && !card.proj && willPlay(p) && card.ppg>m) m=card.ppg;
  });
  return m;
}
function priceLikeDk(p){
  const [lo,hi]=bandFor(p.pos);
  const inj=injOf(p);
  if(p.pos!=="DST" && !Object.prototype.hasOwnProperty.call(LOGS, p.id)) return Math.round(((lo+hi)/2)/100)*100;
  const pts=fptsOf(p);
  if(hasBump(p) && p.pos==="QB" && pts<12) return 5600;
  if(hasBump(p) && pts<8){
    const bump=p.pos==="RB"?5200:4600;
    return bump;
  }
  if(!pts) return lo;
  const ceil=posCeil(p.pos)||1;
  let t=Math.max(0,Math.min(1,pts/ceil));
  let sal=Math.round((lo+Math.pow(t,0.9)*(hi-lo))/100)*100;
  if(pts>0) sal=Math.max(sal, lo+400);
  if(inj==="Out"||inj==="Injured Reserve") sal=Math.max(lo, sal-1500);
  if(inj==="Doubtful") sal=Math.max(lo+200, sal-800);
  return sal;
}

function nextInjuryPass(){
  const slots=[[11,0],[14,0],[18,30]];
  const fmt=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",hour:"numeric",minute:"numeric",hour12:false,weekday:"short"});
  // compute ms until next slot
  const now=new Date();
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(now);
  const g=k=>Number(parts.find(x=>x.type===k).value);
  const h=g("hour"), m=g("minute");
  for(const [H,M] of slots){
    if(h<H || (h===H && m<M)){
      const wait=((H-h)*60+(M-m))*60*1000 - g("second")*1000;
      return Math.max(15000, wait);
    }
  }
  return ((24-h+11)*60-m)*60*1000;
}

  $("pool").innerHTML="<p class='hint'>Loading slates…</p>";
  const jobs=STATE.games.flatMap(g=>[
    loadRoster(g.awayId,g.awayAb,g),
    loadRoster(g.homeId,g.homeAb,g)
  ]);
  const chunks=await Promise.all(jobs);
  const seen=new Set();
  STATE.pool=chunks.flat().filter(p=>{
    if(!p||seen.has(p.id)) return false; seen.add(p.id); return true;
  }).map(p=>{
    if(p.starter && !p.depth) p.depth=1;
    p.inj=injOf(p); p.sal=priceLikeDk(p); return p;
  });
  repriceAll();
  $("weekLine").textContent=STATE.label+" · $50,000 · games played only";
  paintAll();
  Promise.all([
    loadInjuries().then(()=>{ repriceAll(); paintAll(); }),
    pullBoard().then(()=>paintStand()),
    Promise.all(STATE.games.flatMap(g=>[loadDepth(g.awayId),loadDepth(g.homeId)])).then(()=>{
      STATE.pool.forEach(p=>{
        const d=Object.values(DEPTH).find(m=>m[p.id]!=null);
        if(d) p.depth=d[p.id];
        else if(p.starter) p.depth=1;
      });
      repriceAll();
      paintAll();
      primeLogs(STATE.pool);
    })
  ]).catch(()=>{});
  primeLogs(STATE.pool);
}

function num(v){ return Number(String(v||"0").replace(/,/g,""))||0; }

function playerPtsFromBox(sum, pid){
  const sides=((sum.boxscore||{}).players)||[];
  let passY=0,passTd=0,ints=0,rushY=0,rushTd=0,rec=0,recY=0,recTd=0,fum=0;
  sides.forEach(side=>{
    (side.statistics||[]).forEach(grp=>{
      const keys=grp.keys||grp.names||[];
      const ix = k => keys.indexOf(k);
      (grp.athletes||[]).forEach(a=>{
        if(!a.athlete || String(a.athlete.id)!==String(pid)) return;
        const st=a.stats||[];
        const g=(k)=>{
          let i=ix(k);
          if(i<0) i=keys.findIndex(x=>String(x).replace(/\s/g,"").toLowerCase()===k.toLowerCase());
          return i>=0?num(st[i]):0;
        };
        passY+=g("passingYards"); passTd+=g("passingTouchdowns"); ints+=g("interceptions");
        rushY+=g("rushingYards"); rushTd+=g("rushingTouchdowns");
        rec+=g("receptions"); recY+=g("receivingYards"); recTd+=g("receivingTouchdowns");
        fum+=g("fumblesLost")+g("fumbles");
      });
    });
  });
  let pts = passY*0.04 + passTd*4 + ints*-1 + rushY*0.1 + rushTd*6 + rec*1 + recY*0.1 + recTd*6 + fum*-1;
  if(passY>=300) pts+=3;
  if(rushY>=100) pts+=3;
  if(recY>=100) pts+=3;
  return Math.round(pts*10)/10;
}

function teamBoxRow(sum, teamId){
  const box=((sum.boxscore||{}).teams)||[];
  return box.find(t=>String((t.team&&t.team.id)||"")===String(teamId))||null;
}
function boxStat(row, name){
  if(!row) return 0;
  const s=(row.statistics||[]).find(x=>String(x.name||"").toLowerCase()===name.toLowerCase());
  return s?num(s.displayValue||s.value):0;
}
function sackCount(row){
  const raw=((row&&row.statistics||[]).find(x=>x.name==="sacksYardsLost")||{}).displayValue||"0-0";
  return num(String(raw).split("-")[0]);
}
function dstBits(sum, teamId){
  const comps=((((sum.header||{}).competitions)||[])[0]||{}).competitors||[];
  const me=comps.find(x=>String((x.team&&x.team.id)||x.id)===String(teamId));
  const them=comps.find(x=>x!==me);
  const pa=them?num(them.score):0;
  const paPts=pa===0?10:pa<=6?7:pa<=13?4:pa<=20?1:pa<=27?0:pa<=34?-1:-4;
  const mine=teamBoxRow(sum, teamId);
  const opp=them?teamBoxRow(sum, (them.team&&them.team.id)||them.id):null;
  const sk=sackCount(opp);
  const ints=boxStat(opp,"interceptions");
  const fr=boxStat(opp,"fumblesLost");
  const dtd=boxStat(mine,"defensiveTouchdowns");
  const sf=boxStat(mine,"safeties");
  return {pa, paPts, sk, ints, fr, dtd, sf, pts: Math.round((paPts+sk*1+ints*2+fr*2+dtd*6+sf*2)*10)/10};
}
function dstPtsFromSum(sum, teamId){
  return dstBits(sum, teamId).pts;
}

function scorePlayer(p){
  if(!p) return {pts:0, status:"—"};
  const sum=STATE.live[p.eventId]||STATE.live[String(p.eventId)];
  const g=STATE.games.find(x=>String(x.eventId)===String(p.eventId));
  let st=g?g.state:"pre";
  if(sum){
    const hs=((((sum.header||{}).competitions)||[])[0]||{}).status||{};
    if(hs.type&&hs.type.state) st=hs.type.state;
  }
  if(!sum) return {pts:0, status:st==="pre"?"Yet to play":"…"};
  const pts = p.pos==="DST" ? dstPtsFromSum(sum, p.teamId||p.id.replace("DST-","")) : playerPtsFromBox(sum, p.id);
  const status = st==="in"?"LIVE":st==="post"?"Final":"Yet to play";
  return {pts, status};
}

function gamePulse(eid){
  const sum=STATE.live[eid]||{};
  const g=STATE.games.find(x=>x.eventId===eid);
  const c=((((sum.header||{}).competitions)||[])[0])||{};
  const comps=c.competitors||[];
  const home=comps.find(x=>x.homeAway==="home")||comps[0]||{};
  const away=comps.find(x=>x.homeAway==="away")||comps[1]||{};
  const hab=(home.team&&(home.team.abbreviation||home.team.displayName))||"";
  const aab=(away.team&&(away.team.abbreviation||away.team.displayName))||"";
  const hs=home.score??"—", as=away.score??"—";
  const st=((c.status||{}).type||{}).state || (g&&g.state) || "pre";
  const clock=((c.status||{}).displayClock)||"";
  const per=((c.status||{}).period)||"";
  const sit=st==="in" ? ((per?("Q"+per+" "):"")+clock).trim() : st==="post"?"Final":"Pre";
  const plays=(sum.scoringPlays||sum.drives&&sum.drives.current&&sum.drives.current.plays)||[];
  let last="";
  if(Array.isArray(plays)&&plays.length) last=(plays[plays.length-1].text||plays[plays.length-1].shortText||"");
  else if(sum.winprobability && sum.plays) {}
  const sitPlay=((sum.drives||{}).current||{}).plays;
  if(!last && Array.isArray(sitPlay)&&sitPlay.length) last=sitPlay[sitPlay.length-1].text||"";
  return {hab,aab,hs,as,st,sit,last,score:aab+" "+as+" @ "+hab+" "+hs};
}

function pullBox(p){
  const o={passY:0,passTd:0,ints:0,rushY:0,rushTd:0,rec:0,recY:0,recTd:0,fum:0};
  const sum=p&&(STATE.live[p.eventId]||STATE.live[String(p.eventId)]);
  if(!p||!sum||p.pos==="DST") return o;
  const sides=((sum.boxscore||{}).players)||[];
  sides.forEach(side=>{(side.statistics||[]).forEach(grp=>{
    const keys=grp.keys||grp.names||[];
    const ix=k=>keys.indexOf(k);
    (grp.athletes||[]).forEach(a=>{
      if(!a.athlete||String(a.athlete.id)!==String(p.id)) return;
      const st=a.stats||[];
      const g=k=>{ let i=ix(k); if(i<0) i=keys.findIndex(x=>String(x).replace(/\s/g,"").toLowerCase()===k.toLowerCase()); return i>=0?num(st[i]):0; };
      o.passY+=g("passingYards"); o.passTd+=g("passingTouchdowns"); o.ints+=g("interceptions");
      o.rushY+=g("rushingYards"); o.rushTd+=g("rushingTouchdowns");
      o.rec+=g("receptions"); o.recY+=g("receivingYards"); o.recTd+=g("receivingTouchdowns");
      o.fum+=g("fumblesLost");
    });

  return o;
}
function scoreRows(p){
  if(!p) return [];
  if(p.pos==="DST"){
    const sum=STATE.live[p.eventId]||STATE.live[String(p.eventId)]||{};
    const b=dstBits(sum, p.teamId||String(p.id).replace("DST-",""));
    return [
      {lab:"Points allowed", raw:b.pa+" allowed", rate:b.paPts+" pts", pts:b.paPts, on:true},
      {lab:"Sacks", raw:String(b.sk), rate:"1 pt each", pts:b.sk, on:b.sk>0},
      {lab:"Interceptions", raw:String(b.ints), rate:"2 pts each", pts:b.ints*2, on:b.ints>0},
      {lab:"Fumbles recovered", raw:String(b.fr), rate:"2 pts each", pts:b.fr*2, on:b.fr>0},
      {lab:"Defensive TDs", raw:String(b.dtd), rate:"6 pts each", pts:b.dtd*6, on:b.dtd>0},
      {lab:"Safeties", raw:String(b.sf), rate:"2 pts each", pts:b.sf*2, on:b.sf>0}
    ];
  }
  const b=pullBox(p);
  const rows=[
    {lab:"Passing yards", raw:b.passY+" yds", rate:"0.04 / yd", pts:b.passY*0.04, on:b.passY>0},
    {lab:"Passing TDs", raw:b.passTd+" TD", rate:"4.0 each", pts:b.passTd*4, on:b.passTd>0},
    {lab:"Interceptions", raw:b.ints+" INT", rate:"−1.0 each", pts:b.ints*-1, on:b.ints>0},
    {lab:"Rushing yards", raw:b.rushY+" yds", rate:"0.10 / yd", pts:b.rushY*0.1, on:b.rushY>0},
    {lab:"Rushing TDs", raw:b.rushTd+" TD", rate:"6.0 each", pts:b.rushTd*6, on:b.rushTd>0},
    {lab:"Receptions", raw:b.rec+" rec", rate:"1.0 PPR", pts:b.rec*1, on:b.rec>0},
    {lab:"Receiving yards", raw:b.recY+" yds", rate:"0.10 / yd", pts:b.recY*0.1, on:b.recY>0},
    {lab:"Receiving TDs", raw:b.recTd+" TD", rate:"6.0 each", pts:b.recTd*6, on:b.recTd>0},
    {lab:"Fumbles lost", raw:b.fum+"", rate:"−1.0 each", pts:b.fum*-1, on:b.fum>0},
    {lab:"300-yd pass bonus", raw:b.passY>=300?"Hit":"—", rate:"+3.0", pts:b.passY>=300?3:0, on:b.passY>=300},
    {lab:"100-yd rush bonus", raw:b.rushY>=100?"Hit":"—", rate:"+3.0", pts:b.rushY>=100?3:0, on:b.rushY>=100},
    {lab:"100-yd rec bonus", raw:b.recY>=100?"Hit":"—", rate:"+3.0", pts:b.recY>=100?3:0, on:b.recY>=100}
  ];
  if(p.pos==="QB") return rows.filter(r=>/Pass|Int|Rush|Fumb|300|100-yd rush/.test(r.lab));
  if(p.pos==="RB") return rows.filter(r=>/Rush|Rec|Fumb|100/.test(r.lab)&&!/Pass|300/.test(r.lab));
  return rows.filter(r=>/Rec|Rush|Fumb|100-yd rec/.test(r.lab)&&!/Pass|300|100-yd rush/.test(r.lab));
}

  $("liveGrid").querySelectorAll("[data-break]").forEach(row=>row.onclick=()=>{ if(row.dataset.break) openLiveBreak(row.dataset.break); });

      const mine=String(row.name||"").trim().toLowerCase()===String(STATE.sealName||STATE.name||"").trim().toLowerCase();
      const i=STATE.cards.findIndex(c=>c.id===id);
      const card={id,name:row.name,week:row.week,lineup,locked:true,at:Date.parse(row.locked_at||0)||Date.now(),remote:true,mine};
      if(i>=0) STATE.cards[i]=card; else STATE.cards.push(card);
    });
    STATE.cards=STATE.cards.filter(c=>c.week===STATE.week);
  }catch(e){ STATE.boardErr=String(e.message||e); }
}
async function pushCard(create){
  if(!STATE.locked || !STATE.week) return;
  const name=(STATE.name||"Untitled").slice(0,24);
  const body={
    week:STATE.week,
    name,
    lineup:STATE.lineup,
    pts:cardTotal(STATE.lineup),
    locked_at:new Date().toISOString()
  };
  try{
    if(create){
      const r=await fetch(SUPA_URL+"/rest/v1/cards?on_conflict=week,name",{
        method:"POST",
        headers:supaHeaders({"Prefer":"resolution=merge-duplicates,return=minimal"}),
        body:JSON.stringify(body)
      });
      if(!r.ok) STATE.boardErr=await r.text();
      else STATE.boardErr="";
      return;
    }
    const r=await fetch(SUPA_URL+"/rest/v1/cards?week=eq."+encodeURIComponent(STATE.week)+"&week=like.cap-*&name=eq."+encodeURIComponent(name),{
      method:"PATCH",
      headers:supaHeaders({"Prefer":"return=minimal"}),
      body:JSON.stringify({pts:body.pts,lineup:body.lineup,locked_at:body.locked_at})
    });
    if(!r.ok) STATE.boardErr=await r.text();
    else STATE.boardErr="";
  }catch(e){ STATE.boardErr=String(e.message||e); }
}

function upsertCard(){
  const id = (STATE.name||"Card")+"|"+STATE.week;
  const row = {id, name:STATE.name||"Untitled", week:STATE.week, lineup:{...STATE.lineup}, locked:STATE.locked, at:Date.now(), mine:true};
  STATE.cards=STATE.cards.filter(c=>!(c.mine && c.week===STATE.week && c.name!==row.name));
  const i=STATE.cards.findIndex(c=>c.id===id);
  if(i>=0) STATE.cards[i]=row; else STATE.cards.unshift(row);
  STATE.cards=STATE.cards.filter(c=>c.week!==STATE.week || !c.mine || c.name===row.name);
}

async function deleteCard(name){
  try{
    const r=await fetch(SUPA_URL+"/rest/v1/cards?week=eq."+encodeURIComponent(STATE.week)+"&week=like.cap-*&name=eq."+encodeURIComponent(name),{
      method:"DELETE",
      headers:supaHeaders({"Prefer":"return=minimal"})
    });
    if(!r.ok){
      const msg=await r.text();
      return toast(/policy|42501|permission/i.test(msg)?"Run DELETE policy in Supabase SQL":("Delete failed "+r.status));
    }
    STATE.cards=STATE.cards.filter(c=>!(c.week===STATE.week && c.name===name));
    if(STATE.name===name){ STATE.locked=false; STATE.sealName=""; STATE.lineup={}; STATE.name=""; saveStore(); }
    await pullBoard();
    toast("Removed "+name);
    paintStand();
  }catch(e){ toast("Delete failed"); }
}
function slotLiveName(pid, mine){
  const p=STATE.pool.find(x=>x.id===pid);
  if(!p) return mine?"—":"Covered";
  if(mine || gameStarted(p)) return p.name;
  return "Covered";
}
function lineupLine(c){
  const mine=!!c.mine || c.name===STATE.name;
  return SLOTS.map(k=>{
    const pid=c.lineup&&c.lineup[k];
    if(!pid) return slotLabel(k)+": —";
    return slotLabel(k)+": "+slotLiveName(pid, mine);
  }).join(" · ");
}
function paintStand(){
  const admin=sessionStorage.getItem("sauceCap.admin")==="1";
  const ranked=STATE.cards.filter(c=>c.week===STATE.week).map(c=>({...c, pts:cardTotal(c.lineup)})).sort((a,b)=>b.pts-a.pts);
  const top=ranked.length?Math.max(ranked[0].pts,1):1;
  $("standNow").innerHTML = ranked.length ? ranked.map((c,i)=>{
    const pct=Math.max(6, Math.round(c.pts/top*100));
    const mine=String(c.name||"").trim().toLowerCase()===String(STATE.name||"").trim().toLowerCase();
    return `<button class="seat" type="button" data-open="${c.name}"><div class="rk">${i+1}</div><div><b>${c.name}${mine?" · you":""}</b><span>9 of 9</span><div class="meter"><i style="width:${pct}%"></i></div></div><div class="rec">${STATE.liveReady?c.pts.toFixed(1):"—"}</div></button>${admin?`<button type="button" class="quiet" data-del="${c.name}">Remove</button>`:""}`;
  }).join("") : `<p class="hint">No locked lineups this week.</p>`;
  $("standNow").insertAdjacentHTML("beforeend", `<p style="text-align:right;padding:10px 16px 0"><button type="button" id="adminBtn" class="quiet">${admin?"Admin on":"Manage"}</button></p>`);
  const ab=$("adminBtn");
  if(ab) ab.onclick=()=>{
    if(sessionStorage.getItem("sauceCap.admin")==="1"){ sessionStorage.removeItem("sauceCap.admin"); paintStand(); return; }
    const pin=prompt("Admin code");
    if(pin===ADMIN_PIN){ sessionStorage.setItem("sauceCap.admin","1"); paintStand(); }
    else if(pin) toast("Wrong code");
  };
  $("standNow").onclick=e=>{
    const del=e.target.closest("[data-del]");
    if(del){ e.preventDefault(); deleteCard(del.getAttribute("data-del")); return; }
    const row=e.target.closest("[data-open]");
    if(row) openCardLive(row.getAttribute("data-open"));
  };
  $("standLog").innerHTML = (STATE.log||[]).length ? STATE.log.slice(0,16).map(r=>`
    <div class="lrow"><div class="topr"><b>${r.name}</b><div class="pts">${Number(r.pts||0).toFixed(1)}</div></div>
    <div class="sub">${r.week} · final</div></div>`).join("") : "";
}

function nameTaken(name){
  const n=String(name||"").trim().toLowerCase();
  const mine=String(STATE.sealName||STATE.name||"").trim().toLowerCase();
  if(n && n===mine) return false;
  return (STATE.cards||[]).some(c=>{
    if(c.week!==STATE.week) return false;
    if(c.mine) return false;
    if(String(c.name||"").trim().toLowerCase()!==n) return false;
    return n!==mine;
  });
}
function lockCard(){
  if(STATE.locked && STATE.week) return toast("Already locked — rename is open until a game starts");
  if(!filled() || remain()<0) return toast("Fill 9 and stay under $50,000");
  const finish=name=>{
    if(!name || /^sunday card$/i.test(name)) return toast("Give the card a name");
    if(nameTaken(name)) return toast("That name is taken this week — pick another");
    STATE.name = name;
    STATE.sealName = name;
    STATE.locked = true;
    upsertCard();
    snapshotIfFinal();
    saveStore();
    paintAll();
    pushCard(true).then(()=>{
      return pullBoard();
    }).then(()=>{
      toast(STATE.boardErr ? "Locked on this phone — board save failed" : "Locked · on the shared board");
      tabTo("stand"); paintStand();
    });
  };
  const have=(STATE.name||"").trim();
  if(have) return finish(have);
  const box=$("nameAsk"), input=$("nameAskInput");
  box.classList.add("on");
  input.value="";
  input.focus();
  $("nameAskGo").onclick=()=>{
    const name=input.value.trim().slice(0,24);
    if(!name) return;
    box.classList.remove("on");
    finish(name);
  };
}

function snapshotIfFinal(){
  const allDone = SLOTS.every(k=>{
    const p=STATE.pool.find(x=>x.id===STATE.lineup[k]);
    const g=STATE.games.find(x=>x.eventId===(p&&p.eventId));
    return g && g.state==="post";
  });
  if(!allDone || !STATE.locked) return;
  const pts=cardTotal(STATE.lineup);
  if(STATE.log.some(x=>x.week===STATE.week && x.name===STATE.name)) return;
  STATE.log.unshift({week:STATE.week, name:STATE.name, pts, at:Date.now()});
  STATE.log=STATE.log.slice(0,40);
}

function seasonKeys(pos){
  if(pos==="QB") return [
    {k:"passingYards", n:"Pass yards", lines:[175,200,225,250,275,300]},
    {k:"passingTouchdowns", n:"Pass TDs", lines:[1,2,3]},
    {k:"rushingYards", n:"Rush yards", lines:[15,20,25,30,40]},
    {k:"rushingTouchdowns", n:"Rush TDs", lines:[1]}
  ];
  if(pos==="RB") return [
    {k:"rushingYards", n:"Rush yards", lines:[40,50,60,70,80,100]},
    {k:"rushingTouchdowns", n:"Rush TDs", lines:[1]},
    {k:"receptions", n:"Receptions", lines:[2,3,4,5]},
    {k:"receivingYards", n:"Rec yards", lines:[20,30,40,50]},
    {k:"receivingTouchdowns", n:"Rec TDs", lines:[1]}
  ];
  return [
    {k:"receptions", n:"Receptions", lines:[3,4,5,6,7]},
    {k:"receivingYards", n:"Rec yards", lines:[30,40,50,60,70,80]},
    {k:"receivingTouchdowns", n:"Rec TDs", lines:[1]},
    {k:"rushingYards", n:"Rush yards", lines:[5,10,15,20]}
  ];
}
function lineOpts(stat){
  if(/Touchdown/.test(stat)) return [1,2];
  if(stat==="passingYards") return [175,200,225,250,275,300];
  if(stat==="rushingYards") return [20,30,40,50,60,70,80,100];
  if(stat==="receivingYards") return [30,40,50,60,70,80];
  if(stat==="receptions") return [3,4,5,6,7];
  return [1];
}
function thisSeasonGames(d){
  const rows=[];
  (d.seasonTypes||[]).forEach(st=>{
    const label=(st.displayName||st.name||"");
    if(/preseason/i.test(label)) return;
    (st.categories||[]).forEach(c=>(c.events||[]).forEach(ev=>{
      const meta=(d.events||{})[ev.eventId]||{};
      const date=meta.gameDate||meta.date||"";
      rows.push({
        date, opp:(meta.opponent&&(meta.opponent.abbreviation||meta.opponent.displayName))||"",
        stats:ev.stats||[], names:ev.names||d.names||[]
      });
    }));
  });
  rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return rows;
}
function pickStat(row,key){
  const i=(row.names||[]).indexOf(key);
  return i>=0?num(row.stats[i]):0;
}
function gameWhen(g){
  let day="";
  if(g.date){
    const d=new Date(g.date);
    if(!isNaN(d.getTime())) day=d.toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"America/Chicago"});
  }
  return [g.week?("Wk "+g.week):"", day].filter(Boolean).join(" · ");
}
function gameBlurb(g, pos){
  const bits=[];
  if(pos==="QB" || g.passingAttempts || g.passingYards || g.passingTouchdowns){
    bits.push((g.passingYards||0)+" pass yds");
    if(g.passingTouchdowns) bits.push(g.passingTouchdowns+" TD");
    if(g.interceptions) bits.push(g.interceptions+" INT");
  }
  if(g.rushingAttempts || g.rushingYards || g.rushingTouchdowns){
    bits.push((g.rushingYards||0)+" rush");
    if(g.rushingTouchdowns) bits.push(g.rushingTouchdowns+" rush TD");
  }
  if(pos!=="QB" && (g.receptions||g.receivingYards||g.receivingTouchdowns)){
    bits.push((g.receptions||0)+" rec");
    bits.push((g.receivingYards||0)+" yds");
    if(g.receivingTouchdowns) bits.push(g.receivingTouchdowns+" TD");
  }
  return bits.join(" · ")||"Played";
}
function paintResearchSheet(p, games){
  const played=playedRows(games).slice().reverse();
  const total=played.reduce((s,g)=>s+gameFpts(g),0);
  const ppg=played.length?total/played.length:0;
  const rows=played.map(g=>{
    const where=(g.at==="@"?"@ ":"vs ")+(g.opp||"OPP");
    const extra=[g.score, g.result].filter(Boolean).join(" ");
    return `<div class="grow">
      <div>
        <b>${where}</b>
        <span>${gameWhen(g)}${extra?(" · "+extra):""}</span>
        <span>${gameBlurb(g, p.pos)}</span>
      </div>
      <div class="fp">${gameFpts(g).toFixed(1)}<small>FPTS</small></div>
    </div>`;
  }).join("");
  $("sheet").innerHTML=`<div class="grab"></div>
    <div class="sheethead">
      <div>
        <h3>${p.name}</h3>
        <p class="sub">${p.pos} · ${p.team}${p.opp?(" vs "+p.opp):""}</p>
      </div>
      <div class="pay">$${p.sal.toLocaleString()}</div>
      <button class="close" id="shX" type="button">×</button>
    </div>
    ${injBox(p)}
    <div class="rate"><b>${played.length?ppg.toFixed(1):"—"}</b><span>${played.length?(total.toFixed(1)+" fantasy points in "+played.length+" game"+(played.length===1?"":"s")):"No games played"}</span></div>
    <p class="seclab">Game log</p>
    ${rows?`<div class="flog">${rows}</div>`:"<p class='hint'>No games in the log yet.</p>"}`;
  $("shX").onclick=()=>{ STATE.breakId=null; $("drawer").classList.remove("on"); };
}

function injBox(p){
  const n=(STATE.injNews||{})[p.id];
  const st=injOf(p);
  if(!st && !n) return "";
  const status=(n&&n.status)||st;
  const part=n&&n.part?n.part:"";
  const news=(n&&(n.short||n.long))||"";
  const ret=n&&n.ret?(" · return "+n.ret):"";
  return `<div class="injbox"><b>${status}${part?(" · "+part):""}${ret}</b>${news?`<p>${news}</p>`:""}</div>`;
}
const DSTLOG={};
async function loadDstLog(p){
  const tid=String(p.teamId||String(p.id).replace(/^DST-/,""));
  const r=await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/"+tid+"/schedule?season=2026",{cache:"no-store"});
  const d=r.ok?await r.json():{};
  const events=(d.events||[]).filter(e=>{
    const kind=String(((e.seasonType||{}).type)||((e.seasonType||{}).id)||"");
    if(kind && kind!=="2") return false;
    const comp=(e.competitions||[])[0]||{};
    return (((comp.status||{}).type||{}).state)==="post";
  });
  const sums=await Promise.all(events.map(async e=>{
    try{
      const res=await fetch("https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/summary?event="+e.id,{cache:"force-cache"});
      return res.ok?await res.json():null;
    }catch(err){ return null; }
  }));
  return events.map((e,i)=>{
    const comp=(e.competitions||[])[0]||{};
    const comps=comp.competitors||[];
    const me=comps.find(c=>String((c.team||{}).id)===tid)||{};
    const them=comps.find(c=>c!==me)||{};
    const my=num((me.score&&(me.score.displayValue!=null?me.score.displayValue:me.score.value))||0);
    const th=num((them.score&&(them.score.displayValue!=null?them.score.displayValue:them.score.value))||0);
    let bits=sums[i]?dstBits(sums[i], tid):null;
    if(!bits){
      const paPts=th===0?10:th<=6?7:th<=13?4:th<=20?1:th<=27?0:th<=34?-1:-4;
      bits={pa:th, paPts, sk:0, ints:0, fr:0, dtd:0, sf:0, pts:paPts};
    }
    return {
      week:(e.week&&e.week.number)||"",
      date:e.date||"",
      at:me.homeAway==="away"?"@":"vs",
      opp:(them.team||{}).abbreviation||"",
      score:my+"-"+th,
      result:my>th?"W":my<th?"L":"T",
      bits
    };
  }).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function dstBlurb(b){
  b=b||{};
  const bits=[(b.pa!=null?b.pa:0)+" allowed"];
  if(b.sk) bits.push(b.sk+" sack"+(Number(b.sk)===1?"":"s"));
  if(b.ints) bits.push(b.ints+" INT");
  if(b.fr) bits.push(b.fr+" FR");
  if(b.dtd) bits.push(b.dtd+" def TD");
  if(b.sf) bits.push(b.sf+" safety");
  return bits.join(" · ");
}
function paintDstSheet(p, games){
  const played=(games||[]).slice().reverse();
  const total=played.reduce((s,g)=>s+((g.bits&&g.bits.pts)||0),0);
  const ppg=played.length?total/played.length:0;
  const rows=played.map(g=>{
    const where=(g.at==="@"?"@ ":"vs ")+(g.opp||"OPP");
    const extra=[g.result, g.score].filter(Boolean).join(" ");
    const pts=(g.bits&&g.bits.pts)||0;
    return `<div class="grow">
      <div>
        <b>${where}</b>
        <span>${gameWhen(g)}${extra?(" · "+extra):""}</span>
        <span>${dstBlurb(g.bits)}</span>
      </div>
      <div class="fp">${Number(pts).toFixed(1)}<small>FPTS</small></div>
    </div>`;
  }).join("");
  $("sheet").innerHTML=`<div class="grab"></div>
    <div class="sheethead">
      <div>
        <h3>${p.name}</h3>
        <p class="sub">${p.pos} · ${p.team}${p.opp?(" vs "+p.opp):""}</p>
      </div>
      <div class="pay">$${p.sal.toLocaleString()}</div>
      <button class="close" id="shX" type="button">×</button>
    </div>
    <div class="rate"><b>${played.length?ppg.toFixed(1):"—"}</b><span>${played.length?(total.toFixed(1)+" fantasy points in "+played.length+" game"+(played.length===1?"":"s")):"No games played"}</span></div>
    <p class="seclab">Game log</p>
    ${rows?`<div class="flog">${rows}</div>`:"<p class='hint'>No games in the log yet.</p>"}`;
  $("shX").onclick=()=>{ STATE.breakId=null; $("drawer").classList.remove("on"); };
}
async function openResearch(id){
  const p=STATE.pool.find(x=>x.id===id);
  if(!p) return;
  const sheet=$("sheet");
  $("drawer").classList.add("on");
  sheet.innerHTML=`<button class="close" id="shX">✕</button><h3>${p.name}</h3><p class="hint">Loading this season…</p>`;
  $("shX").onclick=()=>{ STATE.breakId=null; $("drawer").classList.remove("on"); };
  if(p.pos==="DST"){
    try{
      const games=DSTLOG[p.id]||await loadDstLog(p);
      DSTLOG[p.id]=games;
      paintDstSheet(p, games);
    }catch(e){
      sheet.innerHTML=`<button class="close" id="shX">✕</button><h3>${p.name}</h3><p class="hint">Could not load this season.</p>`;
      $("shX").onclick=()=>{ STATE.breakId=null; $("drawer").classList.remove("on"); };
    }
    return;
  }
  try{
    const r=await fetch("https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/"+p.id+"/gamelog",{cache:"no-store"});
    const d=r.ok?await r.json():{};
    const games=parseSeasonGames(d);
    if(games.length) LOGS[p.id]=games;
    paintResearchSheet(p, games.length?games:(LOGS[p.id]||[]));
  }catch(e){
    sheet.innerHTML=`<button class="close" id="shX">✕</button><h3>${p.name}</h3><p class="hint">Could not load this season.</p>`;
    $("shX").onclick=()=>{ STATE.breakId=null; $("drawer").classList.remove("on"); };
  }
}

$("drawer").onclick=e=>{ if(e.target.id==="drawer"){ STATE.breakId=null; e.currentTarget.classList.remove("on"); } };
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>tabTo(b.dataset.tab));
$("posFilt").onchange=paintPool;
$("qFilt").oninput=paintPool;
$("btnLock").onclick=lockCard;
$("btnClear").onclick=()=>{
  const keep={};
  SLOTS.forEach(k=>{ if(slotFrozen(k)) keep[k]=STATE.lineup[k]; });
  if(STATE.locked) return toast("Unlock first");
  STATE.lineup=keep;
  saveStore(); paintAll();
};
$("btnUnlock").onclick=()=>{
  if(!STATE.locked) return;
  STATE.locked=false;
  saveStore(); paintAll();
  toast("Unlocked. Started games stay on the card.");
};

loadStore();
(async function boot(){
  try{
    const prevWeek=STATE.week;
    await loadSlate();
    if(prevWeek && prevWeek!==STATE.week){ STATE.locked=false; STATE.lineup={}; STATE.name=""; STATE.sealName=""; saveStore(); }
    await loadPool();
    await pullBoard();
    await refreshLive();
    const stay=sessionStorage.getItem("sauceCap.tab")==="stand"?"stand":"build";
    tabTo(stay);
    startInjuryClock();
    setInterval(()=>{
      const live=STATE.games.some(g=>g.state==="in");
      const watching=!$("tab-stand").hidden || !$("tab-live").hidden;
      if(live || watching) refreshLive();
    }, 20000);
  }catch(e){
    $("weekLine").textContent="Could not load the slate";
    $("pool").innerHTML="<p class='hint'>"+(e.message||e)+"</p>";
  }
})();
</script>
