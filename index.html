<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Volume Board</title>
<link rel="stylesheet" href="styles.css"/>
</head><body>
<header class="top">
    <p class="eyebrow">Research board</p>
    <h1>Volume Board</h1>
    <p class="sub">Players and teams are separate tabs. Team lines are closing numbers, not live FanDuel.</p>
  </header>
  <div class="tabs">
    <button type="button" class="on" data-mode="players">Players</button>
    <button type="button" data-mode="teams">Teams</button>
  </div>
  <section class="controls" id="playerControls">
    <div class="row">
      <label>Position<select id="pos"></select></label>
      <label>Stat<select id="market"></select></label>
    </div>
    <label>Line<select id="line"></select></label>
    <div class="row">
      <label>Min games<input id="minGames" type="number" min="1" max="18" value="8" /></label>
      <label>Min hits<input id="minHits" type="number" min="0" max="18" value="10" /></label>
    </div>
    <label>Game<select id="game"></select></label>
    <label>Search<input id="q" type="search" placeholder="Player name" autocomplete="off" /></label>
  </section>
  <section class="controls" id="teamControls" hidden>
    <div class="row">
      <label>Market<select id="tMarket"></select></label>
      <label>Home / Away<select id="tSplit"></select></label>
    </div>
    <div class="row">
      <label>Min games<input id="tMinGames" type="number" min="1" max="18" value="8" /></label>
      <label>Min hits<input id="tMinHits" type="number" min="0" max="18" value="8" /></label>
    </div>
    <label>Search<input id="tQ" type="search" placeholder="Team code (DET)" autocomplete="off" /></label>
  </section>
  <section class="summary" id="summary"></section>
  <section class="list" id="list"></section>
  <div class="sheet" id="sheet"><div class="sheet-body" id="sheetBody"></div></div>
  <footer><p>2025 REG + 2026 through completed games. TNF Bills 41 Lions 31 is in.</p></footer>
<script src="full_stats.js"></script>
<script src="data.js"></script>
<script src="team_stats.js"></script>
<script src="matchup.js"></script>
<script src="media.js"></script>
<script src="injuries.js"></script>
<script src="app.js"></script>
</body></html>
