<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Volume Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <p class="eyebrow">Research board</p>
    <h1>Volume Board</h1>
    <p class="sub">Last 18 games · 2025 regular season + 2026 Week 1. Tap a name for the box log.</p>
  </header>

  <section class="controls">
    <div class="row">
      <label>Position
        <select id="pos"></select>
      </label>
      <label>Stat
        <select id="market"></select>
      </label>
    </div>
    <label>Line
      <select id="line"></select>
    </label>
    <div class="row">
      <label>Min games
        <input id="minGames" type="number" min="1" max="18" value="8" />
      </label>
      <label>Min hits
        <input id="minHits" type="number" min="0" max="18" value="10" />
      </label>
    </div>
    <label>Search
      <input id="q" type="search" placeholder="Player name" autocomplete="off" />
    </label>
  </section>

  <section class="summary" id="summary"></section>
  <section class="list" id="list"></section>
  <div class="sheet" id="sheet"><div class="sheet-body" id="sheetBody"></div></div>

  <footer>
    <p>Counts from nflverse weekly box scores. History only — not this week’s script.</p>
  </footer>

  <script src="full_stats.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
