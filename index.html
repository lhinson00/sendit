<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Volume Board</title>
<style>:root {
  --bg: #0a0a0a;
  --card: #161616;
  --line: #3a2a16;
  --text: #fff4e8;
  --muted: #c4b09a;
  --gold: #ff8200;
  --green: #3dd68c;
  --yellow: #ffb347;
  --btn: #1c1208;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
  max-width: 520px;
  margin: 0 auto;
}

.top { margin-bottom: 16px; }
.eyebrow {
  margin: 0;
  color: var(--gold);
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
h1 { margin: 4px 0 6px; font-size: 28px; }
.sub { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }

.controls, .summary, .card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}

label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 10px;
}
select, input {
  width: 100%;
  margin-top: 6px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets button, .week {
  border: 1px solid var(--line);
  background: var(--btn);
  color: var(--text);
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 13px;
}

.summary { font-size: 14px; color: var(--muted); }
.summary strong { color: var(--text); }

.card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px 12px;
  align-items: center;
}
.card h3 { margin: 0; font-size: 17px; }
.meta { margin: 0; color: var(--muted); font-size: 13px; }
.record {
  font-variant-numeric: tabular-nums;
  font-size: 22px;
  font-weight: 700;
  color: var(--green);
  text-align: right;
}
.record.mid { color: var(--yellow); }
.pass { font-size: 12px; color: var(--muted); text-align: right; }

.empty {
  padding: 28px 12px;
  text-align: center;
  color: var(--muted);
}

footer { color: #6d7a96; font-size: 12px; line-height: 1.45; margin-top: 8px; }

.card { cursor: pointer; }
.card:active { opacity: .85; }

.sheet {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: none;
  align-items: flex-end;
  z-index: 20;
}
.sheet.open { display: flex; }
.sheet-body {
  background: var(--card);
  border-top: 1px solid var(--line);
  border-radius: 20px 20px 0 0;
  padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
  width: 100%;
  max-height: 82vh;
  overflow: auto;
}
.sheet-body h2 { margin: 0 0 4px; font-size: 22px; }
.brk {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.brk .m { color: var(--muted); font-size: 12px; }
.close {
  margin-top: 12px;
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--btn);
  color: var(--text);
  font-size: 16px;
}

.sec {
  margin: 16px 0 6px;
  color: var(--gold);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.tblwrap { overflow-x: auto; margin: 8px 0 12px; }
table.log {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
table.log th {
  text-align: left;
  color: var(--muted);
  font-weight: 600;
  padding: 6px 6px 6px 0;
  border-bottom: 1px solid var(--line);
}
table.log td {
  padding: 7px 6px 7px 0;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.tabs button {
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--btn);
  color: var(--text);
  font-size: 16px;
}
.tabs button.on { background: #2a3b63; border-color: var(--gold); color: var(--gold); }

.sheet-head h2 { margin: 0 0 4px; }
.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 12px 0 16px;
}
.tile {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
}
.tile span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.tile b { display: block; margin-top: 4px; font-size: 20px; }
.tile.good b { color: var(--green); }
.tile.soft b { color: var(--yellow); }
.chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
}
.chip.win { background: #163528; color: var(--green); }
.chip.loss { background: #3a1c24; color: #ff8ea0; }
.chip.push { background: #2a2a20; color: var(--yellow); }
.tiny { color: var(--muted); font-size: 11px; margin-top: 2px; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.4; }
.sheet-body { padding-bottom: 28px; }

.slate { margin-bottom: 16px; }
.game {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 8px;
}
.game .when { color: var(--gold); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.game .match { font-size: 18px; font-weight: 700; margin: 4px 0; }
.game .lines { color: var(--text); font-size: 14px; }
.game .recs { margin-top: 8px; display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
</style>
</head><body>
<header class="top">
    <p class="eyebrow">Research board</p>
    <h1>Volume Board</h1>
    <p class="sub">Players and teams are separate tabs. Team lines are closing numbers, not live FanDuel.</p>
  </header>
  <div class="tabs">
    <button type="button" class="on" data-mode="players">Players</button>
    <button type="button" data-mode="teams">Teams</button>
  </div>
  <section class="controls" id="playerControls">
    <div class="row">
      <label>Position<select id="pos"></select></label>
      <label>Stat<select id="market"></select></label>
    </div>
    <label>Line<select id="line"></select></label>
    <div class="row">
      <label>Min games<input id="minGames" type="number" min="1" max="18" value="8" /></label>
      <label>Min hits<input id="minHits" type="number" min="0" max="18" value="10" /></label>
    </div>
    <label>Search<input id="q" type="search" placeholder="Player name" autocomplete="off" /></label>
  </section>
  <section class="controls" id="teamControls" hidden>
    <div class="row">
      <label>Market<select id="tMarket"></select></label>
      <label>Home / Away<select id="tSplit"></select></label>
    </div>
    <div class="row">
      <label>Min games<input id="tMinGames" type="number" min="1" max="18" value="8" /></label>
      <label>Min hits<input id="tMinHits" type="number" min="0" max="18" value="8" /></label>
    </div>
    <label>Search<input id="tQ" type="search" placeholder="Team code (DET)" autocomplete="off" /></label>
  </section>
  <section class="summary" id="summary"></section>
  <section class="list" id="list"></section>
  <div class="sheet" id="sheet"><div class="sheet-body" id="sheetBody"></div></div>
  <footer><p>2025 REG + 2026 Week 1. Team ATS / ML / O-U use closing lines from nflverse schedules.</p></footer>

const modeBtns = document.querySelectorAll("[data-mode]");

const teamBox = document.getElementById("teamControls");

const marketEl = document.getElementById("market");
const lineEl = document.getElementById("line");
const minGamesEl = document.getElementById("minGames");
const minHitsEl = document.getElementById("minHits");
const qEl = document.getElementById("q");
const tMarketEl = document.getElementById("tMarket");
const tSplitEl = document.getElementById("tSplit");
const tMinGamesEl = document.getElementById("tMinGames");
const tMinHitsEl = document.getElementById("tMinHits");
const tQEl = document.getElementById("tQ");
const listEl = document.getElementById("list");
const summaryEl = document.getElementById("summary");

let MODE = "players";

const MARKETS_BY_POS = {
  WR: ["Receiving Yards", "Receptions", "Receiving TDs"],
  TE: ["Receiving Yards", "Receptions", "Receiving TDs"],
  RB: ["Rushing Yards", "Rushing TDs", "Receiving Yards", "Receptions", "Receiving TDs"],
  QB: ["Passing Yards", "Passing TDs", "Interceptions", "QB Rushing TDs"],
  ALL: ["Receiving Yards", "Receptions", "Receiving TDs", "Rushing Yards", "Rushing TDs", "Passing Yards", "Passing TDs", "Interceptions", "QB Rushing TDs"]
};
const DEFAULT_LINE = {
  "Receiving Yards": "20+", "Rushing Yards": "20+", "Passing Yards": "150+",
  "Receptions": "2+", "Receiving TDs": "1+", "Rushing TDs": "1+",
  "Passing TDs": "1+", "QB Rushing TDs": "1+", "Interceptions": "0 (clean)"
};
const DEFAULT_HITS = {
  "Receiving Yards": 10, "Rushing Yards": 10, "Passing Yards": 10, "Receptions": 10,
  "Receiving TDs": 5, "Rushing TDs": 5, "Passing TDs": 8, "QB Rushing TDs": 3, "Interceptions": 8
};

function fillSelect(el, items, preferred) {
  el.innerHTML = "";
  items.forEach((v) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v; el.appendChild(o);
  });
  if (preferred && items.includes(preferred)) el.value = preferred;
  else if (items.length) el.value = items[0];
}
function fillMarkets(pos, preferred) {
  fillSelect(marketEl, MARKETS_BY_POS[pos] || MARKETS_BY_POS.ALL, preferred);
}
function fillLines(market, preferred) {
  fillSelect(lineEl, (window.LINES_BY_MARKET && window.LINES_BY_MARKET[market]) || [], preferred || DEFAULT_LINE[market]);
}

fillSelect(posEl, ["WR", "TE", "RB", "QB", "ALL"], "WR");
fillMarkets("WR", "Receiving Yards");
fillLines("Receiving Yards", "20+");
fillSelect(tMarketEl, ["Spread cover", "Moneyline", "Over", "Under"], "Spread cover");
fillSelect(tSplitEl, ["All", "Home", "Away"], "All");

modeBtns.forEach((btn) => {
  btn.addEventListener("click", () => {
    MODE = btn.dataset.mode;
    modeBtns.forEach((b) => b.classList.toggle("on", b === btn));
    playerBox.hidden = MODE !== "players";
    teamBox.hidden = MODE !== "teams";
    render();
  });
});

posEl.addEventListener("change", () => {
  const first = (MARKETS_BY_POS[posEl.value] || MARKETS_BY_POS.ALL)[0];
  fillMarkets(posEl.value, first);
  fillLines(first, DEFAULT_LINE[first]);
  minHitsEl.value = DEFAULT_HITS[first] || 8;
  render();
});
marketEl.addEventListener("change", () => {
  fillLines(marketEl.value, DEFAULT_LINE[marketEl.value]);
  minHitsEl.value = DEFAULT_HITS[marketEl.value] || 8;
  render();
});

function teamRecord(t) {
  const m = tMarketEl.value;
  const s = tSplitEl.value;
  if (m === "Spread cover") {
    if (s === "Home") return [t.atsH, t.atsHg];
    if (s === "Away") return [t.atsA, t.atsAg];
    return [t.ats, t.atsg];
  }
  if (m === "Moneyline") {
    if (s === "Home") return [t.mlH, t.mlHg];
    if (s === "Away") return [t.mlA, t.mlAg];
    return [t.ml, t.mlg];
  }
  if (m === "Over") return [t.ov, t.ovg];
  return [t.un, t.ung];
}

function render() {
  if (MODE === "teams") return renderTeams();
  renderPlayers();
}

function renderPlayers() {
  if (!window.VOLUME || !window.VOLUME.length) {
    summaryEl.innerHTML = "<strong>Player data did not load.</strong>";
    listEl.innerHTML = "";
    return;
  }
  const pos = posEl.value, market = marketEl.value, line = lineEl.value;
  const minGames = Number(minGamesEl.value || 0), minHits = Number(minHitsEl.value || 0);
  const q = (qEl.value || "").trim().toLowerCase();
  const universe = window.VOLUME.filter((r) => (pos === "ALL" || r.pos === pos) && r.market === market && r.threshold === line);
  const rows = universe.filter((r) => r.games >= minGames && r.hits >= minHits && (!q || r.player.toLowerCase().includes(q)))
    .sort((a, b) => b.hits - a.hits || b.games - a.games || a.player.localeCompare(b.player));
  summaryEl.innerHTML = `<strong>${rows.length}</strong> of ${universe.length} · ${pos} · ${market} · ${line}`;
  if (!rows.length) { listEl.innerHTML = `<div class="empty">Nobody cleared that cut. Lower Min hits.</div>`; return; }
  listEl.innerHTML = rows.map((r) => {
    const cls = r.hits / r.games >= 0.85 ? "" : "mid";
    return `<article class="card" data-kind="player" data-id="${r.player.replace(/"/g,"")}">
      <div><h3>${r.player}</h3><p class="meta">${r.pos} · ${r.team} · ${market} ${r.threshold}</p></div>
      <div><div class="record ${cls}">${r.hits}/${r.games}</div><div class="pass">${r.games} gms</div></div>
    </article>`;
  }).join("");
  bindCards();
}

function recOf(code) {
  return (window.TEAMS || []).find((x) => x.team === code) || {};
}
function fmtSprHome(hSpr) {
  if (hSpr == null) return "—";
  return hSpr > 0 ? "-" + hSpr : "+" + Math.abs(hSpr);
}
function fmtSprAway(hSpr) {
  if (hSpr == null) return "—";
  return hSpr > 0 ? "+" + hSpr : "-" + Math.abs(hSpr);
}
function renderSlate() {
  const slate = window.SLATE || [];
  if (!slate.length) return "";
  return `<div class="slate">
    <p class="sec">This week · 2026 Week 2</p>
    ${slate.map((g) => {
      const a = recOf(g.away), h = recOf(g.home);
      const when = (g.wd || "") + " " + (g.time || "");
      return `<article class="game">
        <div class="when">${when}</div>
        <div class="match">${g.away} @ ${g.home}</div>
        <div class="lines">${g.home} ${fmtSprHome(g.hSpr)} · ${g.away} ${fmtSprAway(g.hSpr)} · O/U ${g.total}</div>
        <div class="recs">
          <span>${g.away} ATS ${a.ats||0}/${a.atsg||0} · ML ${a.ml||0}/${a.mlg||0} · O ${a.ov||0}/${a.ovg||0}</span>
          <span>${g.home} ATS ${h.ats||0}/${h.atsg||0} · ML ${h.ml||0}/${h.mlg||0} · O ${h.ov||0}/${h.ovg||0}</span>
        </div>
      </article>`;
    }).join("")}
  </div>`;
}

  const cards = rows.map((t) => {
    const cls = t.hits / t.games >= 0.6 ? "" : "mid";
    return `<article class="card" data-kind="team" data-id="${t.team}">
      <div><h3>${t.team}</h3><p class="meta">${m} · ${s}</p></div>
      <div><div class="record ${cls}">${t.hits}/${t.games}</div><div class="pass">tap log</div></div>
    </article>`;
  }).join("");
  listEl.innerHTML = slate + cards;
  bindCards();
}

function bindCards() {
  listEl.querySelectorAll(".card").forEach((el) => {
    el.addEventListener("click", () => {
      if (el.dataset.kind === "team") openTeam(el.dataset.id);
      else openPlayer(el.dataset.id);
    });
  });
}


function tile(label, hits, games) {
  const cls = games && hits / games >= 0.6 ? "good" : "soft";
  return `<div class="tile ${cls}"><span>${label}</span><b>${hits}/${games}</b></div>`;
}
function chip(kind, text) {
  return `<span class="chip ${kind}">${text}</span>`;
}

function openPlayer(name) {
  const p = window.PLAYER[name];
  if (!p) return;
  const g = p.games;
  const isQB = p.pos === "QB";
  const isRB = p.pos === "RB";
  let blocks = "";
  if (isQB || p.keep_pass) {
    blocks += `<p class="sec">Passing</p><div class="tiles">
      ${tile("150+ yds", p.pass_hits[0], g)}
      ${tile("200+ yds", p.pass_hits[1], g)}
      ${tile("250+ yds", p.pass_hits[2], g)}
      ${tile("300+ yds", p.pass_hits[3], g)}
      ${tile("1+ TD", p.pass_td1, g)}
      ${tile("2+ TD", p.pass_td2, g)}
      ${tile("0 INT", p.clean, p.qb_games || g)}
    </div>`;
  }
  if (isRB || (p.keep_rush && !isQB)) {
    blocks += `<p class="sec">Rushing</p><div class="tiles">
      ${tile("20+ yds", p.rush_hits[0], g)}
      ${tile("40+ yds", p.rush_hits[1], g)}
      ${tile("60+ yds", p.rush_hits[2], g)}
      ${tile("80+ yds", p.rush_hits[3], g)}
      ${tile("100+ yds", p.rush_hits[4], g)}
      ${tile("Rush TD", p.rush_td1, g)}
    </div>`;
  }
  if (p.keep_rec && !isQB) {
    blocks += `<p class="sec">Receiving</p><div class="tiles">
      ${tile("20+ yds", p.rec_hits[0], g)}
      ${tile("40+ yds", p.rec_hits[1], g)}
      ${tile("60+ yds", p.rec_hits[2], g)}
      ${tile("80+ yds", p.rec_hits[3], g)}
      ${tile("100+ yds", p.rec_hits[4], g)}
      ${tile("2+ catches", p.catch[0], g)}
      ${tile("4+ catches", p.catch[2], g)}
      ${tile("6+ catches", p.catch[4], g)}
      ${tile("Rec TD", p.rec_td1, g)}
    </div>`;
  }
  if (isQB) {
    blocks += `<p class="sec">Rushing</p><div class="tiles">${tile("Rush TD", p.rush_td1, g)}</div>`;
  }
  const log = (p.log || []).slice().reverse();
  const head = isQB
    ? `<tr><th>Week</th><th>Opp</th><th>Pass</th><th>TD</th><th>INT</th><th>Rush</th></tr>`
    : isRB
    ? `<tr><th>Week</th><th>Opp</th><th>Rush</th><th>TD</th><th>Rec</th><th>Yds</th></tr>`
    : `<tr><th>Week</th><th>Opp</th><th>Rec</th><th>Yds</th><th>TD</th></tr>`;
  const logRows = log.map((x) => {
    const wk = `W${x.w} '${String(x.s).slice(2)}`;
    const opp = `${x.tm} vs ${x.opp}`;
    if (isQB) return `<tr><td>${wk}</td><td>${opp}</td><td>${x.py}</td><td>${x.ptd}</td><td>${x.int}</td><td>${x.ru}</td></tr>`;
    if (isRB) return `<tr><td>${wk}</td><td>${opp}</td><td>${x.ru}</td><td>${x.rutd}</td><td>${x.rec}</td><td>${x.ry}</td></tr>`;
    const td = x.rtd ? chip("win", x.rtd + " TD") : "";
    return `<tr><td>${wk}</td><td>${opp}</td><td>${x.rec}</td><td>${x.ry}</td><td>${td || "—"}</td></tr>`;
  }).join("");
  showSheet(`
    <div class="sheet-head">
      <h2>${p.player}</h2>
      <p class="meta">${p.pos} · ${p.team} · last ${g} games</p>
    </div>
    ${blocks}
    <p class="sec">Last 10 games</p>
    <div class="tblwrap"><table class="log"><thead>${head}</thead><tbody>${logRows}</tbody></table></div>
    <button class="close" type="button" id="sheetClose">Close</button>`);
}

function openTeam(code) {
  const t = (window.TEAMS || []).find((x) => x.team === code);
  if (!t) return;
  const log = (t.log || []).slice().reverse();
  const rows = log.map((x) => {
    const spr = x.spread == null ? "—" : (x.spread > 0 ? "+" + x.spread : String(x.spread));
    const ats = x.cover === 1 ? chip("win","Cover") : x.cover === 0 ? chip("loss","No cover") : chip("push","Push");
    const ml = x.ml === 1 ? chip("win","Win") : x.ml === 0 ? chip("loss","Loss") : chip("push","Tie");
    const ou = x.ou === 1 ? chip("win","Over") : x.ou === 0 ? chip("loss","Under") : chip("push","Push");
    const loc = x.ha === "H" ? "vs" : "@";
    return `<tr>
      <td>${String(x.s).slice(2)} W${x.w}</td>
      <td>${loc} ${x.opp}</td>
      <td>${x.us}–${x.them}</td>
      <td>${spr}</td>
      <td>${ats}</td>
      <td>${ml}</td>
      <td>${ou}<div class="tiny">${x.total} pts · line ${x.tline}</div></td>
    </tr>`;
  }).join("");
  showSheet(`
    <div class="sheet-head">
      <h2>${t.team}</h2>
      <p class="meta">Last ${t.games} games · closing lines</p>
    </div>
    <div class="tiles">
      ${tile("Spread", t.ats, t.atsg)}
      ${tile("Home ATS", t.atsH, t.atsHg)}
      ${tile("Away ATS", t.atsA, t.atsAg)}
      ${tile("Moneyline", t.ml, t.mlg)}
      ${tile("Home ML", t.mlH, t.mlHg)}
      ${tile("Away ML", t.mlA, t.mlAg)}
      ${tile("Over", t.ov, t.ovg)}
      ${tile("Under", t.un, t.ung)}
    </div>
    <p class="sec">Last 10 games</p>
    <div class="tblwrap"><table class="log">
      <thead><tr><th>Week</th><th>Opp</th><th>Score</th><th>Line</th><th>Spread</th><th>ML</th><th>Total</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <p class="hint">Line = this team’s spread. Total = actual points vs the over/under number.</p>
    <button class="close" type="button" id="sheetClose">Close</button>`);
}

function showSheet(html) {
  document.getElementById("sheetBody").innerHTML = html;
  const sheet = document.getElementById("sheet");
  sheet.classList.add("open");
  document.getElementById("sheetClose").onclick = () => sheet.classList.remove("open");
  sheet.onclick = (e) => { if (e.target === sheet) sheet.classList.remove("open"); };
}

[lineEl, minGamesEl, minHitsEl, qEl, tMarketEl, tSplitEl, tMinGamesEl, tMinHitsEl, tQEl].forEach((el) => {
  if (!el) return;
  el.addEventListener("change", render);
  el.addEventListener("input", render);
});
render();

</script>
</body></html>
