<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#05060a"/>
<title>Sports Sauce</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;700;800&display=swap");
:root{--bg:#05060a;--orange:#ff7a18;--ember:#ffc46b;--live:#ff3b3b;--text:#f7f2ea;--muted:#9b9288;--pad:clamp(12px,3vw,20px)}
*{box-sizing:border-box}html,body{margin:0;background:#05060a;color:var(--text);font-family:Manrope,system-ui,sans-serif}
body{min-height:100dvh;width:min(1120px,100%);margin:0 auto}
.top{padding:var(--pad);background:linear-gradient(90deg,#2a1408,#05060a 55%);border-bottom:2px solid var(--orange)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.mark{width:36px;height:36px;border-radius:8px;background:var(--orange);color:#120800;font-family:"Bebas Neue",sans-serif;font-size:22px;display:grid;place-items:center}
h1{margin:0;font-family:"Bebas Neue",sans-serif;letter-spacing:.04em}
.eyebrow{margin:0;color:var(--ember);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
.hero{padding:22px var(--pad) 8px;position:relative}
.hero h2{font-family:"Bebas Neue",sans-serif;font-size:clamp(32px,8vw,56px);line-height:.95;margin:8px 0 10px;letter-spacing:.01em}
.kicker{letter-spacing:.2em;text-transform:uppercase;font-size:10px;color:var(--orange);font-weight:800}
.lede{color:var(--muted);margin:0}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px var(--pad) 32px}
.hubcard{text-align:left;padding:18px;border-radius:16px;border:1px solid rgba(255,122,24,.3);background:#120e0c;color:#fff}
.hubcard img{width:40px;height:40px;object-fit:contain;margin-bottom:8px}
.hubcard b{display:block;font-family:"Bebas Neue",sans-serif;font-size:28px}
.hubcard span{color:#c9c2b8;font-size:12px}
.bar{display:flex;align-items:center;gap:10px;padding:10px var(--pad)}
.back{border:0;background:0;color:var(--orange);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.meta{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.list{display:grid;gap:10px;padding:0 var(--pad) 24px}
.gcard{display:block;width:100%;text-align:left;color:inherit;font:inherit;background:#101218;border:1px solid #2a241c;border-radius:8px;padding:12px}
.gstat{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.gduo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.gteam{display:flex;align-items:center;gap:8px;font-family:"Bebas Neue",sans-serif;font-size:20px}
.gteam.right{justify-content:flex-end}
.logoplate{width:36px;height:36px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.logoplate img{width:28px;height:28px;object-fit:contain}
.vs{color:var(--muted);font-size:11px;font-weight:800}
.linechip{margin-top:8px;color:var(--ember);font-size:13px}
.hint{color:var(--muted);padding:0 var(--pad)}
.scorebug{margin:0 var(--pad) 16px;padding:12px;background:#101218;border:1px solid #3a2a18}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="goHome">
    <div class="mark">S</div>
    <div>
      <p class="eyebrow">Sports Sauce</p>
      <h1>THE BOARD</h1>
    </div>
  </div>
</header>

<section id="viewHome">
  <div class="hero">
    <p class="kicker">Sports Sauce</p>
    <h2>One board.<br>Live scores. Real stats. Actual research.</h2>
    <p class="lede">NFL, college, baseball, the card — without leaving the page.</p>
  </div>
  <div class="hub">
    <button class="hubcard" data-lg="nfl"><img alt="" src="https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png"/><b>NFL</b><span>Sunday slate</span></button>
    <button class="hubcard" data-lg="cfb"><img alt="" src="https://a.espncdn.com/redesign/assets/img/icons/ESPN-icon-football.png"/><b>College</b><span>Saturday slate</span></button>
    <button class="hubcard" data-lg="mlb"><img alt="" src="https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png"/><b>MLB</b><span>Tonight</span></button>
    <button class="hubcard" data-lg="ufc"><img alt="" src="https://a.espncdn.com/i/teamlogos/leagues/500/ufc.png"/><b>UFC</b><span>The card</span></button>
  </div>
</section>

<section id="viewLive" hidden>
  <div class="bar">
    <button class="back" id="toHome">← Home</button>
    <span class="meta" id="liveMeta">…</span>
  </div>
  <div id="liveList" class="list"></div>
</section>

<section id="viewGame" hidden>
  <div class="bar"><button class="back" id="toSlate">← Slate</button></div>
  <div id="gameRoom"></div>
</section>

<script>
const URLS = {
  nfl: "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",
  cfb: "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=80",
  mlb: "https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard",
  ufc: "https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard"
};
const SUM = {
  nfl: id => "https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/summary?event="+id,
  cfb: id => "https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/summary?event="+id,
  mlb: id => "https://site.web.api.espn.com/apis/site/v2/sports/baseball/mlb/summary?event="+id,
  ufc: id => "https://site.web.api.espn.com/apis/site/v2/sports/mma/ufc/summary?event="+id
};
let LEAGUE = "nfl";
let GAMES = [];
const $ = id => document.getElementById(id);
function show(name){
  ["viewHome","viewLive","viewGame"].forEach(id => { $(id).hidden = id !== "view"+name[0].toUpperCase()+name.slice(1); });
  if(name==="home") $("viewHome").hidden=false, $("viewLive").hidden=true, $("viewGame").hidden=true;
  if(name==="live") $("viewHome").hidden=true, $("viewLive").hidden=false, $("viewGame").hidden=true;
  if(name==="game") $("viewHome").hidden=true, $("viewLive").hidden=true, $("viewGame").hidden=false;
  window.scrollTo(0,0);
}
function face(comp, lg){
  if(lg==="ufc" && comp && comp.id)
    return "https://a.espncdn.com/i/headshots/mma/players/full/"+comp.id+".png";
  const t = (comp && comp.team) || {};
  if(t.logo) return t.logo;
  if(t.logos && t.logos[0] && t.logos[0].href) return t.logos[0].href;
  const ab = (t.abbreviation||"").toLowerCase();
  if(lg==="mlb") return "https://a.espncdn.com/i/teamlogos/mlb/500/"+ab+".png";
  if(lg==="cfb" && t.id) return "https://a.espncdn.com/i/teamlogos/ncaa/500/"+t.id+".png";
  return "https://a.espncdn.com/i/teamlogos/nfl/500/"+ab+".png";
}
function nameOf(comp){
  if(!comp) return "";
  if(comp.athlete) return comp.athlete.displayName || comp.athlete.shortName || "";
  const t=comp.team||{};
  return t.abbreviation || t.shortDisplayName || t.displayName || "";
}
function scoreOf(comp){
  if(!comp || comp.score==null) return "";
  return String(comp.score.displayValue != null ? comp.score.displayValue : comp.score);
}
function mapComp(ev, lg){
  const rows = [];
  const fights = ev.competitions || [{}];
  const list = (lg==="ufc") ? fights : fights.slice(0,1);
  list.forEach((c,i)=>{
    const comps = c.competitors || [];
    let home = comps.find(x=>x.homeAway==="home");
    let away = comps.find(x=>x.homeAway==="away");
    if(!home && !away && comps.length>=2){ away=comps[0]; home=comps[1]; }
    home=home||{}; away=away||{};
    const st=((c.status||{}).type)||{};
    rows.push({
      id: String(c.id || ev.id || "") + (lg==="ufc" && i ? "-"+i : ""),
      eventId: String(ev.id||c.id||""),
      away: nameOf(away), home: nameOf(home),
      awayImg: face(away,lg), homeImg: face(home,lg),
      awayScore: scoreOf(away), homeScore: scoreOf(home),
      state: st.state || (st.completed?"post":"pre"),
      detail: st.detail || st.shortDetail || "",
      start: ev.date || c.date || "",
      broadcast: ((c.broadcasts||[])[0] && ((c.broadcasts||[])[0].names||[])[0]) || ""
    });
  });
  return rows;
}
function when(g){
  if(g.state==="in") return "LIVE · " + (g.detail||"");
  if(g.state==="post") return g.detail || "Final";
  try{
    return new Date(g.start).toLocaleString("en-US",{timeZone:"America/Chicago",weekday:"short",hour:"numeric",minute:"2-digit"});
  }catch(e){ return g.detail||""; }
}
function paint(games){
  const host=$("liveList");
  $("liveMeta").textContent = LEAGUE.toUpperCase()+" · "+games.length;
  if(!games.length){ host.innerHTML="<p class='hint'>Nothing on the ESPN board for "+LEAGUE.toUpperCase()+" right now.</p>"; return; }
  host.innerHTML = games.map(g=>`
    <button type="button" class="gcard" data-gid="${g.eventId}">
      <div class="gstat"><span>${when(g)}</span><span>${g.broadcast||""}</span></div>
      <div class="gduo">
        <div class="gteam"><span class="logoplate"><img alt="" src="${g.awayImg}"/></span>${g.away}</div>
        <span class="vs">VS</span>
        <div class="gteam right">${g.home}<span class="logoplate"><img alt="" src="${g.homeImg}"/></span></div>
      </div>
      ${g.awayScore||g.homeScore?`<div class="linechip">${g.awayScore} — ${g.homeScore}</div>`:""}
    </button>`).join("");
  host.querySelectorAll("[data-gid]").forEach(b=>b.onclick=()=>openGame(b.dataset.gid));
}
async function loadLeague(lg){
  LEAGUE=lg;
  show("live");
  $("liveMeta").textContent = "Loading "+lg.toUpperCase();
  $("liveList").innerHTML = "<p class='hint'>Talking to ESPN…</p>";
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 8000);
  try{
    const res = await fetch(URLS[lg], {cache:"no-store", signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) throw new Error("ESPN "+res.status);
    const data = await res.json();
    const evs = data.events || [];
    GAMES = evs.flatMap(ev=>mapComp(ev,lg));
    paint(GAMES);
  }catch(err){
    clearTimeout(t);
    $("liveList").innerHTML = "<p class='hint'>"+lg.toUpperCase()+" did not load. "+(err.message||err)+"</p>";
    $("liveMeta").textContent = lg.toUpperCase()+" failed";
  }
}
async function openGame(id){
  show("game");
  $("gameRoom").innerHTML = "<p class='hint'>Opening game…</p>";
  const g = GAMES.find(x=>x.eventId===id) || {};
  try{
    const res = await fetch(SUM[LEAGUE](id), {cache:"no-store"});
    const sum = res.ok ? await res.json() : {};
    const hdr = ((sum.header||{}).competitions||[])[0]||{};
    const st = ((hdr.status||{}).type||{}).detail || g.detail || "";
    $("gameRoom").innerHTML = `
      <div class="scorebug">
        <div class="gstat"><span>${st}</span></div>
        <div class="gduo">
          <div class="gteam">${g.away} <b>${g.awayScore||""}</b></div>
          <span class="vs">VS</span>
          <div class="gteam right"><b>${g.homeScore||""}</b> ${g.home}</div>
        </div>
      </div>
      <p class="hint">Box and research come back on NFL once this board is stable.</p>`;
  }catch(e){
    $("gameRoom").innerHTML = "<p class='hint'>Could not open game.</p>";
  }
}
$("goHome").onclick = ()=>show("home");
$("toHome").onclick = ()=>show("home");
$("toSlate").onclick = ()=>show("live");
document.querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>loadLeague(b.dataset.lg));
show("home");
</script>
</body>
</html>
