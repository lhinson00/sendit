<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#05060a"/>
<title>Sports Sauce</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;700;800&display=swap");
:root{--bg:#05060a;--orange:#ff7a18;--ember:#ffc46b;--live:#ff3b3b;--text:#f7f2ea;--muted:#9b9288;--pad:clamp(12px,3vw,20px)}
*{box-sizing:border-box}html,body{margin:0;background:#05060a;color:var(--text);font-family:Manrope,system-ui,sans-serif}
body{min-height:100dvh;width:min(1120px,100%);margin:0 auto}
.top{padding:var(--pad);background:linear-gradient(90deg,#2a1408,#05060a 55%);border-bottom:2px solid var(--orange)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.mark{width:36px;height:36px;border-radius:8px;background:var(--orange);color:#120800;font-family:"Bebas Neue",sans-serif;font-size:22px;display:grid;place-items:center}
h1{margin:0;font-family:"Bebas Neue",sans-serif;letter-spacing:.04em}
.eyebrow{margin:0;color:var(--ember);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
.hero{padding:22px var(--pad) 8px;position:relative}
.hero h2{font-family:"Bebas Neue",sans-serif;font-size:clamp(32px,8vw,56px);line-height:.95;margin:8px 0 10px;letter-spacing:.01em}
.kicker{letter-spacing:.2em;text-transform:uppercase;font-size:10px;color:var(--orange);font-weight:800}
.lede{color:var(--muted);margin:0}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px var(--pad) 32px}
.hubcard{text-align:left;padding:18px;border-radius:16px;border:1px solid rgba(255,122,24,.3);background:#120e0c;color:#fff}
.hubcard img{width:40px;height:40px;object-fit:contain;margin-bottom:8px}
.hubcard b{display:block;font-family:"Bebas Neue",sans-serif;font-size:28px}
.hubcard span{color:#c9c2b8;font-size:12px}
.bar{display:flex;align-items:center;gap:10px;padding:10px var(--pad)}
.back{border:0;background:0;color:var(--orange);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.meta{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.list{display:grid;gap:10px;padding:0 var(--pad) 24px}
.gcard{display:block;width:100%;text-align:left;color:inherit;font:inherit;background:#101218;border:1px solid #2a241c;border-radius:8px;padding:12px}
.gstat{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.gduo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.gteam{display:flex;align-items:center;gap:8px;font-family:"Bebas Neue",sans-serif;font-size:20px}
.gteam.right{justify-content:flex-end}
.logoplate{width:36px;height:36px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.logoplate img{width:28px;height:28px;object-fit:contain}
.vs{color:var(--muted);font-size:11px;font-weight:800}
.linechip{margin-top:8px;color:var(--ember);font-size:13px}
.hint{color:var(--muted);padding:0 var(--pad)}
.scorebug{margin:0 var(--pad) 16px;padding:12px;background:#101218;border:1px solid #3a2a18}
.mlb-bug{background:linear-gradient(180deg,#1a140c,#0c0d12);border-color:#ff7a18;padding:16px}
.mlb-inning{font-family:"Bebas Neue",sans-serif;font-size:22px;color:var(--orange);letter-spacing:.04em}
.mlb-score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:10px}
.mlb-side{display:flex;flex-direction:column;gap:2px}
.mlb-side.r{text-align:right}
.mlb-side em{font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mlb-side b{font-family:"Bebas Neue",sans-serif;font-size:42px;line-height:1;color:#fff}
.bases{display:flex;gap:8px;justify-content:center;margin-top:12px}
.bag{width:14px;height:14px;transform:rotate(45deg);background:#2a241c;border:1px solid #3a2a18}
.bag.on{background:var(--orange);border-color:var(--ember)}
.outs{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
tr.prow{cursor:pointer}tr.prow:hover td{background:#1a140c}
.rhe{margin-top:12px}
.ab{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:#efe6d8}
.wpbar{position:relative;height:7px;margin:14px 0 18px;background:#222;border-radius:99px}
.wpbar i{display:block;height:100%;background:var(--orange);margin-left:auto}
.wpbar em{position:absolute;top:10px;font-size:10px;color:var(--muted);font-style:normal;letter-spacing:.08em;text-transform:uppercase}
.wpbar em:first-of-type{left:0}.wpbar em:last-of-type{right:0}
.play.hot{border-color:var(--orange)}
.box{margin:0 var(--pad) 16px;background:#101218;border:1px solid #2a241c;overflow:auto}
.box h3{margin:0;padding:10px 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
table.bx{width:100%;border-collapse:collapse;font-size:12px}
table.bx th,table.bx td{padding:7px 8px;border-top:1px solid #1c1c22;text-align:left}
table.bx th{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.play{margin:0 var(--pad) 8px;padding:10px 12px;background:#101218;border:1px solid #222}
.play span{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.play p{margin:4px 0 0;font-size:14px}
.pname{border:0;background:0;color:var(--ember);font:inherit;font-weight:800;padding:0;text-align:left}
.scorebug .gteam b{font-size:28px;color:var(--orange)}
.hist{margin:0 var(--pad) 16px}
.chipwin{color:#3ee0a0}.chiploss{color:#ff8a8a}
.phero{margin:0 var(--pad) 16px;border:1px solid #3a2a18;border-radius:4px;overflow:hidden;background:#0c0d10}
.phero-top{display:grid;grid-template-columns:120px 1fr;min-height:150px;background:linear-gradient(120deg,#2a1408 0%,#0a0b10 55%)}
.phero-top img{width:120px;height:150px;object-fit:cover;object-position:top;background:#16120e}
.phero-copy{padding:16px 14px 12px}
.phero-copy .kicker{margin:0 0 6px}
.phero-copy h2{font-family:"Bebas Neue",sans-serif;font-size:clamp(28px,7vw,44px);line-height:.9;margin:0 0 8px}
.phero-copy p{margin:0;color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
@media(max-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:#14110e;border:1px solid #2a241c;padding:10px 8px}
.tile em{display:block;font-style:normal;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tile b{display:block;font-family:"Bebas Neue",sans-serif;font-size:26px;line-height:1;margin-top:4px;color:#fff}
.career{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 14px}
.career span{font-size:11px;color:#c9c2b8;background:#14110e;border:1px solid #2a241c;padding:6px 8px}
.career span b{color:var(--ember);font-family:"Bebas Neue",sans-serif;font-size:16px;margin-left:4px}
.glog{display:grid;gap:8px;padding:0 var(--pad) 24px}
.glog h3{margin:0 0 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.grow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#101218;border:1px solid #2a241c;padding:10px 12px}
.grow .dec{font-family:"Bebas Neue",sans-serif;font-size:22px;width:28px}
.grow .dec.W{color:#3ee0a0}.grow .dec.L{color:#ff8a8a}
.grow .opp{font-weight:800}
.grow .opp span{display:block;color:var(--muted);font-size:11px;font-weight:500}
.grow .line{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:#efe6d8}
.lead3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 12px}
.lead{background:#1a120c;border:1px solid #3a2a18;padding:12px 10px;text-align:center}
.lead em{display:block;font-style:normal;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lead b{display:block;font-family:"Bebas Neue",sans-serif;font-size:36px;line-height:.95;color:var(--orange)}
.wireblurb{margin:0 12px 12px;padding:12px;background:#14110e;border-left:3px solid var(--orange);font-size:13px;line-height:1.45;color:#ddd4c8}
.nextchip{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ember)}
.lr{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 14px}
.fbtiles{padding:12px 0 0}
.leadrow{padding:10px 12px;border-top:1px solid #1c1c22}
.leadrow em{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.leadrow b{display:block;font-size:15px}
.leadrow span{color:var(--ember);font-size:13px}
.ftabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 var(--pad) 12px}
.ftabs button{border:1px solid #2a241c;background:#101218;color:var(--muted);padding:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:11px}
.ftabs button.on{background:var(--orange);color:#140800;border-color:var(--orange)}
.drivechip{margin-top:12px;padding:10px 12px;background:#14110e;border:1px solid #3a2a18;font-size:13px}
.drivechip b{color:var(--orange)}
.qtr{width:100%;margin-top:12px;border-collapse:collapse;font-size:12px}
.qtr th,.qtr td{padding:6px 4px;text-align:center;border-top:1px solid #2a241c}
.qtr th{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.qtr td:first-child,.qtr th:first-child{text-align:left}
.cmp{width:100%;margin-top:4px;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:8px 6px;text-align:center;border-top:1px solid #2a241c}
.cmp th{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.cmp td:first-child{text-align:left;font-weight:800}
.ufc-card .gduo{grid-template-columns:1fr auto 1fr;padding:8px 0}
.uface{width:86px;height:86px;border-radius:50%;object-fit:cover;border:3px solid #3a2a18;background:#1a120c;display:block}
.ufc-card .gteam{flex-direction:column;text-align:center;font-size:16px;gap:6px}
.ufc-card .gteam.right{align-items:flex-end}
.ufc-card .gteam span.rec{font-family:Manrope,sans-serif;font-size:11px;color:var(--muted);letter-spacing:.06em}
.titlechip{display:inline-block;margin-left:6px;padding:1px 6px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:#3a2a10;color:var(--ember);font-weight:800}
.rankwrap{padding:8px var(--pad) 28px}
.rankgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.rankgrid{grid-template-columns:1fr}}
.rankdiv{margin-bottom:4px;background:#101218;border:1px solid #2a241c;padding:10px}
.rankdiv h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.rrow{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #1c1c22;cursor:pointer}
.rrow img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#1a120c}
.rrow b{display:block}
.rrow em{font-style:normal;color:var(--muted);font-size:11px}
.rk{font-family:"Bebas Neue",sans-serif;font-size:22px;color:var(--orange)}
.fface{width:180px;height:180px;object-fit:cover;object-position:center 15%;display:block;background:#120e0c;border-radius:8px;margin:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="goHome">
    <div class="mark">S</div>
    <div>
      <p class="eyebrow">Sports Sauce</p>
      <h1>THE BOARD</h1>
    </div>
  </div>
</header>

<section id="viewHome">
  <div class="hero">
    <p class="kicker">Sports Sauce</p>
    <h2>One board.<br>Live scores. Real stats. Actual research.</h2>
    <p class="lede">NFL, college, baseball, the card — without leaving the page.</p>
  </div>
  <div class="hub">
    <button class="hubcard" data-lg="nfl"><img alt="" src="https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png"/><b>NFL</b><span>Sunday slate</span></button>
    <button class="hubcard" data-lg="cfb"><img alt="" src="https://a.espncdn.com/redesign/assets/img/icons/ESPN-icon-football.png"/><b>College</b><span>Saturday slate</span></button>
    <button class="hubcard" data-lg="mlb"><img alt="" src="https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png"/><b>MLB</b><span>Tonight</span></button>
    <button class="hubcard" data-lg="ufc"><img alt="" src="https://a.espncdn.com/i/teamlogos/leagues/500/ufc.png"/><b>UFC</b><span>The card</span></button>
  </div>
</section>

<section id="viewLive" hidden>
  <div class="bar">
    <button class="back" id="toHome">← Home</button>
    <span class="meta" id="liveMeta">…</span>
  </div>
  <div id="liveList" class="list"></div>
</section>

<section id="viewGame" hidden>
  <div class="bar"><button class="back" id="toSlate">← Slate</button></div>
  <div id="gameRoom"></div>
</section>
<section id="viewPlayer" hidden>
  <div class="bar"><button class="back" id="toGame">← Game</button></div>
  <div id="playerRoom"></div>
</section>

<script>
const URLS = {
  nfl: "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",
  cfb: "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=80",
  mlb: "https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard",
  ufc: "https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard"
};
const SUM = {
  nfl: id => "https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/summary?event="+id,
  cfb: id => "https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/summary?event="+id,
  mlb: id => "https://site.web.api.espn.com/apis/site/v2/sports/baseball/mlb/summary?event="+id,
  ufc: id => "https://site.web.api.espn.com/apis/site/v2/sports/mma/ufc/summary?event="+id
};
let LEAGUE = "nfl";
let GAMES = [];
let OPEN = null;
let poll = null;
const $ = id => document.getElementById(id);
function show(name){
  ["viewHome","viewLive","viewGame"].forEach(id => { $(id).hidden = id !== "view"+name[0].toUpperCase()+name.slice(1); });
  $("viewHome").hidden = name!=="home";
  $("viewLive").hidden = name!=="live";
  $("viewGame").hidden = name!=="game";
  if($("viewPlayer")) $("viewPlayer").hidden = name!=="player";
  window.scrollTo(0,0);
}
function face(comp, lg){
  if(lg==="ufc" && comp && comp.id)
    return "https://a.espncdn.com/i/headshots/mma/players/full/"+comp.id+".png";
  const t = (comp && comp.team) || {};
  if(t.logo) return t.logo;
  if(t.logos && t.logos[0] && t.logos[0].href) return t.logos[0].href;
  const ab = (t.abbreviation||"").toLowerCase();
  if(lg==="mlb") return "https://a.espncdn.com/i/teamlogos/mlb/500/"+ab+".png";
  if(lg==="cfb" && t.id) return "https://a.espncdn.com/i/teamlogos/ncaa/500/"+t.id+".png";
  return "https://a.espncdn.com/i/teamlogos/nfl/500/"+ab+".png";
}
function nameOf(comp){
  if(!comp) return "";
  if(comp.athlete) return comp.athlete.displayName || comp.athlete.shortName || "";
  const t=comp.team||{};
  return t.abbreviation || t.shortDisplayName || t.displayName || "";
}
function scoreOf(comp){
  if(!comp || comp.score==null) return "";
  return String(comp.score.displayValue != null ? comp.score.displayValue : comp.score);
}
function mapComp(ev, lg){
  const rows = [];
  const fights = ev.competitions || [{}];
  const list = (lg==="ufc") ? fights : fights.slice(0,1);
  list.forEach((c,i)=>{
    const comps = c.competitors || [];
    let home = comps.find(x=>x.homeAway==="home");
    let away = comps.find(x=>x.homeAway==="away");
    if(!home && !away && comps.length>=2){ away=comps[0]; home=comps[1]; }
    home=home||{}; away=away||{};
    const st=((c.status||{}).type)||{};
    const rec = x => ((x.records||[])[0]&&(x.records||[])[0].summary) || "";
    rows.push({
      id: String(c.id || ev.id || "") + (lg==="ufc" && i ? "-"+i : ""),
      eventId: String(ev.id||c.id||""),
      fightId: String(c.id||""),
      awayId: String(away.id||""), homeId: String(home.id||""),
      away: nameOf(away), home: nameOf(home),
      awayAb: (away.team && away.team.abbreviation) || nameOf(away),
      homeAb: (home.team && home.team.abbreviation) || nameOf(home),
      awayImg: face(away,lg), homeImg: face(home,lg),
      awayScore: scoreOf(away), homeScore: scoreOf(home),
      awayRec: rec(away), homeRec: rec(home),
      awayWin: !!away.winner, homeWin: !!home.winner,
      venue: (c.venue && (c.venue.fullName||c.venue.displayName)) || "",
      card: ev.shortName || ev.name || "",
      format: (c.format && c.format.regulation && c.format.regulation.displayName) || "",
      state: st.state || (st.completed?"post":"pre"),
      detail: st.detail || st.shortDetail || "",
      start: c.startDate || ev.date || c.date || "",
      broadcast: ((c.broadcasts||[])[0] && ((c.broadcasts||[])[0].names||[])[0]) || c.broadcast || ""
    });
  });
  return rows;
}
function when(g){
  if(g.state==="in") return "LIVE · " + (g.detail||"");
  if(g.state==="post") return g.detail || "Final";
  try{
    return new Date(g.start).toLocaleString("en-US",{timeZone:"America/Chicago",weekday:"short",hour:"numeric",minute:"2-digit"});
  }catch(e){ return g.detail||""; }
}
function paint(games){
  window.LIVE_GAMES = games;
  const host=$("liveList");
  $("liveMeta").textContent = LEAGUE.toUpperCase()+" · "+games.length;
  if(!games.length){ host.innerHTML="<p class='hint'>Nothing on the ESPN board for "+LEAGUE.toUpperCase()+" right now.</p>"; return; }
  if(LEAGUE==="ufc"){
    const events={};
    games.forEach(g=>{
      const k=g.card||"UFC";
      if(!events[k]) events[k]={card:k,start:g.start,venue:g.venue,fights:[]};
      events[k].fights.push(g);
    });
    const evHtml=Object.values(events).map(ev=>`
      <button type="button" class="gcard" data-event="${ev.card.replace(/"/g,"")}">
        <div class="gstat"><span>Upcoming card</span><span>${when(ev.fights[0]||{})}</span></div>
        <div class="mlb-inning">${ev.card}</div>
        <p class="hint" style="padding:8px 0 0">${ev.fights.length} fights${ev.venue?" · "+ev.venue:""} · tap for the lineup</p>
      </button>`).join("");
    host.innerHTML = "<div id='ufcEvents'>"+evHtml+"</div><div id='ufcLineup'></div><div id='ufcRanks'></div>";
    host.querySelectorAll("[data-event]").forEach(b=>b.onclick=()=>showUfcLineup(b.dataset.event, games));
  } else {
    host.innerHTML = games.map(g=>`
      <button type="button" class="gcard" data-gid="${g.eventId}" data-fid="${g.fightId||""}">
        <div class="gstat"><span>${when(g)}</span><span>${g.broadcast||""}</span></div>
        <div class="gduo">
          <div class="gteam"><span class="logoplate"><img alt="" src="${g.awayImg}"/></span>${g.away}</div>
          <span class="vs">VS</span>
          <div class="gteam right">${g.home}<span class="logoplate"><img alt="" src="${g.homeImg}"/></span></div>
        </div>
        ${g.awayScore||g.homeScore?`<div class="linechip">${g.awayScore} — ${g.homeScore}</div>`:""}
      </button>`).join("");
  }
  host.querySelectorAll("[data-gid]").forEach(b=>b.onclick=()=>openGame(b.dataset.gid, b.dataset.fid||b.dataset.gid));
  if(LEAGUE==="ufc") loadUfcRankings();
}
async function loadLeague(lg){
  LEAGUE=lg;
  show("live");
  $("liveMeta").textContent = "Loading "+lg.toUpperCase();
  $("liveList").innerHTML = "<p class='hint'>Talking to ESPN…</p>";
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 8000);
  try{
    const res = await fetch(URLS[lg], {cache:"no-store", signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) throw new Error("ESPN "+res.status);
    const data = await res.json();
    const evs = data.events || [];
    GAMES = evs.flatMap(ev=>mapComp(ev,lg));
    paint(GAMES);
  }catch(err){
    clearTimeout(t);
    $("liveList").innerHTML = "<p class='hint'>"+lg.toUpperCase()+" did not load. "+(err.message||err)+"</p>";
    $("liveMeta").textContent = lg.toUpperCase()+" failed";
  }
}
function boxHtml(sum){
  const sides = ((sum.boxscore||{}).players)||[];
  if(!sides.length) return "<p class='hint'>Box not up yet.</p>";
  const prefer = (LEAGUE==="nfl"||LEAGUE==="cfb")
    ? ["passing","rushing","receiving","kicking"]
    : null;
  return sides.map(side=>{
    const team = (side.team && (side.team.abbreviation||side.team.displayName)) || "";
    let groups = (side.statistics||[]).filter(g=>g && (g.athletes||[]).length);
    if(prefer){
      const rank = n => { const i=prefer.indexOf(n); return i<0?99:i; };
      groups = groups.filter(g=>rank(g.name)<99).sort((a,b)=>rank(a.name)-rank(b.name));
    }
    return groups.map(grp=>{
      const labels = (grp.labels||grp.names||[]).slice(0,8);
      const head = "<tr><th>"+(grp.label||grp.displayName||grp.name||team)+"</th>"+labels.map(l=>"<th>"+l+"</th>").join("")+"</tr>";
      const rows = (grp.athletes||[]).map(a=>{
        const n=(a.athlete&&a.athlete.displayName)||"";
        const st=a.stats||[];
        const pid=a.athlete&&a.athlete.id||"";
        return "<tr class='prow' data-pid='"+pid+"' data-pname='"+String(n).replace(/"/g,"")+"'><td><span class='pname'>"+n+"</span></td>"+st.slice(0,8).map(v=>"<td>"+v+"</td>").join("")+"</tr>";
      }).join("");
      return "<div class='box'><h3>"+team+" · "+(grp.label||grp.displayName||grp.name||"")+"</h3><table class='bx'><thead>"+head+"</thead><tbody>"+rows+"</tbody></table></div>";
    }).join("");
  }).join("");
}
function playsHtml(sum){
  const plays = (sum.plays||[]).slice(-8).reverse();
  if(!plays.length) return "";
  return "<p class='hint'>Last plays</p>"+plays.map(p=>{
    const clock = p.clock && (p.clock.displayValue||p.period&&p.period.displayValue) || "";
    const txt = p.text || p.alternativeText || "";
    return "<div class='play'><span>"+clock+"</span><p>"+txt+"</p></div>";
  }).join("");
}
function findAthlete(sum, id){
  if(!id) return "";
  const sides=((sum.boxscore||{}).players)||[];
  for(const side of sides){
    for(const grp of (side.statistics||[])){
      for(const a of (grp.athletes||[])){
        if(a.athlete && String(a.athlete.id)===String(id)) return a.athlete.displayName||a.athlete.shortName||"";
      }
    }
  }
  return "";
}
function tstat(sum, ab, name){
  const teams=((sum.boxscore||{}).teams)||[];
  const t=teams.find(x=>(x.team&&(x.team.abbreviation===ab || x.team.displayName===ab)));
  const s=((t&&t.statistics)||[]).find(x=>x.name===name);
  return s ? (s.displayValue||s.value||"—") : "—";
}
function qtrCells(comp){
  const ls = comp.linescores || [];
  const cells = [1,2,3,4,5].map(i => (ls[i-1] && ls[i-1].displayValue) || (ls[i-1] && ls[i-1].value) || "");
  return cells;
}

async function loadFightHistory(aid, name, hostId){
  const host=$(hostId);
  try{
    const res=await fetch("https://site.web.api.espn.com/apis/common/v3/sports/mma/ufc/athletes/"+aid+"/overview",{cache:"no-store"});
    if(!res.ok) throw new Error("no book");
    const data=await res.json();
    const uids=(data.fightHistory||[]).slice(0,8);
    if(!uids.length){ host.innerHTML="<div class='box'><h3>"+name+" · history</h3><p class='hint'>No ESPN history.</p></div>"; return; }
    const rows=await Promise.all(uids.map(async uid=>{
      const p={};
      uid.split("~").forEach(bit=>{ const kv=bit.split(":"); if(kv[1]) p[kv[0]]=kv[1]; });
      if(!p.e||!p.c) return "";
      try{
        const cr=await fetch("https://sports.core.api.espn.com/v2/sports/mma/leagues/ufc/events/"+p.e+"/competitions/"+p.c,{cache:"no-store"});
        if(!cr.ok) return "";
        const c=await cr.json();
        const comps=c.competitors||[];
        const me=comps.find(x=>String(x.id)===String(aid));
        const opp=comps.find(x=>String(x.id)!==String(aid))||{};
        let oppName="Opponent";
        try{
          const ar=await fetch((opp.athlete&&opp.athlete.$ref||"").replace("http://","https://"));
          if(ar.ok){ const ad=await ar.json(); oppName=ad.displayName||ad.fullName||oppName; }
        }catch(e){}
        const win = me && me.winner===true;
        const tag = win ? "<span class='chipwin'>W</span>" : (me && me.winner===false ? "<span class='chiploss'>L</span>" : "—");
        const wt = (c.type && (c.type.text||c.type.abbreviation)) || "";
        const dt = (c.date||"").slice(0,10);
        const title = /5 rnd/i.test(c.description||"") || /title|champ/i.test(c.description||"");
        let evName = "";
        try{
          const er=await fetch("https://sports.core.api.espn.com/v2/sports/mma/leagues/ufc/events/"+p.e,{cache:"no-store"});
          if(er.ok){ const ev=await er.json(); evName=ev.shortName||ev.name||""; }
        }catch(e){}
        return "<tr><td>"+dt+"</td><td>"+evName+(title?" <span class='titlechip'>Title</span>":"")+"</td><td>"+oppName+"</td><td>"+wt+"</td><td>"+tag+"</td></tr>";
      }catch(e){ return ""; }
    }));
    host.innerHTML="<div class='box'><h3>"+name+" · last fights</h3><table class='bx'><thead><tr><th>Date</th><th>Event</th><th>Opp</th><th>Class</th><th></th></tr></thead><tbody>"+rows.join("")+"</tbody></table></div>";
  }catch(e){
    host.innerHTML="<div class='box'><h3>"+name+" · history</h3><p class='hint'>Could not load history.</p></div>";
  }
}
async function openGame(id, fid){
  OPEN = id;
  if(poll){ clearInterval(poll); poll=null; }
  show("game");
  $("gameRoom").innerHTML = "<p class='hint'>Opening…</p>";
  const g = LEAGUE==="ufc"
    ? (GAMES.find(x => String(x.fightId)===String(fid||id) || String(x.id)===String(id)) || {})
    : (GAMES.find(x => x.eventId===id) || {});
  if(LEAGUE==="ufc"){
    renderFight(g);
    return;
  }
  async function tickGame(){
    if(OPEN!==id) return;
    try{
      const res = await fetch(SUM[LEAGUE](id), {cache:"no-store"});
      const sum = res.ok ? await res.json() : {};
      renderGame(g, sum);
      const state = ((((sum.header||{}).competitions||[])[0]||{}).status||{}).type || {};
      if(state.completed || state.state==="post"){ if(poll) clearInterval(poll); poll=null; }
    }catch(e){
      $("gameRoom").innerHTML = "<p class='hint'>Could not open game. "+(e.message||"")+"</p>";
    }
  }
  await tickGame();
  poll = setInterval(tickGame, 12000);
}

  if(!name) return "";
  try{
    const res=await fetch("https://site.web.api.espn.com/apis/common/v3/search?query="+encodeURIComponent(name)+"&limit=12&type=player",{cache:"no-store"});
    if(!res.ok) return "";
    const items=(await res.json()).items||[];
    const exact=items.find(x=>x.sport==="mma" && String(x.displayName||"").toLowerCase()===String(name).toLowerCase());
    const any=items.find(x=>x.sport==="mma");
    return String((exact||any||{}).id||"");
  }catch(e){ return ""; }
}
async function openFighter(pid, name){
  show("player");
  $("playerRoom").innerHTML="<p class='hint'>Loading "+name+"…</p>";
  if(!pid) pid = await findMmaId(name);
  if(!pid){
    $("playerRoom").innerHTML="<p class='hint'>Could not match "+name+" on ESPN.</p>";
    return;
  }
  try{
    const [coreRes, ovRes] = await Promise.all([
      fetch("https://sports.core.api.espn.com/v2/sports/mma/athletes/"+pid,{cache:"no-store"}),
      fetch("https://site.web.api.espn.com/apis/common/v3/sports/mma/ufc/athletes/"+pid+"/overview",{cache:"no-store"})
    ]);
    const a = coreRes.ok ? await coreRes.json() : {};
    const ov = ovRes.ok ? await ovRes.json() : {};
    const shot=(a.headshot&&a.headshot.href)||("https://a.espncdn.com/i/headshots/mma/players/full/"+pid+".png");
    const rec=((a.records&&a.records.$ref)?"":"");
    let recSum="";
    try{
      const rr=await fetch("https://sports.core.api.espn.com/v2/sports/mma/athletes/"+pid+"/records",{cache:"no-store"});
      if(rr.ok){ const rd=await rr.json(); recSum=((rd.items||[])[0]||{}).summary||""; }
    }catch(e){}
    const gym=(a.association&&(a.association.name||a.association.text))||"—";
    const stance=(a.stance&&(a.stance.text||a.stance.name))||"";
    const style=Array.isArray(a.styles)?a.styles.map(s=>s.text||s.name||"").filter(Boolean).join(" / "):"—";
    $("playerRoom").innerHTML = `
      <div class="phero">
        <div class="phero-top">
          <img class="fface" alt="" src="${shot}"/>
          <div class="phero-copy">
            <p class="kicker">${(a.weightClass&&a.weightClass.text)||"Fighter"}</p>
            <h2>${a.displayName||name}</h2>
            <p>${recSum} · ${a.displayHeight||""} · ${a.displayReach?("reach "+a.displayReach):""} · ${stance} · ${a.citizenship||""}</p>
          </div>
        </div>
        <div class="tiles">
          <div class="tile"><em>Age</em><b>${a.age||"—"}</b></div>
          <div class="tile"><em>Weight</em><b>${a.displayWeight||"—"}</b></div>
          <div class="tile"><em>Gym</em><b>${gym}</b></div>
          <div class="tile"><em>Style</em><b>${style}</b></div>
        </div>
      </div>
      <div class="hist" id="histF"><p class="hint">Loading fight history…</p></div>`;
    loadFightHistory(pid, a.displayName||name, "histF");
  }catch(e){
    $("playerRoom").innerHTML="<p class='hint'>No book for "+name+".</p>";
  }
}
async function openPlayer(pid, name){
  show("player");
  $("playerRoom").innerHTML = "<p class='hint'>Loading "+name+"…</p>";
  try{
    const path = LEAGUE==="nfl" ? "football/nfl" : LEAGUE==="cfb" ? "football/college-football" : "baseball/mlb";
    const ovrRes = await fetch("https://site.web.api.espn.com/apis/common/v3/sports/"+path+"/athletes/"+pid+"/overview",{cache:"no-store"});
    if(!ovrRes.ok) throw new Error("ESPN "+ovrRes.status);
    const d = await ovrRes.json();
    let log = {}, splitsPack = {};
    try{
      const [logRes, splitRes] = await Promise.all([
        fetch("https://site.web.api.espn.com/apis/common/v3/sports/"+path+"/athletes/"+pid+"/gamelog",{cache:"no-store"}),
        fetch("https://site.web.api.espn.com/apis/common/v3/sports/"+path+"/athletes/"+pid+"/splits",{cache:"no-store"})
      ]);
      if(logRes.ok) log = await logRes.json();
      if(splitRes.ok) splitsPack = await splitRes.json();
    }catch(e){}
    const st = d.statistics || {};
    const labels = st.labels || [];
    const splits = (st.splits || []).map(sp =>
      "<tr><td>"+sp.displayName+"</td>"+(sp.stats||[]).map(v=>"<td>"+v+"</td>").join("")+"</tr>"
    ).join("");
    const meta = log.events || {};
    const gLabels = log.labels || [];
    const catEvents = ((((log.seasonTypes||[])[0]||{}).categories||[])[0]||{}).events || [];
    const list = Array.isArray(catEvents) ? catEvents.slice(0,10) : [];
    const rows = list.map(ev=>{
      const info = (!Array.isArray(meta) && meta && ev.eventId) ? (meta[ev.eventId]||{}) : {};
      const opp = (info.opponent && (info.opponent.abbreviation || info.opponent.displayName)) || info.atVs || "";
      const dec = info.gameResult || "";
      const line = (ev.stats||[]).slice(0,7).join(" · ");
      return "<tr><td>"+String(info.gameDate||"").slice(0,10)+"</td><td>"+dec+" "+opp+"</td><td>"+line+"</td></tr>";
    }).join("");
    const shot = LEAGUE==="nfl"
      ? "https://a.espncdn.com/i/headshots/nfl/players/full/"+pid+".png"
      : LEAGUE==="cfb"
        ? "https://a.espncdn.com/i/headshots/college-football/players/full/"+pid+".png"
        : "https://a.espncdn.com/i/headshots/mlb/players/full/"+pid+".png";
    const season = (st.splits||[]).find(s=>/regular/i.test(s.displayName||"")) || (st.splits||[])[0] || {stats:[]};
    const career = (st.splits||[]).find(s=>/career/i.test(s.displayName||"")) || null;
    const tiles = labels.map((lab,i)=>"<div class='tile'><em>"+lab+"</em><b>"+(season.stats[i]||"—")+"</b></div>").join("");
    const careerBits = career ? labels.map((lab,i)=>"<span>"+lab+"<b>"+(career.stats[i]||"—")+"</b></span>").join("") : "";
    const cards = list.map(ev=>{
      const info = (!Array.isArray(meta) && meta && ev.eventId) ? (meta[ev.eventId]||{}) : {};
      const opp = (info.opponent && (info.opponent.abbreviation || info.opponent.displayName)) || info.atVs || "Opp";
      const dec = (info.gameResult||"").trim();
      const dt = String(info.gameDate||"").slice(0,10);
      const bits = (ev.stats||[]).slice(0,6);
      const line = bits.map((v,i)=>(gLabels[i]||"")+" "+v).filter(Boolean).join("  ");
      return "<div class='grow'><div class='dec "+dec+"'>"+(dec||"·")+"</div><div class='opp'>"+opp+"<span>"+dt+"</span></div><div class='line'>"+line+"</div></div>";
    }).join("");
    function idx(labs, names){
      const L=(labs||[]).map(x=>String(x).toUpperCase());
      for(const n of names){ const i=L.indexOf(n); if(i>=0) return i; }
      return -1;
    }
    const isPitch = /pitch/i.test(st.displayName||"") || labels.includes("ERA") || labels.includes("IP");
    const isPass = /pass/i.test(st.displayName||"") || labels.includes("CMP") || labels.includes("CMP%");
    const isRush = /rush/i.test(st.displayName||"");
    const isRec = /receiv/i.test(st.displayName||"");
    const leadKeys = isPass ? [["YDS","YDS"],["TD","TD"],["INT","INT"]]
      : isRush ? [["YDS","YDS"],["TD","TD"],["AVG","AVG"]]
      : isRec ? [["YDS","YDS"],["REC","REC"],["TD","TD"]]
      : isPitch ? [["ERA","ERA"],["W-L","W","L"],["K","K","SO"]]
      : [["AVG","AVG","BA"],["HR","HR"],["RBI","RBI"]];
    const leads = leadKeys.map(pair=>{
      if(pair[0]==="W-L"){
        const w=idx(labels,["W"]), l=idx(labels,["L"]);
        const val = (w>=0||l>=0) ? ((season.stats[w]||"0")+"-"+ (season.stats[l]||"0")) : "—";
        return "<div class='lead'><em>W-L</em><b>"+val+"</b></div>";
      }
      const i=idx(labels, pair.slice(1));
      return "<div class='lead'><em>"+pair[0]+"</em><b>"+(i>=0?(season.stats[i]||"—"):"—")+"</b></div>";
    }).join("");
    const nxt = ((((d.nextGame||{}).league||{}).events)||[])[0] || {};
    const nextLine = nxt.shortName || nxt.name || "";
    const roto = (d.rotowire && (d.rotowire.headline||d.rotowire.story)) || "";
    const lrCat = (splitsPack.splitCategories||[]).find(c=>/right \/ left/i.test(c.displayName||""));
    const slLabs = splitsPack.labels || [];
    const avgI = idx(slLabs, ["AVG","BA","OBA"]);
    const lr = (lrCat && lrCat.splits || []).map(s=>{
      const v = avgI>=0 ? s.stats[avgI] : (s.stats||[]).slice(-4,-3)[0] || "—";
      return "<div class='tile'><em>"+s.displayName+"</em><b>"+v+"</b></div>";
    }).join("");
    $("playerRoom").innerHTML = `
      <div class="phero">
        <div class="phero-top">
          <img alt="" src="${shot}"/>
          <div class="phero-copy">
            <p class="kicker">${st.displayName||"Player"}</p>
            <h2>${name}</h2>
            ${nextLine?`<p class="nextchip">${(d.nextGame&&d.nextGame.displayName)||"Game"} · ${nextLine}</p>`:"<p>ESPN season tape</p>"}
          </div>
        </div>
        <div class="lead3">${leads}</div>
        ${roto?`<div class="wireblurb">${roto}</div>`:""}
        <div class="tiles">${tiles}</div>
        ${lr?`<div class="lr">${lr}</div>`:""}
        ${careerBits?`<div class="career"><span>Career</span>${careerBits}</div>`:""}
      </div>
      <div class="glog">
        <h3>Recent</h3>
        ${cards||"<p class='hint'>No log posted</p>"}
      </div>`;
  }catch(e){
    $("playerRoom").innerHTML="<p class='hint'>No breakout for "+name+". "+(e.message||"")+"</p>";
  }
}
document.addEventListener("click", ev=>{
  const row = ev.target.closest && ev.target.closest(".prow[data-pid]");
  if(row && (row.dataset.pid || row.dataset.pname)){
    ev.preventDefault();
    ev.stopPropagation();
    if(LEAGUE==="ufc") openFighter(row.dataset.pid||"", row.dataset.pname||"Fighter");
    else if(row.dataset.pid) openPlayer(row.dataset.pid, row.dataset.pname||"Player");
  }
});
$("toGame") && ($("toGame").onclick = ()=>show("game"));
$("goHome").onclick = ()=>{ if(poll) clearInterval(poll); poll=null; OPEN=null; show("home"); };
$("toHome").onclick = ()=>{ if(poll) clearInterval(poll); poll=null; OPEN=null; show("home"); };
$("toSlate").onclick = ()=>{ if(poll) clearInterval(poll); poll=null; OPEN=null; show("live"); };
document.querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>loadLeague(b.dataset.lg));
show("home");
</script>
