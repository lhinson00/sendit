<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#05060a"/>
<title>Sports Sauce</title>
<style>@import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap");
:root {
  --bg:#05060a; --orange:#ff7a18; --ember:#ffc46b; --live:#ff3b3b;
  --text:#f7f2ea; --muted:#9b9288; --green:#3ee0a0;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{
  font-family:Manrope,sans-serif;color:var(--text);
  max-width:640px;margin:0 auto;min-height:100vh;
  background:#05060a
    radial-gradient(80% 40% at 100% 0, rgba(255,122,24,.25), transparent 50%),
    radial-gradient(60% 30% at 0 100%, rgba(120,20,0,.18), transparent 50%);
  background-color:#05060a;
  padding:0 0 calc(78px + env(safe-area-inset-bottom));
}
.top{padding:16px 16px 12px;display:flex;flex-direction:column;gap:0;
  background:linear-gradient(90deg,#2a1408,#05060a 55%);
  border-bottom:2px solid var(--orange)}
.brand{display:flex;align-items:center;justify-content:space-between}
.word{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:10px;background:var(--orange);color:#120800;
  font-family:"Bebas Neue",sans-serif;font-size:28px;display:grid;place-items:center}
.eyebrow{margin:0;color:var(--ember);font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:800}
h1{margin:0;font-family:"Bebas Neue",sans-serif;font-size:36px;letter-spacing:.06em}
.livepill{font-size:10px;font-weight:800;letter-spacing:.16em;color:#ff8a8a;
  border:1px solid #ff3b3b;padding:6px 9px;border-radius:99px;background:#2a0c0c}

.livetop,.sec{padding:14px 16px 8px;margin:0;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--orange);font-weight:800}
.livetop{color:var(--muted)}

.gcard{display:block;width:calc(100% - 24px);margin:0 12px 12px;text-align:left;color:inherit;font:inherit;
  background:#101218;border:1px solid #2a241c;border-radius:6px;padding:12px 12px 10px 14px;
  position:relative}
.gcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--stripe,var(--orange))}
.gcard.on{border-color:#ff3b3b;background:#160e0c}
.gcard.done{opacity:.7}
.gstat{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.gcard.on .gstat{color:var(--live);font-weight:800}
.gduo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.gteam{display:flex;align-items:center;gap:8px;font-family:"Bebas Neue",sans-serif;font-size:26px}
.gteam.right{justify-content:flex-end}
.gteam img{width:28px;height:28px;object-fit:contain}
.gscore{font-family:"Bebas Neue",sans-serif;font-size:28px;letter-spacing:.04em;text-align:center}
.gscore em{font-style:normal;color:var(--muted);margin:0 4px}
.gopen{margin-top:10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);font-weight:800}

.back{margin:8px 16px;border:0;background:0;color:var(--orange);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.scorebug{margin:0 12px 12px;padding:14px;border-radius:6px;background:#0e1016;border:1px solid #3a2a18;
  position:sticky;top:0;z-index:6}
.scorebug.on{border-color:#ff3b3b}
.sbmeta{margin-bottom:10px}
.chipstat{display:inline-block;padding:4px 8px;border-radius:99px;background:#1a1c22;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.chipstat.hot{background:#3a1010;color:#ff6d6d}
.sbgrid{display:grid;gap:8px}
.sbteam{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;
  border-left:5px solid var(--c);padding:6px 8px;background:#0a0b10}
.sbteam img{width:32px;height:32px}
.sbteam span{font-family:"Bebas Neue",sans-serif;font-size:24px}
.sbteam b{font-family:"Bebas Neue",sans-serif;font-size:34px}
.wp{position:relative;height:7px;margin:12px 0 22px;background:#222;border-radius:99px;overflow:hidden}
.wp i{display:block;height:100%}
.wp em{position:absolute;top:10px;font-size:10px;color:var(--muted);font-style:normal;letter-spacing:.08em;text-transform:uppercase}
.wp em:first-of-type{left:0}.wp em:last-of-type{right:0}
.lastplay{font-size:13px;color:#efe6d8;border-top:1px solid #2a241c;padding-top:10px}

.gtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 12px 12px;position:sticky;top:132px;z-index:5;background:#05060a;padding:6px 0}
.gtabs button{border:1px solid #2a241c;background:#101218;color:var(--muted);padding:11px 4px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.gtabs button.on{background:var(--orange);color:#140800;border-color:var(--orange)}
.gtab{margin:0 12px 16px}
.play{background:#101218;border:1px solid #222;padding:12px 12px 12px 16px;margin-bottom:8px;position:relative}
.play::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#2a2a2a}
.play.score::before{background:var(--orange)}
.play span{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.play b{display:block;font-family:"Bebas Neue",sans-serif;font-size:20px}
.play p{margin:6px 0 0;font-size:14px;line-height:1.4}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px 10px}
.tabs button{border:1px solid #2a241c;background:#101218;color:var(--muted);padding:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.tabs button.on{background:var(--orange);color:#140800}
.controls,.summary,.card,.game{background:#101218;border:1px solid #2a241c;border-radius:6px;padding:14px;margin:0 12px 10px}
label{display:block;font-size:10px;color:var(--muted);margin-bottom:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
select,input{width:100%;margin-top:6px;padding:12px;border-radius:4px;border:1px solid #2a241c;background:#0a0b10;color:var(--text);font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary{font-size:13px;color:var(--muted)}
.card{display:grid;grid-template-columns:1fr auto;gap:6px 12px;cursor:pointer}
.card h3{margin:0;font-size:17px}
.meta{margin:3px 0 0;color:var(--muted);font-size:12px}
.score{font-family:"Bebas Neue",sans-serif;font-size:40px;color:var(--orange);line-height:1}
.record{font-family:"Bebas Neue",sans-serif;font-size:32px;color:var(--green);text-align:right}
.record.mid{color:var(--ember)}
.pass{font-size:10px;color:var(--muted);text-align:right;letter-spacing:.12em;text-transform:uppercase}
.call{margin:8px 0 4px;color:var(--orange);font-weight:800}
.read{margin:0;color:#ddd4c8;font-size:13px;line-height:1.45}
.why{margin-top:8px;display:grid;gap:4px}
.fact{font-size:12px;background:#0a0b10;padding:8px 10px;color:#cfc6ba}
.fact b{color:#fff;margin-right:6px}
.mtag,.itag{display:inline-block;margin:6px 6px 0 0;padding:3px 8px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.mtag.good{background:#123528;color:var(--green)}
.mtag.ok{background:#2a2410;color:var(--ember)}
.mtag.bad,.itag{background:#3a1218;color:#ff8a8a}
.game .match{font-family:"Bebas Neue",sans-serif;font-size:28px}
.game .lines{color:var(--ember);font-weight:700}
.jump{margin-top:10px;width:100%;padding:12px;border:0;background:var(--orange);color:#140800;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#0a0b10;border:1px solid #2a241c;padding:12px}
.tile span{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.tile b{font-family:"Bebas Neue",sans-serif;font-size:26px}
.tile.good b{color:var(--green)}
.tblwrap{overflow:auto;margin-bottom:10px}
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log th{text-align:left;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:8px 6px;background:#140f0c}
table.log td{padding:8px 6px;border-top:1px solid #1c1c22;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 7px;font-size:11px;font-weight:700}
.chip.win{background:#123528;color:var(--green)}
.chip.loss{background:#3a1218;color:#ff8a8a}
.chip.push{background:#2a2410;color:var(--ember)}
.close{width:100%;margin-top:14px;padding:13px;border:0;background:var(--orange);color:#140800;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:20}
.sheet.open{display:flex}
.sheet-body{background:#101218;border-top:3px solid var(--orange);width:100%;max-height:86vh;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.odds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint,.empty{color:var(--muted);font-size:12px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));
  width:min(640px,calc(100% - 16px));display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;
  background:#101218;border:1px solid #3a2a18;z-index:12}
.dock button{border:0;background:transparent;color:var(--muted);padding:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.dock button.on{background:var(--orange);color:#140800}

.sauce,.sliprow{display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:#101218;border:1px solid #2a241c;padding:10px 12px;margin-bottom:8px}
.sauce b{display:block}
.sauce span{color:var(--muted);font-size:11px}
.sright{display:flex;align-items:center;gap:8px}
.sright em{font-style:normal;font-family:"Bebas Neue",sans-serif;font-size:22px;color:var(--orange)}
.addleg,.sliprow button{border:0;background:var(--orange);color:#140800;font-weight:800;padding:8px 10px;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.sliprow button{background:#3a1218;color:#ff8a8a}
.sliptop{margin-bottom:12px}

.sfilt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px;background:#101218;border:1px solid #2a241c;padding:12px}
.sfilt label{margin:0}
.prog{font-style:normal;font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:.04em}
.prog.hit{color:var(--green)}
.prog.run{color:var(--ember)}
.prog.miss{color:#ff8a8a}
.prog.wait{color:var(--muted)}
.sliprow b{display:block}
.sliprow span{color:var(--muted);font-size:11px}

.cardish{align-items:flex-start}
.scall{margin-top:6px;color:var(--orange);font-weight:800;font-size:13px}
.sauce em{font-style:normal;font-family:"Bebas Neue",sans-serif;font-size:22px;color:var(--orange)}

.bigscore{font-family:"Bebas Neue",sans-serif;font-size:40px;line-height:1;color:var(--orange);text-shadow:0 0 18px rgba(255,122,24,.35)}
</style>
</head><body>
<header class="top">
  <div class="brand">
    <div class="word">
      <div class="mark">S</div>
      <div>
        <p class="eyebrow">NFL desk</p>
        <h1>Sports Sauce</h1>
      </div>
    </div>
    <span class="livepill">LIVE</span>
  </div>
</header>

<section id="viewLive">
  <div class="livetop"><span id="liveMeta">Loading slate…</span></div>
  <div id="liveList"></div>
</section>

<section id="viewGame" hidden>
  <div id="gameRoom"></div>
</section>

<section id="viewResearch" hidden>
  <p class="sec">Betting desk</p>
  <div class="tabs">
    <button type="button" class="on" data-mode="players">Players</button>
    <button type="button" data-mode="teams">Teams</button>
  </div>
  <section class="controls" id="playerControls">
    <div class="row">
      <label>Position<select id="pos"></select></label>
      <label>Stat<select id="market"></select></label>
    </div>
    <label>Line<select id="line"></select></label>
    <div class="row">
      <label>Min games<input id="minGames" type="number" min="1" max="18" value="8" /></label>
      <label>Min hits<input id="minHits" type="number" min="0" max="18" value="10" /></label>
    </div>
    <label>Game<select id="game"></select></label>
    <label>Search<input id="q" type="search" placeholder="Player name" autocomplete="off" /></label>
  </section>
  <section class="controls" id="teamControls" hidden>
    <div class="row">
      <label>Market<select id="tMarket"></select></label>
      <label>Home / Away<select id="tSplit"></select></label>
    </div>
    <div class="row">
      <label>Min games<input id="tMinGames" type="number" min="1" max="18" value="8" /></label>
      <label>Min hits<input id="tMinHits" type="number" min="0" max="18" value="8" /></label>
    </div>
    <label>Search<input id="tQ" type="search" placeholder="Team code (DET)" autocomplete="off" /></label>
  </section>
  <section class="summary" id="summary"></section>
  <section class="list" id="list"></section>
</section>

<nav class="dock">
  <button type="button" class="on" data-nav="live">Live</button>
  <button type="button" data-nav="research">Research</button>
</nav>
<div class="sheet" id="sheet"><div class="sheet-body" id="sheetBody"></div></div>

  items.forEach((v) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v; el.appendChild(o);
  });
  if (preferred && items.includes(preferred)) el.value = preferred;
  else if (items.length) el.value = items[0];
}
function fillMarkets(pos, preferred) {
  fillSelect(marketEl, MARKETS_BY_POS[pos] || MARKETS_BY_POS.ALL, preferred);
}
function fillLines(market, preferred) {
  fillSelect(lineEl, (window.LINES_BY_MARKET && window.LINES_BY_MARKET[market]) || [], preferred || DEFAULT_LINE[market]);
}

function teamRecord(t) {
  const m = tMarketEl.value;
  const s = tSplitEl.value;
  if (m === "Spread cover") {
    if (s === "Home") return [t.atsH, t.atsHg];
    if (s === "Away") return [t.atsA, t.atsAg];
    return [t.ats, t.atsg];
  }
  if (m === "Moneyline") {
    if (s === "Home") return [t.mlH, t.mlHg];
    if (s === "Away") return [t.mlA, t.mlAg];
    return [t.ml, t.mlg];
  }
  if (m === "Over") return [t.ov, t.ovg];
  return [t.un, t.ung];
}

function renderPlayers() {
  if (!window.VOLUME || !window.VOLUME.length) {
    summaryEl.innerHTML = "<strong>Player data did not load.</strong>";
    listEl.innerHTML = "";
    return;
  }
  const pos = posEl.value, market = marketEl.value, line = lineEl.value;
  const minGames = Number(minGamesEl.value || 0), minHits = Number(minHitsEl.value || 0);
  const q = (qEl.value || "").trim().toLowerCase();
  const gsel = gameEl ? gameEl.value : "All Week "+(window.CUR_WEEK||2)+"";
  const sides = gsel && gsel !== "All Week "+(window.CUR_WEEK||2)+"" ? gsel.split(" @ ") : null;
  const universe = window.VOLUME.filter((r) => {
    if (pos !== "ALL" && r.pos !== pos) return false;
    if (r.market !== market || r.threshold !== line) return false;
    if (sides && r.team !== sides[0] && r.team !== sides[1]) return false;
    return true;
  });
  const rows = universe.filter((r) => r.games >= minGames && r.hits >= minHits && (!q || r.player.toLowerCase().includes(q)))
    .map((r) => {
      const pinfo = window.PLAYER[r.player] || {player:r.player,pos:r.pos,team:r.team,log:[]};
      const mu = scoreSpot(pinfo, market, line, r.hits, r.games);
      const vd = verdict(pinfo, market, line, r.hits, r.games, mu);
      return Object.assign({}, r, { mu, vd });
    })
    .sort((a, b) => (b.mu.score||0) - (a.mu.score||0) || (b.hits/b.games) - (a.hits/a.games) || b.hits - a.hits);
  summaryEl.innerHTML = `<strong>${rows.length}</strong> · ${gsel} · ${pos} · ${market} ${line} · sorted by orange score, high to low<br><span class="hint">Game filter limits to that matchup. Score /100 = hit rate 45–55 + last-5 20 + defense 8–18 + game 10 + H2H 5. List order is hits/games on the line you picked. Score is the matchup note.</span>`;
  if (!rows.length) { listEl.innerHTML = `<div class="empty">Nobody cleared that cut. Lower Min hits.</div>`; return; }
  listEl.innerHTML = rows.map((r) => {
    const cls = r.hits / r.games >= 0.85 ? "" : "mid";
    const mu = r.mu || {};
    const inj = (window.INJ && window.INJ[r.player]) || null;
    const ipill = inj ? `<span class="itag">${inj.status}</span>` : "";
    const pill = mu.word ? `<span class="mtag ${mu.cls}">${mu.word}</span>` : "";
    const sc = mu.score != null ? `<div class="score">${mu.score}</div>` : "";
    return `<article class="card" data-kind="player" data-id="${r.player.replace(/"/g,"")}">
      <div>
        <h3>${r.player}</h3>
        <p class="meta">${r.pos} · ${r.team} · ${mu.line}${(window.INJ&&window.INJ[r.player])? " · "+window.INJ[r.player].status : ""}</p>
        ${pill}${ipill}
        <p class="call">${(r.vd&&r.vd.call)||""}</p>
        <p class="read">${(r.vd&&r.vd.text)||""}</p>
        <div class="why">${mu.why||""}</div>
      </div>
      ${sc}
    </article>`;
  }).join("");
  bindCards();
}


function defOf(team){ return (window.DEF||{})[team] || null; }


function weekOf(team){ return (window.THISWEEK||{})[team] || null; }
function defOf(team){ return (window.DEF||{})[team] || null; }
function matchKey(pos, market){
  if (pos === "QB") return /Rush/.test(market||"") ? "rush" : "pass";
  if (pos === "RB") return /Receiv/.test(market||"") ? "rec" : "rush";
  if (pos === "TE") return "recTE";
  return "recWR";
}
function leagueAvg(key){
  const defs = Object.values(window.DEF||{});
  if (!defs.length) return 0;
  return defs.reduce((s,d)=>s+(d[key]||0),0)/defs.length;
}
function lineNeed(th){
  const n = parseInt(th, 10);
  return Number.isFinite(n) ? n : 1;
}
function logHit(x, market, th){
  const n = lineNeed(th);
  if (market === "Receiving Yards") return (x.ry||0) >= n;
  if (market === "Receptions") return (x.rec||0) >= n;
  if (market === "Receiving TDs") return (x.rtd||0) >= 1;
  if (market === "Rushing Yards") return (x.ru||0) >= n;
  if (market === "Rushing TDs" || market === "QB Rushing TDs") return (x.rutd||0) >= 1;
  if (market === "Passing Yards") return (x.py||0) >= n;
  if (market === "Passing TDs") return (x.ptd||0) >= n;
  if (market === "Interceptions") return /clean|0/.test(th) ? (x.int||0)===0 : (x.int||0)>=1;
  return false;
}
function lastNRate(p, market, th, n){
  const log = (p.log||[]).slice(-n);
  if (!log.length) return null;
  const hits = log.filter(x => logHit(x, market, th)).length;
  return { hits, games: log.length, rate: hits/log.length };
}
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }


function nextRung(p, market, th){
  const order = {
    "Receiving Yards": window.RECV_LINES,
    "Rushing Yards": window.RUSH_LINES,
    "Passing Yards": window.PASS_LINES,
    "Receptions":["2+","3+","4+","5+","6+","7+","8+","10+"],
    "Passing TDs":["1+","2+"]
  }[market];
  if (!order) return null;
  const i = order.indexOf(th);
  if (i < 0 || i === order.length-1) return null;
  const nxt = order[i+1];
  const row = (window.VOLUME||[]).find(x => x.player===p.player && x.market===market && x.threshold===nxt);
  return row ? { th:nxt, hits:row.hits, games:row.games } : null;
}
function verdict(p, market, th, hits, games, mu){
  const rate = games ? hits/games : 0;
  const nxt = nextRung(p, market, th);
  const bits=[];
  if (rate >= 16/18 || rate >= 0.88) bits.push("This line is his floor — "+hits+"/"+games+".");
  else if (rate >= 0.72) bits.push("Usually gets there — "+hits+"/"+games+".");
  else bits.push("Not stable enough — only "+hits+"/"+games+".");
  if (nxt && nxt.games){
    const nr = nxt.hits/nxt.games;
    if (Math.abs(nr-rate) <= 0.06) bits.push(nxt.th+" is almost the same ("+nxt.hits+"/"+nxt.games+").");
    else if (nr <= rate-0.2) bits.push("Next step "+nxt.th+" drops off to "+nxt.hits+"/"+nxt.games+".");
    else bits.push(nxt.th+" is "+nxt.hits+"/"+nxt.games+".");
  }
  if (mu && mu.word==="Tough") bits.push("Defense is the caution — they rank stingy in this stat.");
  else if (mu && mu.word==="Favorable") bits.push("Defense actually gives this stat up.");
  const l5 = lastNRate(p, market, th, 5);
  if (l5 && l5.games>=4 && l5.rate===1) bits.push("Last 5 all hit.");
  else if (l5 && l5.rate<=0.4) bits.push("Cold last 5 ("+l5.hits+"/"+l5.games+").");
  let call="Lean no";
  const isFloor = /20\+|2\+|150\+/.test(th);
  if (isFloor && rate>=0.85) call="Insert — this is the floor";
  else if (rate>=0.88 && mu && mu.word!=="Tough") call="Insert";
  else if (rate>=0.88) call="Insert, respect the defense";
  else if (rate>=0.72 && mu && (mu.word==="Favorable"||mu.word==="Floor")) call="Insert";
  else if (rate>=0.72) call="Only if you need the leg";
  return { call, text: bits.join(" ") };
}

function scoreSpot(p, market, th, seasonHits, seasonGames){
  const w = weekOf(p.team);
  const locLine = w ? ((w.ha==="H"?"vs ":"@ ")+w.opp) : "Off slate";
  if (!w) return { line: locLine, word:"", cls:"hide", score:null, why:"", parts:{} };

  const d = defOf(w.opp) || {};
  const key = matchKey(p.pos, market);
  const allowed = d[key];
  const rk = d.rk && d.rk[key];
  const avg = leagueAvg(key) || 1;
  const labels = {pass:"pass yds/g", rush:"rush yds/g", rec:"rec yds/g", recWR:"WR yds/g", recTE:"TE yds/g"};

  // Floor lines (20+ rec/rush, 2+ catches, 150+ pass) are volume bets.
  // Defense only gets a real vote as the rung climbs.
  const need = lineNeed(th);
  let floor = false;
  if (market === "Receiving Yards" || market === "Rushing Yards") floor = need <= 20;
  if (market === "Receptions") floor = need <= 2;
  if (market === "Passing Yards") floor = need <= 150;
  if (/TDs/.test(market) || market === "Interceptions") floor = false;

  const volRate = seasonGames ? seasonHits/seasonGames : 0;
  // Hit rate is the engine. Defense/situation only lean it.
  const volW = floor ? 55 : 45;
  const formW = 20;
  const defW = floor ? 8 : 18;
  const vol = clamp(volRate, 0, 1) * volW;

  const l5 = lastNRate(p, market, th, 5);
  const form = l5 ? clamp(l5.rate,0,1)*formW : formW*0.4;

  let def = defW/2, defNote = "no def data";
  if (allowed != null && avg){
    const ratio = allowed / avg;
    def = clamp(defW/2 + (ratio-1)*defW*2.2, 0, defW);
    defNote = `${w.opp} ${allowed} ${labels[key]||key} vs lg ${avg.toFixed(0)} (rk ${rk}/32)`;
  }

  // 4) Situation 0-10: home + implied scoring
  let sit = 4;
  if (w.ha === "H") sit += 2;
  const tot = Number(w.total), spr = Number(w.spr != null ? w.spr : w.hSpr);
  let implied = null;
  if (Number.isFinite(tot) && Number.isFinite(spr)){
    implied = w.ha==="H" ? (tot+spr)/2 : (tot-spr)/2;
    if (implied >= 26) sit += 3;
    else if (implied >= 23) sit += 1;
    else if (implied <= 18) sit -= 2;
  }
  if ((w.roof||"").includes("dome") || (w.roof||"").includes("closed")) sit += 1;
  sit = clamp(sit, 0, 10);

  // 5) H2H 0-5
  const vsLog = (p.log||[]).filter(x => x.opp === w.opp);
  let h2h = 2.5, h2hNote = "no H2H in sample";
  if (vsLog.length){
    const hHits = vsLog.filter(x => logHit(x, market, th)).length;
    h2h = (hHits/vsLog.length)*5;
    h2hNote = `H2H ${hHits}/${vsLog.length}`;
  }

  const score = Math.round(vol + form + def + sit + h2h);
  let word = "Neutral", cls = "ok";
  if (floor && volRate >= 0.85) { word = "Floor"; cls = "good"; }
  else if (score >= 68 && volRate >= 0.7) { word = "Favorable"; cls = "good"; }
  else if (!floor && (score <= 48 || (def <= defW*0.35 && volRate < 0.85))) { word = "Tough"; cls = "bad"; }

  const why = `
    <div class="fact"><b>Volume</b> ${seasonHits}/${seasonGames} games hit ${th}</div>
    <div class="fact"><b>Last 5</b> ${l5 ? l5.hits+"/"+l5.games : "—"}</div>
    <div class="fact"><b>Defense</b> ${w.opp} gives ${allowed} ${labels[key]||key} · league ${avg.toFixed(0)} · ${rk ? "#"+rk+" of 32" : ""}</div>
    <div class="fact"><b>Game</b> ${implied!=null ? "this offense projected "+implied.toFixed(1)+" pts" : "no total"} · ${w.ha==="H"?"home":"away"}</div>
    <div class="fact"><b>Vs them</b> ${vsLog.length ? (vsLog.filter(x=>logHit(x,market,th)).length+"/"+vsLog.length) : "have not played in this sample"}</div>`;

  return { line: locLine, word, cls, score, why, parts:{vol,form,def,sit,h2h} };
}

function spotFor(p, market, th, hits, games){
  return scoreSpot(p, market, th, hits||0, games||p.games||0);
}

function recOf(code) {
  return (window.TEAMS || []).find((x) => x.team === code) || {};
}
function fmtSprHome(hSpr) {
  if (hSpr == null) return "—";
  return hSpr > 0 ? "-" + hSpr : "+" + Math.abs(hSpr);
}
function fmtSprAway(hSpr) {
  if (hSpr == null) return "—";
  return hSpr > 0 ? "+" + hSpr : "-" + Math.abs(hSpr);
}
function rate(h,g){ return g ? h/g : 0; }
function leanFlags(g,a,h){
  const flags=[];
  const awayRoad = rate(a.atsA,a.atsAg);
  const homeHome = rate(h.atsH,h.atsHg);
  const awayAll = rate(a.ats,a.atsg);
  const homeAll = rate(h.ats,h.atsg);
  const underA = rate(a.un,a.ung), underH = rate(h.un,h.ung);
  const overA = rate(a.ov,a.ovg), overH = rate(h.ov,h.ovg);
  const spr = g.hSpr; // home favored if >0
  if (awayRoad >= 0.6 && homeHome <= 0.45) flags.push({k:"hot", t:g.away+" road cover vs soft home ATS"});
  if (homeHome >= 0.6 && awayRoad <= 0.45) flags.push({k:"hot", t:g.home+" home cover vs soft road ATS"});
  if (spr != null && spr >= 6.5 && homeHome < 0.5 && awayRoad >= 0.5) flags.push({k:"dog", t:g.away+" dog · home favorite covers poorly at home"});
  if (spr != null && spr <= -3 && awayAll >= 0.55) flags.push({k:"hot", t:g.away+" road favorite with ATS volume"});
  if (underA >= 0.55 && underH >= 0.55) flags.push({k:"under", t:"Both sides go under"});
  else if (overA >= 0.55 && overH >= 0.55) flags.push({k:"over", t:"Both sides go over"});
  else if ((underA+underH)/2 >= 0.58) flags.push({k:"under", t:"Combined under volume"});
  else if ((overA+overH)/2 >= 0.58) flags.push({k:"over", t:"Combined over volume"});
  if ((g.roof||"").includes("dome") || (g.roof||"").includes("closed")) flags.push({k:"info", t:"Dome / closed roof"});
  else if (g.roof === "outdoors") flags.push({k:"info", t:"Outdoors"+(g.wind? " · wind "+g.wind:"")});
  if (!flags.some(f=>f.k==="hot"||f.k==="dog"||f.k==="under"||f.k==="over"))
    flags.push({k:"info", t:"No strong split · skip or price shop"});
  return flags;
}

function last5Team(t, key, val){
  const log=(t.log||[]).filter(x=>x[key]===0||x[key]===1).slice(-5);
  if(!log.length) return null;
  const hits=log.filter(x=>x[key]===val).length;
  return {hits, games:log.length};
}
function teamCall(hits, games, l5, extraTough){
  const rate=games?hits/games:0;
  const l5r=l5?l5.hits/l5.games:null;
  let call="Only if you need the leg", bits=[];
  bits.push(hits+"/"+games+" last 18.");
  if(l5) bits.push("Last 5: "+l5.hits+"/"+l5.games+".");
  if(extraTough) bits.push(extraTough);
  if(rate>=0.6 && (l5r==null || l5r>=0.4) && !extraTough) call="Insert";
  else if(rate>=0.6) call="Insert, with caution";
  else if(rate<=0.4) call="Lean no";
  return {call, text:bits.join(" ")};
}
function gameRead(g,a,h){
  const aL5=last5Team(a,"cover",1), hL5=last5Team(h,"cover",1);
  const oL5a=last5Team(a,"ou",1), oL5h=last5Team(h,"ou",1);
  const awayRoad=a.atsA+"/"+a.atsAg+" on the road";
  const homeHome=h.atsH+"/"+h.atsHg+" at home";
  const away = teamCall(a.atsA,a.atsAg,aL5, a.atsA/Math.max(1,a.atsAg)<0.45?"Road ATS is weak.":"");
  const home = teamCall(h.atsH,h.atsHg,hL5, h.atsH/Math.max(1,h.atsHg)<0.45?"Home ATS is weak.":"");
  function vsThisLine(team, line){
    const log=team.log||[];
    const over=log.filter(x=>x.total>line).length;
    const under=log.filter(x=>x.total<line).length;
    const push=log.filter(x=>x.total===line).length;
    return {over, under, push, games:log.length};
  }
  const line=Number(g.total);
  const aL=vsThisLine(a,line), hL=vsThisLine(h,line);
  const aRate=aL.games?aL.over/aL.games:0;
  const hRate=hL.games?hL.over/hL.games:0;
  const comb=(aRate+hRate)/2;
  let totCall="Neutral vs "+line;
  if(comb<=0.40) totCall="Lean under "+line;
  else if(comb>=0.60) totCall="Lean over "+line;
  const totText=`
    <div class="fact"><b>This week</b> ${line}</div>
    <div class="fact"><b>${g.away} vs ${line}</b> over ${aL.over}/${aL.games} · under ${aL.under}/${aL.games}</div>
    <div class="fact"><b>${g.home} vs ${line}</b> over ${hL.over}/${hL.games} · under ${hL.under}/${hL.games}</div>
    <div class="fact"><b>${g.away} vs their own closes</b> over ${a.ov}/${a.ovg} · under ${a.un}/${a.ung}</div>
    <div class="fact"><b>${g.home} vs their own closes</b> over ${h.ov}/${h.ovg} · under ${h.un}/${h.ung}</div>`;
  return {away, home, tot:{call:totCall,text:totText}, awayRoad, homeHome};
}


function kickoffCT(g){
  if (!g) return "";
  const day = g.day || "";
  let time = g.time || "";
  if (!day) return (g.wd || "") + (time ? " " + time : "");
  if (time && time.length === 5) time = time + ":00";
  // nflverse gametime is Eastern
  const iso = day + "T" + (time || "13:00:00") + "-04:00";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return (g.wd || "") + " " + (g.time || "");
  return d.toLocaleString("en-US", {
    timeZone: "America/Chicago",
    weekday: "short",
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit"
  }) + " CT";
}

function renderTeams() {
  const teams = window.TEAMS || [];
  const minG = Number(tMinGamesEl.value || 0), minH = Number(tMinHitsEl.value || 0);
  const q = (tQEl.value || "").trim().toLowerCase();
  const m = tMarketEl.value, s = tSplitEl.value;
  const rows = teams.map((t) => {
    const [hits, games] = teamRecord(t);
    return Object.assign({}, t, { hits, games });
  }).filter((t) => t.games >= minG && t.hits >= minH && (!q || t.team.toLowerCase().includes(q)))
    .sort((a, b) => b.hits - a.hits || b.games - a.games || a.team.localeCompare(b.team));
  summaryEl.innerHTML = `<strong>${rows.length}</strong> teams · ${m} · ${s} · last 18 · remaining games on top`;
  const slate = renderSlate();
  const cards = rows.map((t) => {
    const cls = t.hits / t.games >= 0.6 ? "" : "mid";
    return `<article class="card" data-kind="team" data-id="${t.team}">
      <div><h3>${t.team}</h3><p class="meta">${m} · ${s}</p></div>
      <div><div class="record ${cls}">${t.hits}/${t.games}</div><div class="pass">tap log</div></div>
    </article>`;
  }).join("");
  listEl.innerHTML = slate + cards;
  bindCards();
}

function bindCards() {
  listEl.querySelectorAll(".jump").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const val = el.dataset.game;
      document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode==="players"));

function tile(label, hits, games) {
  const cls = games && hits / games >= 0.6 ? "good" : "soft";
  return `<div class="tile ${cls}"><span>${label}</span><b>${hits}/${games}</b></div>`;
}
function chip(kind, text) {
  return `<span class="chip ${kind}">${text}</span>`;
}

function openPlayer(name) {

  const g = p.games;
  const row = (window.VOLUME||[]).find(x => x.player===p.player && x.market===marketEl.value && x.threshold===lineEl.value);

      ${tile("150+ yds", p.pass_hits[1], g)}

      ${tile("225+ yds", p.pass_hits[4], g)}

  }
  if (isRB || (p.keep_rush && !isQB)) {
    blocks += `<p class="sec">Rushing</p><div class="tiles">
      ${tile("20+ yds", p.rush_hits[1], g)}
      ${tile("40+ yds", p.rush_hits[3], g)}
      ${tile("60+ yds", p.rush_hits[5], g)}

    </div>`;
  }
  if (p.keep_rec && !isQB) {
    blocks += `<p class="sec">Receiving</p><div class="tiles">
      ${tile("20+ yds", p.rec_hits[1], g)}
      ${tile("40+ yds", p.rec_hits[3], g)}
      ${tile("60+ yds", p.rec_hits[5], g)}

      ${tile("6+ catches", p.catch[4], g)}

  }
  if (isQB) {
    blocks += `<p class="sec">Rushing</p><div class="tiles">${tile("Rush TD", p.rush_td1, g)}</div>`;
  }
  const log = (p.log || []).slice().reverse();
  const head = isQB
    ? `<tr><th>Week</th><th>Opp</th><th>Pass</th><th>TD</th><th>INT</th><th>Rush</th></tr>`
    : isRB

    : `<tr><th>Week</th><th>Opp</th><th>Rec</th><th>Yds</th><th>TD</th></tr>`;

  function sauceHtml(g, sum){
    const f=SAUCE_FILT;
    const mkts=f.pos==="ALL"?["Receiving Yards","Receptions","Receiving TDs","Rushing Yards","Rushing TDs","Passing Yards","Passing TDs","QB Rushing TDs","Interceptions"]:marketsFor(f.pos);
    if(!mkts.includes(f.market)) f.market=mkts[0];
    const lines=(window.LINES_BY_MARKET&&window.LINES_BY_MARKET[f.market])||["1+"];
    if(!lines.includes(f.line)) f.line=lines[0];
    const live=boxMap(sum);
    const rows=sauceList(g);
    const slip=loadSlip(g.id||OPEN_ID);
    function prog(r){
      const st=liveStatus(liveNow(live[r.player], r.market), r.th, r.market);
      return `<i class="prog ${st.cls}">${st.txt}</i>`;
    }
    const list=rows.map(r=>{
      const p=window.PLAYER[r.player]||{};
      let mu={}, l5=null, call="";
      try{
        if(typeof lastNRate==="function") l5=lastNRate(p,r.market,r.th,5);
        if(typeof scoreSpot==="function") mu=scoreSpot(p,r.market,r.th,r.hits,r.games)||{};
        if(typeof verdict==="function") call=(verdict(p,r.market,r.th,r.hits,r.games,mu)||{}).call||"";
      }catch(e){}
      const st=liveStatus(liveNow(live[r.player], r.market), r.th, r.market);
      const sc=mu.score!=null?mu.score:"";
      return `<article class="sauce cardish">
        <div><b>${r.player}</b>
          <span>${r.pos} · ${r.team} · ${r.market} ${r.th} · ${r.hits}/${r.games}${l5?` · L5 ${l5.hits}/${l5.games}`:""}${mu.word?` · ${mu.word}`:""} · live ${st.txt}</span>
          ${call?`<div class="scall">${call}</div>`:""}
        </div>
        <div class="sright"><em class="bigscore">${sc}</em>
          <button type="button" class="addleg" data-p="${r.player}" data-m="${r.market}" data-th="${r.th}" data-pos="${r.pos}" data-team="${r.team}">Add</button>
        </div>
      </article>`;
    }).join("") || "<p class='hint'>Nobody cleared that cut on these two rosters. Drop Min G / Min H.</p>";
    const saved=slip.map((r,i)=>{
      const st=liveStatus(liveNow(live[r.player], r.market), r.th, r.market);
      return `<div class="sliprow"><div><b>${r.player}</b><span>${r.market} ${r.th} · live ${st.txt}</span></div><div class="sright"><i class="prog ${st.cls}">${st.cls==="wait"?"":st.txt}</i><button type="button" data-drop="${i}">×</button></div></div>`;
    }).join("") || "<p class='hint'>Empty slip — set a filter, then Add.</p>";
    return `<div class="sfilt">
      <label>Pos<select id="sPos">${opts(["ALL","WR","TE","RB","QB"], f.pos)}</select></label>
      <label>Stat<select id="sMkt">${opts(mkts, f.market)}</select></label>
      <label>Line<select id="sLine">${opts(lines, f.line)}</select></label>
      <label>Min G<input id="sMinG" type="number" min="1" max="18" value="${f.minG}"/></label>
      <label>Min H<input id="sMinH" type="number" min="0" max="18" value="${f.minH}"/></label>
    </div>
    <div class="sliptop"><p class="sec">Slip · live vs line</p>${saved}</div>
    <p class="sec">${rows.length} players · ${f.market} ${f.line}</p>${list}`;
  }
  function bindSauce(g, sum){
    const box=$("gameRoom");
    if (!box) return;
    function readFilt(){
      const pos=$("sPos") && $("sPos").value;
      const mkt=$("sMkt") && $("sMkt").value;
      const line=$("sLine") && $("sLine").value;
      if(pos) SAUCE_FILT.pos=pos;
      if(mkt) SAUCE_FILT.market=mkt;
      if(line) SAUCE_FILT.line=line;
      if($("sMinG")) SAUCE_FILT.minG=Number($("sMinG").value||0);
      if($("sMinH")) SAUCE_FILT.minH=Number($("sMinH").value||0);
    }
    ["sPos","sMkt","sLine","sMinG","sMinH"].forEach(id=>{
      const el=$(id); if(!el) return;
      el.onchange=()=>{ readFilt(); if(id==="sPos"||id==="sMkt"){ /* reset line via html rebuild */ } OPEN_TAB="sauce"; loadGame(g.id); };
    });
    box.querySelectorAll(".addleg").forEach(b=>{
      b.onclick=(e)=>{
        e.stopPropagation();
        const row={player:b.dataset.p,pos:b.dataset.pos,team:b.dataset.team,market:b.dataset.m,th:b.dataset.th};
        const slip=loadSlip(g.id);
        if(!slip.some(x=>x.player===row.player && x.th===row.th && x.market===row.market)) slip.push(row);
        saveSlip(g.id,slip);
        OPEN_TAB="sauce";
        loadGame(g.id);
      };
    });
    box.querySelectorAll("[data-drop]").forEach(b=>{
      b.onclick=()=>{
        const slip=loadSlip(g.id);
        slip.splice(Number(b.dataset.drop),1);
        saveSlip(g.id,slip);
        OPEN_TAB="sauce";
        loadGame(g.id);
      };
    });
  }

function paintGame(g, sum) {
    const box = $("gameRoom");
    if (!box) return;
    const hex = window.TEAM_HEX || {};
    const awC = hex[g.away] || "#888";
    const hmC = hex[g.home] || "#ff7a18";
    const wp = (sum && sum.winprobability) || [];
    const lastWp = wp.length ? wp[wp.length-1] : null;
    const homeWin = lastWp && lastWp.homeWinPercentage != null ? lastWp.homeWinPercentage : null;
    const lastScore = ((sum && sum.scoringPlays) || []).slice(-1)[0];
    const lastTxt = lastScore ? (lastScore.text || "") : "";
    const wpBar = homeWin == null ? "" : `<div class="wp"><i style="width:${Math.round(homeWin*100)}%;background:${hmC}"></i><em>${g.away} ${Math.round((1-homeWin)*100)}%</em><em>${g.home} ${Math.round(homeWin*100)}%</em></div>`;
    box.innerHTML = `
      <button type="button" class="back" id="gameBack">← Slate</button>
      <div class="scorebug ${g.state === "in" ? "on" : ""}">
        <div class="sbmeta"><span class="chipstat ${g.state==="in"?"hot":""}">${statusLine(g)}</span></div>
        <div class="sbgrid">
          <div class="sbteam" style="--c:${awC}"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/${String(g.away||"").toLowerCase()}.png" alt=""/><span>${g.away}</span><b>${g.state==="pre"?"—":g.awayScore}</b></div>
          <div class="sbteam" style="--c:${hmC}"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/${String(g.home||"").toLowerCase()}.png" alt=""/><span>${g.home}</span><b>${g.state==="pre"?"—":g.homeScore}</b></div>
        </div>
        ${wpBar}
        ${lastTxt ? `<div class="lastplay">${lastTxt}</div>` : ""}
      </div>
      <div class="gtabs">
        <button type="button" data-gtab="scoring">Scoring</button>
        <button type="button" data-gtab="box">Box</button>
        <button type="button" data-gtab="plays">Plays</button>
        <button type="button" data-gtab="odds">Line</button>
        <button type="button" data-gtab="sauce">Sauce</button>
      </div>
      <div id="gtab-scoring" class="gtab">${scoringList(sum || {})}</div>
      <div id="gtab-box" class="gtab">${boxTables(sum || {})}</div>
      <div id="gtab-plays" class="gtab">${playList(sum || {})}</div>
      <div id="gtab-odds" class="gtab">${oddsBlock(sum || {})}</div>
      <div id="gtab-sauce" class="gtab">${sauceHtml(g, sum)}</div>`;
    const tab = OPEN_TAB || "scoring";
    box.querySelectorAll("[data-gtab]").forEach((x) => x.classList.toggle("on", x.dataset.gtab === tab));
    ["scoring", "box", "plays", "odds", "sauce"].forEach((k) => {
      const n = $("gtab-" + k);
      if (n) n.hidden = k !== tab;
    });
    $("gameBack").onclick = () => showView("live");
    box.querySelectorAll("[data-gtab]").forEach((b) => {
      b.onclick = () => {
        OPEN_TAB = b.dataset.gtab;
        box.querySelectorAll("[data-gtab]").forEach((x) => x.classList.toggle("on", x === b));
        ["scoring", "box", "plays", "odds", "sauce"].forEach((k) => {
          const n = $("gtab-" + k);
          if (n) n.hidden = k !== OPEN_TAB;
        });
      };
    });
  }

  async function loadGame(id) {
    const games = window.LIVE_GAMES || [];
    const g = Object.assign({}, games.find((x) => x.id === String(id)) || { id, away: "", home: "", state: "pre" });
    let sum = {};
    try {
      const res = await fetch(SUM_URL(id), { cache: "no-store" });
      if (res.ok) sum = await res.json();
      const hdr = ((sum.header || {}).competitions || [])[0] || {};
      const comps = hdr.competitors || [];
      if (comps.length) {
        const home = comps.find((x) => x.homeAway === "home") || {};
        const away = comps.find((x) => x.homeAway === "away") || {};
        const st = (hdr.status || {}).type || {};
        g.away = (away.team && away.team.abbreviation) || g.away;
        g.home = (home.team && home.team.abbreviation) || g.home;
        g.awayScore = away.score != null ? String(away.score) : g.awayScore;
        g.homeScore = home.score != null ? String(home.score) : g.homeScore;
        g.state = st.state || g.state;
        g.completed = !!st.completed;
        g.detail = st.shortDetail || g.detail;
        g.clock = (hdr.status && hdr.status.displayClock) || g.clock;
        g.period = hdr.status && hdr.status.period;
      }
    } catch (e) {}
    paintGame(g, sum);
  }
  function openGame(id) {
    OPEN_ID = String(id);
    showView("game");
    $("gameRoom").innerHTML = "<p class='hint'>Loading game…</p>";
    loadGame(id);
    if (pollGame) clearInterval(pollGame);
    pollGame = setInterval(() => { if (OPEN_ID) loadGame(OPEN_ID); }, 20000);
  }
  window.openGame = openGame;

  async function pullInjuries() {
    const res = await fetch(INJ_URL, { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    const out = {};
    (data.injuries || []).forEach((team) => {
      (team.injuries || []).forEach((x) => {
        const name = x.athlete && x.athlete.displayName;
        const st = x.status || "";
        if (!name || st === "Active") return;
        out[name] = { status: st, note: (x.shortComment || "").slice(0, 140), date: x.date || "" };
      });
    });
    window.INJ = out;
    if (typeof render === "function" && VIEW === "research") render();
  }

  async function tick() {
    try { await pullScores(); }
    catch (e) {
      const host = $("liveList");
      if (host) host.innerHTML = `<p class="hint">Could not load slate (${e.message})</p>`;
    }
  }

  document.querySelectorAll("[data-nav]").forEach((b) => {
    b.addEventListener("click", () => showView(b.dataset.nav));
  });
  showView("live");
  tick();
  pullInjuries().catch(() => {});
  setInterval(tick, 30000);
  setInterval(() => pullInjuries().catch(() => {}), 15 * 60 * 1000);
})();

</script>
</body></html>
