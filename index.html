<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#05060a"/>
<title>Sports Sauce</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;700;800&display=swap");
:root{--bg:#05060a;--orange:#ff7a18;--ember:#ffc46b;--live:#ff3b3b;--text:#f7f2ea;--muted:#9b9288;--pad:clamp(12px,3vw,20px)}
*{box-sizing:border-box}html,body{margin:0;background:#05060a;color:var(--text);font-family:Manrope,system-ui,sans-serif}
body{min-height:100dvh;width:min(1120px,100%);margin:0 auto}
.top{padding:var(--pad);background:linear-gradient(90deg,#2a1408,#05060a 55%);border-bottom:2px solid var(--orange)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.mark{width:36px;height:36px;border-radius:8px;background:var(--orange);color:#120800;font-family:"Bebas Neue",sans-serif;font-size:22px;display:grid;place-items:center}
h1{margin:0;font-family:"Bebas Neue",sans-serif;letter-spacing:.04em}
.eyebrow{margin:0;color:var(--ember);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
.hero{padding:22px var(--pad) 8px;position:relative}
.hero h2{font-family:"Bebas Neue",sans-serif;font-size:clamp(32px,8vw,56px);line-height:.95;margin:8px 0 10px;letter-spacing:.01em}
.kicker{letter-spacing:.2em;text-transform:uppercase;font-size:10px;color:var(--orange);font-weight:800}
.lede{color:var(--muted);margin:0}
.hits{margin-top:14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none}
.hits b{color:var(--orange);font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:.04em}
.ownwrap{padding:8px var(--pad) 36px}
.owncard{background:#101218;border:1px solid #2a241c;border-radius:12px;padding:14px;margin:0 0 12px}
.owncard h3{margin:0 0 10px;font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:.04em;color:var(--orange)}
.owngrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ownstat{background:#0c0d12;border:1px solid #241e18;border-radius:8px;padding:10px}
.ownstat b{display:block;font-family:"Bebas Neue",sans-serif;font-size:26px;color:#fff}
.ownstat span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ownlog{max-height:46vh;overflow:auto;font-size:12px}
.ownrow{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #221e18}
.ownrow em{font-style:normal;color:var(--ember);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.ownlock{display:flex;gap:8px;margin-top:10px}
.ownlock input{flex:1;background:#0c0d12;border:1px solid #3a3228;color:#fff;padding:10px;border-radius:8px}
.ownlock button,.ownbtn{border:0;background:var(--orange);color:#140800;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:10px 14px;border-radius:8px}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px var(--pad) 32px}
.hubcard{text-align:left;padding:18px;border-radius:16px;border:1px solid rgba(255,122,24,.3);background:#120e0c;color:#fff}
.hubcard img{width:40px;height:40px;object-fit:contain;margin-bottom:8px}
.hubcard b{display:block;font-family:"Bebas Neue",sans-serif;font-size:28px}
.hubcard span{color:#c9c2b8;font-size:12px}
.hubcard.tssaa img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:10px;padding:6px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px var(--pad) 4px}
.bar .barleft{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.bar .tabs{display:flex;flex-wrap:nowrap;align-items:center;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar .tabs::-webkit-scrollbar{display:none}
.back{border:0;background:0;color:var(--orange);font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:0;font-size:12px}
.tabbtn{border:0;background:0;color:#8a8378;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:11px;padding:6px 8px;white-space:nowrap}
.tabbtn.on{color:var(--orange)}
.meta{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.list{display:grid;gap:10px;padding:0 var(--pad) 24px}
.gcard{display:block;width:100%;text-align:left;color:inherit;font:inherit;background:#101218;border:1px solid #2a241c;border-radius:8px;padding:12px}
.gcard.live{border-color:#ff3b3b;background:#160e0c}
.gcard.pin{border-color:var(--orange);box-shadow:inset 3px 0 0 var(--orange)}
.star{border:0;background:0;color:#5c564e;font-size:16px;line-height:1;padding:0 2px;cursor:pointer}
.star.on{color:var(--orange)}
.gcard .bigline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:6px 0 4px}
.gcard .nm{font-family:"Bebas Neue",sans-serif;font-size:20px;display:flex;align-items:center;gap:8px}
.gcard .nm.r{justify-content:flex-end}
.gcard .sc{display:flex;align-items:center;justify-content:center;gap:10px;font-family:"Bebas Neue",sans-serif;font-size:36px;line-height:1;color:#fff}
.gcard .sc em{font-style:normal;min-width:1.15em;text-align:center}
.gcard .sc span{font-size:20px;color:#6a645c}
.gcard.live .sc em{color:var(--orange)}
.gcard .sub{font-size:12px;color:#c9c2b8;margin-top:6px;line-height:1.4}
.gcard .sub b{color:var(--ember)}
.ufc-row{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr);align-items:start;gap:4px 8px;padding:4px 0 8px}
.ufc-row .f{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0;width:100%;position:relative}
.ufc-row .f .star{position:absolute;top:0;left:0;z-index:2}
.ufc-row .f.r .star{left:auto;right:0}
.ufc-row img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid #3a2a18;background:#1a120c;flex:none;margin-top:4px}
.ufc-row b{display:block;font-size:14px;line-height:1.2;white-space:normal;overflow-wrap:anywhere;word-break:break-word;max-width:100%;margin-top:2px}
.ufc-row em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.ufc-row .vs{align-self:center;font-family:"Bebas Neue",sans-serif;letter-spacing:.12em;color:var(--ember);font-size:18px;padding-top:28px;text-align:center}
.ufight{position:relative;overflow:hidden}
.ufight.live{border-color:#ff3b3b;background:linear-gradient(180deg,#2a0c0c,#101218)}
.uhero{margin:0 0 12px;padding:16px 14px 14px;border-radius:14px;border:1px solid rgba(255,122,24,.45);background:linear-gradient(160deg,#3a1608 0%,#120c0a 55%,#05060a 100%)}
.uhero .kicker{margin:0 0 6px}
.uhero h2{margin:0 0 6px;font-family:"Bebas Neue",sans-serif;font-size:clamp(28px,8vw,44px);line-height:.95;letter-spacing:.02em}
.uhero p{margin:0;color:#c9c2b8;font-size:13px}
.ustats{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;margin:12px var(--pad);padding:12px;background:#101218;border:1px solid #2a241c;border-radius:10px}
.ustats .uh{text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ustats .uv{font-family:"Bebas Neue",sans-serif;font-size:26px;text-align:center;line-height:1}
.ustats .ul{text-align:left}.ustats .ur{text-align:right}
.ubars{margin:0 var(--pad) 14px}
.ubar{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;margin:6px 0;font-size:11px;color:var(--muted)}
.ubar i{display:block;height:8px;border-radius:99px;background:#1a1b22;overflow:hidden}
.ubar i b{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--ember));width:50%}
.livepulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 8px #ff3b3b;margin-right:6px;animation:upulse 1.2s ease-in-out infinite}
@keyframes upulse{50%{opacity:.35}}
.gstat{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.gduo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.gteam{display:flex;align-items:center;gap:8px;font-family:"Bebas Neue",sans-serif;font-size:20px}
.gteam.right{justify-content:flex-end}
.logoplate{width:36px;height:36px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex:none;box-shadow:0 0 0 1px #fff}
.logoplate img{width:28px;height:28px;object-fit:contain;background:transparent}
.gcard .nm{font-size:15px;line-height:1.15;flex-wrap:wrap}
.gcard.tncard .bigline{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:start}
.gcard.tncard .nm{display:flex;flex-direction:row;align-items:flex-start;gap:4px;min-width:0;flex-wrap:nowrap;font-size:18px;letter-spacing:.02em;line-height:1.08}
.gcard.tncard .nm .who{min-width:0;flex:1}
.gcard.tncard .nm span{display:block;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.gcard.tncard .nm em{display:block;font-family:Manrope,sans-serif;font-style:normal;font-size:11px;letter-spacing:.06em;margin-top:3px;color:#9a9388}
.gcard.tncard .nm.r{text-align:right;justify-content:flex-end}
.gcard.tncard .nm.r .who{text-align:right}
.gcard.tncard .sc{font-size:34px;padding-top:2px;align-self:center}
.regcut{margin:10px 0 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8a8478}
.rknum{font-family:"Bebas Neue",sans-serif;font-size:14px;letter-spacing:.06em;color:var(--orange);flex:none}
.pills{display:flex;gap:6px;overflow:auto;padding:8px var(--pad) 4px;scrollbar-width:none}
.pills button{flex:none;border:1px solid #2a241c;background:#101218;color:#cfc6b8;padding:7px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.pills button.on{background:var(--orange);color:#140800;border-color:var(--orange)}
.pollgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:8px var(--pad) 24px}
@media(max-width:800px){.pollgrid{grid-template-columns:1fr}}
.pollcol h3{margin:0 0 10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}
.standwrap{padding:8px var(--pad) 28px}
.divblock{margin:0 0 22px}
.divblock h3{margin:0 0 8px;font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:.04em;color:var(--orange)}
.srow{display:grid;grid-template-columns:22px 28px 1fr 52px 36px 36px 44px 36px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #221e18;font-size:13px}
.srow.head{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #3a2a18}
.srow img{width:24px;height:24px;object-fit:contain;background:#fff;border-radius:50%;padding:2px;cursor:pointer}
.srow .seed{color:var(--ember);font-weight:800}
.srow .clin{color:var(--orange);font-size:11px;font-weight:800}
.playoffbox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 18px}
@media(max-width:560px){.playoffbox{grid-template-columns:1fr}.srow{grid-template-columns:20px 24px 1fr 48px 28px 28px 40px}}
.pollrow{display:grid;grid-template-columns:28px 36px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #221e18;cursor:pointer}
.pollrow:hover{background:#16120e}
.oddsdesk{padding:8px 0 0}
.oddspeek{margin-top:10px;padding-top:8px;border-top:1px solid #221e18;font-size:11px;letter-spacing:.04em;color:#8a8378;line-height:1.45}
.oddspeek b{color:#c9c2b8;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:10px;margin-right:6px}
.gameodds{margin:8px var(--pad) 12px;padding:12px;background:#101218;border:1px solid #2a241c;border-radius:10px}
.gameodds .hint{margin:0 0 8px}
.oddstrip{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;align-items:center;padding:5px 0;border-top:1px solid #221c16}
.oddstrip b{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ember)}
.side{display:flex;align-items:center;gap:6px;min-width:0}
.side .who{border:1px solid #3a2a18;background:#14110e;color:#e8e0d4;font-size:11px;font-weight:800;padding:6px 8px;border-radius:4px;white-space:nowrap}
.side .who.on,.side .who:hover{border-color:var(--orange);color:var(--orange)}
.step{display:flex;align-items:center;border:1px solid #3a2a18;border-radius:4px;overflow:hidden;background:#0c0d12;flex:1;min-width:0}
.step button{border:0;background:#1a1612;color:var(--orange);width:26px;height:28px;font-size:15px;font-weight:800;flex:0 0 26px}
.step input{flex:1;min-width:0;width:52px;background:transparent;border:0;color:#fff;text-align:center;font-size:13px;font-weight:800;padding:5px 2px}
.daycut{margin:16px 0 8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);border-bottom:1px solid #3a2a18;padding-bottom:6px}
.tbook{padding:0 var(--pad) 28px}
.tsk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tsk i{display:block;font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tsk b{display:block;font-family:"Bebas Neue",sans-serif;font-size:26px;color:var(--orange)}
.tgame{display:grid;grid-template-columns:72px 28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #221e18}
.tgame .dec{font-family:"Bebas Neue",sans-serif;font-size:22px}
.tgame .dec.W{color:#3ee0a0}.tgame .dec.L{color:#ff8a8a}
.tgame button{border:0;background:0;color:inherit;font:inherit;text-align:left;padding:0}
.sgrp{margin:16px 0 8px}
.sgrp h3{margin:0 0 8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:640px){.sgrid{grid-template-columns:repeat(2,1fr)}}
.sgrid div{background:#101218;border:1px solid #2a241c;padding:10px 8px}
.sgrid i{display:block;font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sgrid b{display:block;font-family:"Bebas Neue",sans-serif;font-size:24px;color:#fff;margin-top:2px}
.ptable{width:100%;border-collapse:collapse;font-size:12px;margin:0 0 18px;table-layout:auto}
.ptable th{text-align:right;font-size:10px;letter-spacing:.08em;color:var(--muted);padding:8px 6px;border-bottom:1px solid #2a241c;white-space:nowrap}
.ptable th:first-child,.ptable td:first-child{text-align:left;min-width:128px;max-width:42%;padding-right:12px}
.ptable td{padding:8px 4px;border-bottom:1px solid #1c1814;color:#e8e0d4;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ptable tr.tot td{color:var(--orange);font-weight:700}
.ptable .nm{display:flex;flex-direction:column}
.ptable .nm b{font-size:12px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px;display:block}
.ptable .nm em{font-size:10px;color:var(--muted)}
.tlead{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 18px}
@media(max-width:640px){.tlead{grid-template-columns:repeat(2,1fr)}.ptable{font-size:11px}}
.tlead div{background:#101218;border:1px solid #2a241c;padding:10px;display:flex;gap:8px;align-items:center}
.tlead img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#222}
.tlead i{display:block;font-style:normal;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tlead b{font-family:"Bebas Neue",sans-serif;font-size:22px}
.pollrow b.rk{font-size:18px}
.pollrow img{width:32px;height:32px;object-fit:contain}
.pollrow em{font-style:normal;color:var(--muted);font-size:11px}
.ldhead{display:flex;gap:6px;padding:8px var(--pad);overflow:auto}
.ldhead button{flex:none;border:1px solid #2a241c;background:#101218;color:#cfc6b8;padding:8px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.ldhead button.on{background:var(--orange);color:#140800;border-color:var(--orange)}
.ltable{padding:0 var(--pad) 28px}
.ltable h3{margin:18px 0 8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}
.lrow{display:grid;grid-template-columns:28px 40px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #221e18}
.lrow img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#1a120c}
.lrow b{display:block;font-size:14px}
.lrow em{font-style:normal;font-size:11px;color:var(--muted)}
.lrow .val{font-family:"Bebas Neue",sans-serif;font-size:22px;color:var(--orange);text-align:right;white-space:nowrap;min-width:52px}
.vs{color:var(--muted);font-size:11px;font-weight:800}
.linechip{margin-top:8px;color:var(--ember);font-size:13px}
.hint{color:var(--muted);padding:0 var(--pad)}
.scorebug{margin:0 var(--pad) 16px;padding:12px;background:#101218;border:1px solid #3a2a18}
.mlb-bug{background:linear-gradient(180deg,#1a140c,#0c0d12);border-color:#ff7a18;padding:16px}
.mlb-inning{font-family:"Bebas Neue",sans-serif;font-size:22px;color:var(--orange);letter-spacing:.04em}
.mlb-score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:10px}
.mlb-side{display:flex;flex-direction:column;gap:2px}
.mlb-side.r{text-align:right}
.mlb-side em{font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mlb-side b{font-family:"Bebas Neue",sans-serif;font-size:42px;line-height:1;color:#fff}
.bases{display:flex;gap:8px;justify-content:center;margin-top:12px}
.bag{width:14px;height:14px;transform:rotate(45deg);background:#2a241c;border:1px solid #3a2a18}
.bag.on{background:var(--orange);border-color:var(--ember)}
.outs{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
tr.prow{cursor:pointer}tr.prow:hover td{background:#1a140c}
.rhe{margin-top:12px}
.ab{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:#efe6d8}
.abline{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:12px}
.abcard{display:flex;align-items:center;gap:8px}
.abcard.r{justify-content:flex-end;text-align:right}
.abcard img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#1a120c}
.abcard em{display:block;font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ember)}
.countline{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2a241c;margin-left:3px}
.dot.on{background:#3dbb5a}
.dot.red.on{background:#ff4d4d}
.diamondmini{display:flex;flex-direction:column;align-items:center;gap:4px}
.diamondmini span{display:flex;gap:10px}
.wpbar{position:relative;height:7px;margin:14px 0 18px;background:#222;border-radius:99px}
.wpbar i{display:block;height:100%;background:var(--orange);margin-left:auto}
.wpbar em{position:absolute;top:10px;font-size:10px;color:var(--muted);font-style:normal;letter-spacing:.08em;text-transform:uppercase}
.wpbar em:first-of-type{left:0}.wpbar em:last-of-type{right:0}
.play.hot{border-color:var(--orange)}
.box{margin:0 var(--pad) 16px;background:#101218;border:1px solid #2a241c;overflow:auto}
.box h3{margin:0;padding:10px 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
table.bx{width:100%;border-collapse:collapse;font-size:12px}
table.bx th,table.bx td{padding:7px 8px;border-top:1px solid #1c1c22;text-align:left}
table.bx th{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.play{margin:0 var(--pad) 8px;padding:10px 12px;background:#101218;border:1px solid #222}
.play span{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}

<script>
const URLS = {
  nfl: "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",
  cfb: "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=80",
  mlb: "https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard",
  ufc: "https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard",
  mls: "https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard"
};
const SUM = {
  nfl: id => "https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/summary?event="+id,
  cfb: id => "https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/summary?event="+id,
  mlb: id => "https://site.web.api.espn.com/apis/site/v2/sports/baseball/mlb/summary?event="+id,
  ufc: id => "https://site.web.api.espn.com/apis/site/v2/sports/mma/ufc/summary?event="+id,
  mls: id => "https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/summary?event="+id
};
let LEAGUE = "nfl";
let GAMES = [];
let OPEN = null;
let poll = null;
let slateT = null;
const $ = id => document.getElementById(id);
function show(name){
  $("viewHome").hidden = name!=="home";
  $("viewLive").hidden = name!=="live";
  $("viewGame").hidden = name!=="game";
  if($("viewPlayer")) $("viewPlayer").hidden = name!=="player";
  if($("viewOwner")) $("viewOwner").hidden = name!=="owner";
  window.scrollTo(0,0);
  if(window.trackUse) window.trackUse("view", name);
}
function face(comp, lg){
  if(lg==="ufc" && comp && comp.id)
    return "https://a.espncdn.com/i/headshots/mma/players/full/"+comp.id+".png";
  const t = (comp && comp.team) || {};
  if(t.logo) return t.logo;
  if(t.logos && t.logos[0] && t.logos[0].href) return t.logos[0].href;
  const ab = (t.abbreviation||"").toLowerCase();
  if(lg==="mlb") return "https://a.espncdn.com/i/teamlogos/mlb/500/"+ab+".png";
  if(lg==="mls" && t.id) return "https://a.espncdn.com/i/teamlogos/soccer/500/"+t.id+".png";
  if(lg==="cfb" && t.id) return "https://a.espncdn.com/i/teamlogos/ncaa/500/"+t.id+".png";
  return "https://a.espncdn.com/i/teamlogos/nfl/500/"+ab+".png";
}
function nameOf(comp){
  if(!comp) return "";
  if(comp.athlete) return comp.athlete.displayName || comp.athlete.shortName || "";
  const t=comp.team||{};
  return t.abbreviation || t.shortDisplayName || t.displayName || "";
}
function scoreOf(comp){
  if(!comp || comp.score==null) return "";
  return String(comp.score.displayValue != null ? comp.score.displayValue : comp.score);
}
function packOdds(c){
  const o=((c&&c.odds)||[])[0]||{};
  const close=x=>(x&&x.close)||{};
  const ml=o.moneyline||{}, ps=o.pointSpread||{}, tot=o.total||{};
  const num=v=>{
    const n=parseFloat(String(v||"").replace(/[^+.\d-]/g,""));
    return Number.isFinite(n)?n:null;
  };
  const awaySp=close(ps.away).line || (o.spread!=null?((o.awayTeamOdds&&o.awayTeamOdds.favorite)?("-"+Math.abs(o.spread)):("+"+Math.abs(o.spread))):"");
  const homeSp=close(ps.home).line || (o.spread!=null?((o.homeTeamOdds&&o.homeTeamOdds.favorite)?("-"+Math.abs(o.spread)):("+"+Math.abs(o.spread))):"");
  return {
    details: o.details||"",
    ou: o.overUnder!=null?Number(o.overUnder):num(close(tot.over).line),
    awaySp: awaySp||"",
    homeSp: homeSp||"",
    awayML: close(ml.away).odds||"",
    homeML: close(ml.home).odds||"",
    overOdds: close(tot.over).odds||"",
    underOdds: close(tot.under).odds||""
  };
}
function mapComp(ev, lg){
  const rows = [];
  const fights = ev.competitions || [{}];
  const list = (lg==="ufc") ? fights : fights.slice(0,1);
  list.forEach((c,i)=>{
    const comps = c.competitors || [];
    let home = comps.find(x=>x.homeAway==="home");
    let away = comps.find(x=>x.homeAway==="away");
    if(!home && !away && comps.length>=2){ away=comps[0]; home=comps[1]; }
    home=home||{}; away=away||{};
    const st=((c.status||{}).type)||{};
    const rec = x => ((x.records||[])[0]&&(x.records||[])[0].summary) || "";
    rows.push({
      id: String(c.id || ev.id || "") + (lg==="ufc" && i ? "-"+i : ""),
      eventId: String(ev.id||c.id||""),
      fightId: String(c.id||""),
      awayId: String(away.id||""), homeId: String(home.id||""),
      away: ((away.team&&(away.team.displayName||away.team.shortDisplayName))||nameOf(away)),
      home: ((home.team&&(home.team.displayName||home.team.shortDisplayName))||nameOf(home)),
      awayAb: (away.team && away.team.abbreviation) || nameOf(away),
      homeAb: (home.team && home.team.abbreviation) || nameOf(home),
      awayImg: face(away,lg), homeImg: face(home,lg),
      awayScore: scoreOf(away), homeScore: scoreOf(home),
      awayRec: rec(away), homeRec: rec(home),
      awayWin: !!away.winner, homeWin: !!home.winner,
      venue: (c.venue && (c.venue.fullName||c.venue.displayName)) || "",
      card: ev.shortName || ev.name || "",
      format: (c.format && c.format.regulation && (c.format.regulation.displayName || (c.format.regulation.periods? (c.format.regulation.periods+" rd"):""))) || "",
      rounds: Number((c.format && c.format.regulation && c.format.regulation.periods) || 3),
      weight: (c.type && (c.type.text || c.type.abbreviation)) || "",
      state: st.state || (st.completed?"post":"pre"),
      detail: st.detail || st.shortDetail || "",
      start: c.startDate || ev.date || c.date || "",
      broadcast: ((c.broadcasts||[])[0] && ((c.broadcasts||[])[0].names||[])[0]) || c.broadcast || "",
      lastPlay: ((c.situation||{}).lastPlay && (c.situation.lastPlay.text)) || "",
      down: (c.situation && (c.situation.downDistanceText || c.situation.shortDownDistanceText)) || "",
      possId: String((c.situation && c.situation.possession) || ""),
      red: !!(c.situation && c.situation.isRedZone),
      balls: c.situation && c.situation.balls,
      strikes: c.situation && c.situation.strikes,
      outs: c.situation && c.situation.outs,
      pitcher: (c.situation && c.situation.pitcher && c.situation.pitcher.athlete && (c.situation.pitcher.athlete.shortName||c.situation.pitcher.athlete.displayName)) || "",
      pitcherLine: (c.situation && c.situation.pitcher && c.situation.pitcher.summary) || "",
      batter: (c.situation && c.situation.batter && c.situation.batter.athlete && (c.situation.batter.athlete.shortName||c.situation.batter.athlete.displayName)) || "",
      awaySP: (function(){ const p=(away.probables||[])[0]; if(!p||!p.athlete) return ""; return (p.athlete.shortName||p.athlete.displayName||"")+(p.record?(" "+p.record):""); })(),
      homeSP: (function(){ const p=(home.probables||[])[0]; if(!p||!p.athlete) return ""; return (p.athlete.shortName||p.athlete.displayName||"")+(p.record?(" "+p.record):""); })(),
      awayRank: Number((away.curatedRank&&away.curatedRank.current)||99),
      homeRank: Number((home.curatedRank&&home.curatedRank.current)||99),
      awayConf: String((away.team&&away.team.conferenceId)||""),
      homeConf: String((home.team&&home.team.conferenceId)||""),
      odds: packOdds(c)
    });
  });
  return rows;
}
function when(g){
  if(g.state==="in") return "LIVE · " + (g.detail||"");
  if(g.state==="post") return g.detail || "Final";
  try{
    return new Date(g.start).toLocaleString("en-US",{timeZone:"America/Chicago",weekday:"short",hour:"numeric",minute:"2-digit"});
  }catch(e){ return g.detail||""; }
}
const CONF = [
  ["all","All"],["top25","Top 25"],["8","SEC"],["5","Big Ten"],["1","ACC"],["4","Big 12"],["9","Pac-12"],["151","American"],["17","MWC"],["15","MAC"],["12","C-USA"],["37","Sun Belt"],["18","Ind."]
];
let CFB_FILT = "all";
function rankChip(r){
  r=Number(r);
  return (r>0 && r<=25) ? `<span class="rknum">#${r}</span>` : "";
}
function filterCfb(games){
  if(LEAGUE!=="cfb" || CFB_FILT==="all") return games;
  if(CFB_FILT==="top25"){
    return games.filter(g=>g.awayRank<=25||g.homeRank<=25).slice().sort((a,b)=>Math.min(a.awayRank,a.homeRank)-Math.min(b.awayRank,b.homeRank));
  }
  return games.filter(g=>g.awayConf===CFB_FILT||g.homeConf===CFB_FILT);
}
function paintCfbPills(){
  const host=$("cfbPills");
  if(!host) return;
  host.hidden = LEAGUE!=="cfb" || (window.BOARD && window.BOARD!=="slate");
  if(LEAGUE!=="cfb") return;
  host.innerHTML = CONF.map(([id,lab])=>`<button type="button" data-cf="${id}" class="${CFB_FILT===id?"on":""}">${lab}</button>`).join("");
  host.querySelectorAll("[data-cf]").forEach(b=>b.onclick=()=>{ CFB_FILT=b.dataset.cf; paint(GAMES); });
}
const ODDS_DRAFT = {};
function draftKey(g){ return String(g.eventId||g.fightId||""); }
function signed(n){
  const v=Number(n);
  if(!Number.isFinite(v)) return String(n||"");
  return (v>0?"+":"")+v;
}
function sideCell(g, kind, side, label, posted, step){
  const key=draftKey(g)+":"+kind+":"+side;
  const saved=ODDS_DRAFT[key];
  const val = saved!=null && saved!=="" ? saved : (posted!=null && posted!=="" ? posted : "");

function oddsTape(g, mode){

      `ML ${a} · ${h}`,
      (o.ou!=null && o.ou!=="")?("O/U "+o.ou):""

    ${mlPick}
    <div class="oddstrip"><b>O/U</b>${sideCell(g,"ou","over","Over",o.ou!=null?o.ou:"",0.5)}${sideCell(g,"ou","under","Under",o.ou!=null?o.ou:"",0.5)}</div>

function bumpVal(inp, delta, kind){
  if(kind==="ml"){
    const n=parseInt(String(inp.value||"0").replace(/[^+.\d-]/g,""),10);
    const base=Number.isFinite(n)?n:100;
    const next=base+delta;
    inp.value = next>0?("+"+next):String(next);
    return;
  }
  const n=parseFloat(String(inp.value||"0"));
  const base=Number.isFinite(n)?n:0;
  const next=Math.round((base+delta)*2)/2;
  inp.value = kind==="spread" ? signed(next) : String(next);
}
function bindOdds(root, findGame){
  if(!root) return;
  root.querySelectorAll(".oddsdesk,[data-stop]").forEach(row=>{
    row.onclick=e=>e.stopPropagation();

      ["click","pointerdown","focus","touchstart"].forEach(ev=>inp.addEventListener(ev,e=>e.stopPropagation(),true));
      inp.addEventListener("input",()=>{ if(inp.dataset.dkey) ODDS_DRAFT[inp.dataset.dkey]=inp.value; });
    });
    row.querySelectorAll("[data-bump]").forEach(b=>b.onclick=e=>{
      e.preventDefault(); e.stopPropagation();
      const box=b.closest(".side");
      const inp=box && box.querySelector("input");
      if(!inp) return;
      bumpVal(inp, Number(b.dataset.bump), box.dataset.kind);
      if(inp.dataset.dkey) ODDS_DRAFT[inp.dataset.dkey]=inp.value;
      box.querySelector(".who") && box.querySelector(".who").classList.add("on");
    });
    row.querySelectorAll("[data-use-posted]").forEach(b=>b.onclick=e=>{
      e.preventDefault(); e.stopPropagation();
      const box=b.closest(".side");
      box.querySelector(".who") && box.querySelector(".who").classList.add("on");
    });
    row.querySelectorAll("[data-track]").forEach(b=>b.onclick=e=>{

function boardDates(){
  const fmt=d=>d.toLocaleString("en-CA",{timeZone:"America/Chicago"}).slice(0,10).replace(/-/g,"");
  const now=new Date();
  const out=[];
  for(let i=-3;i<=0;i++) out.push(fmt(new Date(now.getTime()+i*86400000)));
  return out;
}
function chiDay(iso){
  try{ return new Date(iso).toLocaleString("en-CA",{timeZone:"America/Chicago"}).slice(0,10); }
  catch(e){ return ""; }
}
function dayCut(k){
  const today=new Date().toLocaleString("en-CA",{timeZone:"America/Chicago"}).slice(0,10);
  const yest=new Date(Date.now()-86400000).toLocaleString("en-CA",{timeZone:"America/Chicago"}).slice(0,10);
  if(k===today) return "Today · "+new Date().toLocaleDateString("en-US",{timeZone:"America/Chicago",weekday:"long"});
  if(k===yest) return "Yesterday";
  const tmr=new Date(Date.now()+86400000).toLocaleString("en-CA",{timeZone:"America/Chicago"}).slice(0,10);
  if(k===tmr) return "Tomorrow";
  try{
    const [y,m,d]=k.split("-").map(Number);
    return new Date(y,m-1,d).toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
  }catch(e){ return k; }
}
async function pullScoreboard(lg){
  const base=URLS[lg];
  if(lg!=="mlb" && lg!=="mls"){
    const res=await fetch(base,{cache:"no-store"});
    if(!res.ok) throw new Error("ESPN "+res.status);
    return (await res.json()).events||[];
  }
  const evs=[], seen=new Set();
  for(const day of boardDates()){
    try{
      const res=await fetch(base+(base.includes("?")?"&":"?")+"dates="+day,{cache:"no-store"});
      if(!res.ok) continue;
      ((await res.json()).events||[]).forEach(ev=>{
        if(seen.has(ev.id)) return;
        seen.add(ev.id);
        evs.push(ev);
      });
    }catch(e){}
  }
  if(evs.length) return evs;
  const res=await fetch(base,{cache:"no-store"});
  if(!res.ok) throw new Error("ESPN "+res.status);
  return (await res.json()).events||[];
}
function tnDateLabel(mdy){
  try{
    const [m,d,y]=mdy.split("-").map(Number);
    const dt=new Date(y,m-1,d);
    const today=new Date().toLocaleString("en-CA",{timeZone:"America/Chicago"}).slice(0,10);
    const key=dt.toLocaleString("en-CA",{timeZone:"America/Chicago"}).slice(0,10);
    const wd=dt.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
    if(key===today) return "Today · "+wd;
    return wd;
  }catch(e){ return mdy; }
}

function ufcStatPack(json){
  const out={};
  ((((json||{}).splits||{}).categories)||[]).forEach(cat=>{
    (cat.stats||[]).forEach(s=>{ out[s.name]=s.displayValue!=null?s.displayValue:s.value; });
  });
  return out;
}
function ufcBar(a,b,label){
  const x=Number(a)||0, y=Number(b)||0, t=x+y;
  const pct=t?Math.round(100*x/t):50;
  return `<div class="ubar"><span>${x}</span><i title="${label}"><b style="width:${pct}%"></b></i><span>${y}</span></div>`;
}

async function fetchUfcLive(g){
  const pack={clock:when(g), away:null, home:null};
  if(!g.eventId || !g.fightId) return pack;
  try{
    const evs=await pullScoreboard("ufc");
    const rows=evs.flatMap(ev=>mapComp(ev,"ufc"));
    const live=rows.find(x=>String(x.fightId)===String(g.fightId))||g;
    Object.assign(g, live);
    pack.clock=when(live);
  }catch(e){}
  if(g.state==="pre") return pack;
  try{
    const [ar,hr]=await Promise.all([
      g.awayId?fetch("https://sports.core.api.espn.com/v2/sports/mma/leagues/ufc/events/"+g.eventId+"/competitions/"+g.fightId+"/competitors/"+g.awayId+"/statistics",{cache:"no-store"}):Promise.resolve(null),
      g.homeId?fetch("https://sports.core.api.espn.com/v2/sports/mma/leagues/ufc/events/"+g.eventId+"/competitions/"+g.fightId+"/competitors/"+g.homeId+"/statistics",{cache:"no-store"}):Promise.resolve(null)
    ]);
    if(ar && ar.ok) pack.away=ufcStatPack(await ar.json());
    if(hr && hr.ok) pack.home=ufcStatPack(await hr.json());
  }catch(e){}
  return pack;
}
function renderFight(g){
  paintFightShell(g);
  loadFightHistory(g.awayId, g.away, "histA");
  loadFightHistory(g.homeId, g.home, "histB");
  const fid=String(g.fightId||g.id||"");
  async function tickFight(){
    if(String(OPEN)!==fid && String(OPEN)!==String(g.eventId||"") && String(OPEN)!==String(g.id||"")) return;
    const extra=await fetchUfcLive(g);
    paintFightShell(g, extra);
    if(g.state==="post"){ if(poll){ clearInterval(poll); poll=null; } }
  }
  if(poll) clearInterval(poll);
  poll=setInterval(tickFight, 8000);
  if(g.state==="in") tickFight();
}
async function loadFightHistory(aid, name, hostId){
  const write = html => { const host=$(hostId); if(host) host.innerHTML=html; };
  if(!aid){ write("<div class='box'><h3>"+(name||"Fighter")+" · history</h3><p class='hint'>No ESPN id for this fighter.</p></div>"); return; }
  try{
    const res=await fetch("https://site.web.api.espn.com/apis/common/v3/sports/mma/ufc/athletes/"+aid,{cache:"no-store"});
    if(!res.ok) throw new Error("ESPN "+res.status);
    const data=await res.json();
    const keys=data.events||[];
    const map=data.eventsMap||{};
    const rows=keys.map(uid=>{
      const e=map[uid]; if(!e) return "";
      const st=e.status||{};
      const method=(st.result&&(st.result.shortDisplayName||st.result.displayName))||"";
      const rnd=st.period?("R"+st.period+(st.displayClock?(" "+st.displayClock):"")):"";
      const opp=(e.opponent&&e.opponent.displayName)||"—";
      const wr=e.gameResult||"";
      const tag = wr==="W" ? "<span class='chipwin'>W</span>" : wr==="L" ? "<span class='chiploss'>L</span>" : "—";
      const dt=(e.gameDate||"").slice(0,10);
      const title=e.titleFight?" <span class='titlechip'>Title</span>":"";
      return "<tr><td>"+dt+"</td><td>"+(e.shortName||e.name||"")+" "+title+"</td><td>"+opp+"</td><td>"+method+(rnd?(" · "+rnd):"")+"</td><td>"+tag+"</td></tr>";
    }).filter(Boolean);
    if(!rows.length){ write("<div class='box'><h3>"+name+" · history</h3><p class='hint'>No ESPN history posted yet.</p></div>"); return; }
    const w=rows.filter(x=>x.indexOf("chipwin")>=0).length, l=rows.filter(x=>x.indexOf("chiploss")>=0).length;
    write("<div class='box'><h3>"+name+" · "+rows.length+" fights · "+w+"-"+l+" on ESPN</h3><table class='bx'><thead><tr><th>Date</th><th>Event</th><th>Opp</th><th>Method</th><th></th></tr></thead><tbody>"+rows.join("")+"</tbody></table></div>");
  }catch(e){
    write("<div class='box'><h3>"+name+" · history</h3><p class='hint'>Could not load history. "+(e.message||"")+"</p></div>");
  }
}
async function openGame(id, fid){
  OPEN = String(fid||id||"");
  if(window.trackUse) window.trackUse("game", (LEAGUE||"")+" "+String(id||fid||""));
  if(poll){ clearInterval(poll); poll=null; }
  show("game");
  $("gameRoom").innerHTML = "<p class='hint'>Opening…</p>";
  const pool = window.LIVE_GAMES||GAMES||[];
  const g = LEAGUE==="ufc"
    ? (pool.find(x => String(x.fightId)===String(fid||id) || String(x.id)===String(id) || String(x.eventId)===String(id)) || {})
    : (pool.find(x => x.eventId===id) || {});
  if(LEAGUE==="ufc"){
    if(!g.away && !g.home){
      $("gameRoom").innerHTML = "<p class='hint'>Could not match that bout. Back out and tap it again.</p>";
      return;
    }
    renderFight(g);
    return;
  }
  async function tickGame(){
    if(OPEN!==id) return;
    try{
      const res = await fetch(SUM[LEAGUE](id), {cache:"no-store"});
      const sum = res.ok ? await res.json() : {};
      if(LEAGUE==="mls"){
        window.MLS_PLAYS=window.MLS_PLAYS||{};
        window.MLS_PLAYS[id]=await loadMlsPlays(id);
      }
      renderGame(g, sum);
      const state = ((((sum.header||{}).competitions||[])[0]||{}).status||{}).type || {};
      if(state.completed || state.state==="post"){ if(poll) clearInterval(poll); poll=null; }
    }catch(e){
      $("gameRoom").innerHTML = "<p class='hint'>Could not open game. "+(e.message||"")+"</p>";
    }
  }
  await tickGame();
  poll = setInterval(tickGame, 12000);
}

    const af=isFav(a.awayId)||isFav(a.homeId);
    const bf=isFav(b.awayId)||isFav(b.homeId);

async function loadUfcRankings(){
  const host=$("ufcRanks");
  if(!host) return;
  const ids={};
  (window.LIVE_GAMES||[]).forEach(g=>{ if(g.away) ids[g.away]=g.awayId; if(g.home) ids[g.home]=g.homeId; });
  const p4p = UFC_OFFICIAL.boards.filter(b=>/pound/i.test(b.name));
  const divs = UFC_OFFICIAL.boards.filter(b=>!/pound/i.test(b.name));
  const block = boards => boards.map(b=>{
      const rows=b.rows.map(r=>{
        const rk=r[0], name=r[1], pid=r[2]||ids[name]||"";
        const img = pid ? "https://a.espncdn.com/i/headshots/mma/players/full/"+pid+".png" : "";
        return "<div class='rrow prow' data-pid='"+pid+"' data-pname='"+String(name).replace(/"/g,"")+"'><span class='rk'>"+rk+"</span>"+(img?"<img alt='' src='"+img+"'/>":"<span></span>")+"<div><b>"+name+"</b></div></div>";
      }).join("");
      return "<div class='rankdiv'><h3>"+b.name+"</h3>"+rows+"</div>";
    }).join("");
  host.innerHTML = "<div class='rankwrap'><p class='hint'>Official UFC rankings · "+UFC_OFFICIAL.asOf+"</p>"+
    block(p4p)+"<div class='rankgrid'>"+block(divs)+"</div></div>";
}
async function findMmaId(name){
  if(!name) return "";
  try{
    const res=await fetch("https://site.web.api.espn.com/apis/common/v3/search?query="+encodeURIComponent(name)+"&limit=12&type=player",{cache:"no-store"});
    if(!res.ok) return "";
    const items=(await res.json()).items||[];
    const exact=items.find(x=>x.sport==="mma" && String(x.displayName||"").toLowerCase()===String(name).toLowerCase());
    const any=items.find(x=>x.sport==="mma");
    return String((exact||any||{}).id||"");
  }catch(e){ return ""; }
}

    const ovrRes = await fetch("https://site.web.api.espn.com/apis/common/v3/sports/"+path+"/athletes/"+pid+"/overview",{cache:"no-store"});
    if(!ovrRes.ok) throw new Error("ESPN "+ovrRes.status);

        fetch("https://site.web.api.espn.com/apis/common/v3/sports/"+path+"/athletes/"+pid+"/splits",{cache:"no-store"})
      ]);
      if(logRes.ok) log = await logRes.json();
      if(splitRes.ok) splitsPack = await splitRes.json();
    }catch(e){}
    const st = d.statistics || {};
    const labels = st.labels || [];
    const splits = (st.splits || []).map(sp =>
      "<tr><td>"+sp.displayName+"</td>"+(sp.stats||[]).map(v=>"<td>"+v+"</td>").join("")+"</tr>"
    ).join("");
    const meta = log.events || {};
    const gLabels = log.labels || [];
    const catEvents = ((((log.seasonTypes||[])[0]||{}).categories||[])[0]||{}).events || [];
    const list = Array.isArray(catEvents) ? catEvents.slice(0,10) : [];
    const rows = list.map(ev=>{
      const info = (!Array.isArray(meta) && meta && ev.eventId) ? (meta[ev.eventId]||{}) : {};
      const opp = (info.opponent && (info.opponent.abbreviation || info.opponent.displayName)) || info.atVs || "";
      const dec = info.gameResult || "";
      const line = (ev.stats||[]).slice(0,7).join(" · ");
      return "<tr><td>"+String(info.gameDate||"").slice(0,10)+"</td><td>"+dec+" "+opp+"</td><td>"+line+"</td></tr>";
    }).join("");
    const shot = LEAGUE==="nfl"
      ? "https://a.espncdn.com/i/headshots/nfl/players/full/"+pid+".png"
      : LEAGUE==="cfb"
        ? "https://a.espncdn.com/i/headshots/college-football/players/full/"+pid+".png"
        : LEAGUE==="mls"
          ? "https://a.espncdn.com/i/headshots/soccer/players/full/"+pid+".png"
        : "https://a.espncdn.com/i/headshots/mlb/players/full/"+pid+".png";
    const season = (st.splits||[]).find(s=>/regular/i.test(s.displayName||"")) || (st.splits||[])[0] || {stats:[]};
    const career = (st.splits||[]).find(s=>/career/i.test(s.displayName||"")) || null;
    const tiles = labels.map((lab,i)=>"<div class='tile'><em>"+lab+"</em><b>"+(season.stats[i]||"—")+"</b></div>").join("");
    const careerBits = career ? labels.map((lab,i)=>"<span>"+lab+"<b>"+(career.stats[i]||"—")+"</b></span>").join("") : "";
    const cards = list.map(ev=>{
      const info = (!Array.isArray(meta) && meta && ev.eventId) ? (meta[ev.eventId]||{}) : {};
      const opp = (info.opponent && (info.opponent.abbreviation || info.opponent.displayName)) || info.atVs || "Opp";
      const dec = (info.gameResult||"").trim();
      const dt = String(info.gameDate||"").slice(0,10);
      const bits = (ev.stats||[]).slice(0,6);
      const line = bits.map((v,i)=>(gLabels[i]||"")+" "+v).filter(Boolean).join("  ");
      return "<div class='grow'><div class='dec "+dec+"'>"+(dec||"·")+"</div><div class='opp'>"+opp+"<span>"+dt+"</span></div><div class='line'>"+line+"</div></div>";
    }).join("");
    function idx(labs, names){
      const L=(labs||[]).map(x=>String(x).toUpperCase());
      for(const n of names){ const i=L.indexOf(n); if(i>=0) return i; }
      return -1;
    }
    const labsU = labels.map(x=>String(x).toUpperCase());
    const has = (...xs)=> xs.some(x=>labsU.includes(String(x).toUpperCase()));
    const posAb = String((((d.athlete||d.player||{}).position)||{}).abbreviation || ((d.athlete||{}).position) || "").toUpperCase();
    const splitLabs = (splitsPack.labels||[]).map(x=>String(x).toUpperCase());
    const splitVals = ((((splitsPack.splitCategories||[])[0]||{}).splits||[])[0]||{}).stats || [];
    const splitAt = names => {
      for(const n of names){
        const i=splitLabs.indexOf(String(n).toUpperCase());
        if(i>=0 && splitVals[i]!=null && splitVals[i]!=="") return String(splitVals[i]);
      }
      return "";
    };
    const isPitch = LEAGUE==="mlb" && (/pitch/i.test(st.displayName||"") || (has("ERA","IP","ER") && !has("AB","RBI","2B")));
    const isPass = has("CMP","CMP%","ATT","INT","RTG","QBR") || posAb==="QB" || /pass/i.test(st.displayName||"");
    const isRush = has("CAR") || posAb==="RB" || /rush/i.test(st.displayName||"");
    const isRec  = has("REC","TGTS","YAC") || /WR|TE/.test(posAb) || /receiv/i.test(st.displayName||"");
    const isDef  = has("TOT","SOLO","TFL","SACK","PD") || /LB|DL|DE|DT|CB|S|DB/.test(posAb);
    const fromKit = LEAGUE==="nfl" && !!window.FROMKIT;
    const kitPos = (ROSTER.find(p=>p.id===String(pid))||{}).pos || FILT.pos || posAb || "";
    const fbKeys = isPass || kitPos==="QB" ? [["YDS","YDS"],["TD","TD"],["INT","INT"]]
      : isRush || kitPos==="RB" ? [["YDS","YDS"],["TD","TD"],["CAR","CAR"]]
      : isDef ? [["TOT","TOT"],["SACK","SACK"],["TFL","TFL"]]
      : [["YDS","YDS"],["REC","REC"],["TD","TD"]];
    const leadKeys = (LEAGUE==="mlb")
      ? (isPitch ? [["ERA","ERA"],["W-L","W","L"],["K","K","SO"]] : [["AVG","AVG","BA"],["HR","HR"],["RBI","RBI"]])
      : fbKeys;
    const leads = leadKeys.map(pair=>{
      if(pair[0]==="W-L"){
        const w=splitAt(["W"]) || (idx(labels,["W"])>=0?season.stats[idx(labels,["W"])]:"");
        const l=splitAt(["L"]) || (idx(labels,["L"])>=0?season.stats[idx(labels,["L"])]:"");
        const val = (w!==""||l!=="") ? ((w||"0")+"-"+(l||"0")) : "—";
        return "<div class='lead'><em>W-L</em><b>"+val+"</b></div>";
      }
      if(pair[0]==="ERA"){
        const v=splitAt(["ERA"]) || (idx(labels,["ERA"])>=0?season.stats[idx(labels,["ERA"])]:"");
        return "<div class='lead'><em>ERA</em><b>"+(v||"—")+"</b></div>";
      }
      if(pair[0]==="AVG"){
        let v=splitAt(["AVG","BA"]) || (idx(labels,["AVG","BA"])>=0?season.stats[idx(labels,["AVG","BA"])]:"");
        if(!v){
          const h=Number((idx(labels,["H"])>=0?season.stats[idx(labels,["H"])]:0));
          const ab=Number((idx(labels,["AB"])>=0?season.stats[idx(labels,["AB"])]:0));
          if(ab>0) v=(h/ab).toFixed(3).replace(/^0/,".");
        }
        return "<div class='lead'><em>AVG</em><b>"+(v||"—")+"</b></div>";
      }
      const fromSplit=splitAt(pair.slice(1));
      const i=idx(labels, pair.slice(1));
      return "<div class='lead'><em>"+pair[0]+"</em><b>"+(fromSplit||(i>=0?(season.stats[i]||"—"):"—"))+"</b></div>";
    }).join("");
    const nxt = ((((d.nextGame||{}).league||{}).events)||[])[0] || {};
    const nextLine = nxt.shortName || nxt.name || "";
    const roto = (d.rotowire && (d.rotowire.headline||d.rotowire.story)) || "";
    let last18="";
    if(fromKit){
      const games = await loadLog(String(pid));
      const hits = games.filter(g=>valOf(g, FILT.stat)>=FILT.line).length;
      const max=Math.max(1,...games.map(g=>valOf(g,FILT.stat)));
      last18 = `<div class="desk18"><p class="deskmeta">${hits}/${games.length} on ${labelLine(FILT.stat,FILT.line)}</p><div class="spark">${games.map(g=>{
        const v=valOf(g, FILT.stat);
        const h=Math.max(8, Math.round((v/max)*80));
        return `<i class="${v>=FILT.line?"hit":"miss"}" style="height:${h}px"><b>${v}</b><em>${g.opp||""}</em></i>`;
      }).join("")}</div></div>`;
    }
    window.FROM_TEAM_PLAYER = !!(window.TEAM_CTX && window.TEAM_CTX.id);
    if($("toGame")) $("toGame").textContent = window.FROM_TEAM_PLAYER ? "← Team" : fromKit ? "← Kitchen" : window.FROMLEAD ? "← Leaders" : "← Game";
    window.FROMKIT = fromKit;
    $("playerRoom").innerHTML = `
      <div class="phero">
        <div class="phero-top">
          <img alt="" src="${shot}"/>
          <div class="phero-copy">
            <p class="kicker">${fromKit && kitPos ? kitPos+" · "+((ROSTER.find(p=>p.id===String(pid))||{}).team||"") : (st.displayName||"Player")}</p>
            <h2>${name}</h2>
            ${nextLine?`<p class="nextchip">Next · ${nextLine}</p>`:"<p>Last 18 tape</p>"}
          </div>
        </div>
        <div class="lead3">${leads}</div>
        ${roto?`<div class="wireblurb">${roto}</div>`:""}
        ${last18}
        ${(()=>{
          const keep=/^(REC|TGTS|YDS|TD|AVG|LNG|CMP|ATT|INT|CAR|FUM|SOLO|TOT|SACK|TFL)$/i;
          const bits=labels.map((lab,i)=>({lab,s:season.stats[i]})).filter(x=>keep.test(x.lab));
          const line = bits.length ? `<p class="seasonline">${bits.map(x=>`<span><i>${x.lab}</i> ${x.s||"—"}</span>`).join("")}</p>` : (fromKit?"":`<div class="tiles">${tiles}</div>`);
          if(fromKit) return line;
          return line + `${careerBits?`<div class="career"><span>Career</span>${careerBits}</div>`:""}<div class="glog"><h3>Recent</h3>${cards||"<p class='hint'>No log posted</p>"}</div>`;
        })()}
      </div>`;
  }catch(e){
    $("playerRoom").innerHTML="<p class='hint'>No breakout for "+name+". "+(e.message||"")+"</p>";
  }
}

function liveStatFromBox(sum, pid, stat){
  const sides=((sum.boxscore||{}).players)||[];
  let rec=0, recY=0, recTd=0, rush=0, rushTd=0, passY=0, passTd=0, ints=0;
  sides.forEach(side=>{
    (side.statistics||[]).forEach(grp=>{
      const keys=grp.keys||grp.names||[];
      (grp.athletes||[]).forEach(a=>{
        if(!a.athlete || String(a.athlete.id)!==String(pid)) return;
        const st=a.stats||[];
        const get=n=>{ const i=keys.indexOf(n); return i>=0?Number(String(st[i]||"0").split("/")[0])||0:0; };
        rec+=get("receptions"); recY+=get("receivingYards"); recTd+=get("receivingTouchdowns");
        rush+=get("rushingYards"); rushTd+=get("rushingTouchdowns");
        passY+=get("passingYards"); passTd+=get("passingTouchdowns"); ints+=get("interceptions");
      });
    });
  });
  if(stat==="rec") return rec;
  if(stat==="recYds") return recY;
  if(stat==="recTd") return recTd;
  if(stat==="rushYds") return rush;
  if(stat==="rushTd") return rushTd;
  if(stat==="passYds") return passY;
  if(stat==="passTd") return passTd;
  if(stat==="int") return ints;
  return 0;
}
function evalTeamSlip(s, g){
  const as=Number(g.awayScore), hs=Number(g.homeScore);
  if(!Number.isFinite(as) || !Number.isFinite(hs)) return;
  s.game=g.away+" @ "+g.home;
  s.status=g.state;
  s.awayScore=as; s.homeScore=hs;
  s.detail=g.detail||"";
  s.lastPlay=g.lastPlay||"";
  s.down=g.down||"";
  s.red=!!g.red;
  s.possAway = g.possId && String(g.possId)===String(g.awayId);
  s.possHome = g.possId && String(g.possId)===String(g.homeId);
  const done = g.state==="post";
  if(s.kind==="spread"){
    const margin = s.side==="home" ? (hs-as) : (as-hs);
    s.live=margin;
    s.cover = margin + Number(s.line);
    s.push = done && s.cover===0;
    s.hit = done && s.cover>0;
  } else if(s.kind==="ou"){
    s.live=as+hs;
    const tot=as+hs, line=Number(s.line);
    s.cover = s.side==="over" ? (tot-line) : (line-tot);
    s.push = done && tot===line;
    s.hit = done && ((s.side==="over" && tot>line) || (s.side==="under" && tot<line));
  } else if(s.kind==="ml"){
    const mine = s.side==="home" ? hs : as;
    const theirs = s.side==="home" ? as : hs;
    s.live = mine-theirs;
    s.cover = mine-theirs;
    const win = s.side==="home" ? g.homeWin : g.awayWin;
    s.push = false;
    s.hit = done && !!win;
    if(done && !win && mine===theirs) s.push=true;
  }
}

function slipMood(s){
  if(s.push && s.status==="post") return "PUSH";
  if(s.hit && s.status==="post") return "HIT";
  if(s.status==="post") return "MISS";
  if(s.status==="in"){
    if(s.kind==="spread" || s.kind==="ou" || s.kind==="ml"){
      if(s.cover>0) return "COVER";
      if(s.cover<0) return "DANGER";
      return "LIVE";
    }
    if(s.stat && s.live>=s.line) return "COVER";
    return "LIVE";
  }
  if(s.stat && s.live>=s.line && s.status==="post") return "HIT";
  return "WAIT";
}
function packTag(rows){
  const tags=rows.map(slipMood);
  if(tags.includes("MISS")) return "MISS";
  if(tags.includes("DANGER") || tags.includes("LIVE") || tags.includes("COVER") || tags.includes("WAIT")) return "LIVE";
  if(tags.every(t=>t==="PUSH")) return "PUSH";
  if(tags.every(t=>t==="HIT" || t==="PUSH")) return "HIT";
  return "LIVE";
}
function paintSlip(){

  }
  const ranked=SLIP.slice().sort((a,b)=>{

    return rk(a)-rk(b);
  });

    const board = `<div class="board"><span class="${aBall?"has":""}">${aAb}${aBall}</span><b>${as}</b><span class="clock">${(g&&g.detail)||s.detail||s.status||""}</span><b>${hs}</b><span class="${hBall?"has":""}">${hBall}${hAb}</span></div>`;

    if(s.kind==="ou"){
      const tot=Number(s.live)||0, line=Number(s.line);
      goal=`${tot}<em>/ ${line} ${s.side==="over"?"O":"U"}</em>`;
      const gap=line-tot;
      if(s.status==="pre") need="Waiting on first score";
      else if(s.side==="over") need = gap>0 ? gap+" points to the number" : (gap===0?"On the number":Math.abs(gap)+" over");
      else need = gap>0 ? tot+" on the board · "+gap+" of air" : (gap===0?"On the number":Math.abs(gap)+" over the under");
      pct = s.side==="over"
        ? Math.min(96, Math.round((tot/Math.max(0.5,line))*100))
        : Math.max(6, Math.min(96, Math.round((gap>=0?(gap/Math.max(0.5,line))*100:4))));
      if(s.status==="pre") pct=6;
    } else if(s.kind==="ml"){
      const lead=Number(s.live)||0;
      goal = s.status==="post" ? (s.hit?"WIN":"LOSS") : (lead>0?("+"+lead):String(lead));
      goal += `<em>ML</em>`;
      if(s.status==="pre") need="Kick pending";
      else if(s.status==="post") need=s.hit?"Got the W":"Did not finish";
      else need = lead>0 ? "Leading by "+lead : lead<0 ? "Down "+Math.abs(lead) : "Tied · needs the W";
      pct = s.status==="pre"?8:s.status==="post"?(s.hit?100:8):Math.max(8, Math.min(94, 50+lead*6));
    } else if(s.kind==="spread"){

      const left=Math.max(0, Number(s.line)-(s.live||0));
      need=hit?"Cleared the line":(s.status==="in"?left+" to go":labelLine(s.stat,s.line));
      pct=Math.min(100, Math.round(((s.live||0)/Math.max(1,Number(s.line)))*100));

          opp=(parts[1]||parts[0]||"").slice(0,14);
        }
        rows.push({id:String(ev.eventId), stats:ev.stats||[], names:names, opp:opp, season:st.displayName||"", date:meta.gameDate||meta.date||""});
      });
    });
  });
  return rows;
}
async function loadLog(pid){
  if(LOGS[pid] && LOGS[pid].length>=10 && LOGS[pid][0] && LOGS[pid][0].date) return LOGS[pid];
  const qs=["","?season=2025"];
  const seen=new Set();
  const rows=[];
  for(const q of qs){
    try{
      const res=await fetch("https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/"+pid+"/gamelog"+q,{cache:"no-store"});
      if(!res.ok) continue;
      parseLog(await res.json()).forEach(r=>{
        if(seen.has(r.id)) return;
        seen.add(r.id);
        rows.push(r);
      });
    }catch(e){}
  }
  rows.sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")) || String(a.id).localeCompare(String(b.id)));
  LOGS[pid]=rows.slice(-18);
  return LOGS[pid];
}
function sauceScore(hits, n, l5h, l5n){
  if(!n) return 0;
  const shrunk = (hits + 4) / (n + 8);
  const recent = l5n ? (l5h/l5n) : (hits/n);
  const volume = Math.min(1, n/18);
  return Math.round(shrunk*70 + recent*15 + volume*15);
}
function paintKitRows(out, host){
  out.sort((a,b)=> (b.score-a.score) || (b.hits-a.hits) || (b.n-a.n) || (b.rate-a.rate));
  const rows=out.filter(x=>x.n);
  $("kitMeta").textContent=FILT.pos+" · last 18 · "+labelLine(FILT.stat,FILT.line)+" · score shrinks 1/1 below 17/18";
  host.innerHTML=rows.map(x=>{
    const games=LOGS[x.p.id]||[];
    const max=Math.max(1,...games.map(g=>valOf(g,FILT.stat)));
    const spark=games.map(g=>{
      const v=valOf(g, FILT.stat);
      const h=Math.max(8, Math.round((v/max)*72));
      return `<i class="${v>=FILT.line?"hit":"miss"}" style="height:${h}px" title="${g.opp||""} ${v}"><b>${v}</b><em>${g.opp||""}</em></i>`;
    }).join("");
    return `<div class="kcard">
      <div class="ktop">
        <div class="khit">${x.score}</div>
        <div class="prow" data-pid="${x.p.id}" data-pname="${x.p.name.replace(/"/g,"")}"><b>${x.p.name}</b><em>${x.p.team} ${x.p.pos} · ${x.hits}/${x.n} · L5 ${x.l5h}/${x.l5n} · ${labelLine(FILT.stat,FILT.line)}</em></div>
        <button type="button" class="addline" data-add="${x.p.id}">Add</button>
      </div>
      <div class="spark">${spark}</div>
    </div>`;
  }).join("") || "<p class='hint'>Still loading logs…</p>";
  host.querySelectorAll("[data-add]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); addSlip(b.dataset.add); });
}
async function runKitchen(){
  const host=$("kitList");
  if(!host) return;
  try{
  fillKitControls();
  host.innerHTML="<p class='hint'>Opening Kitchen… pulling NFL rosters.</p>";
  $("kitMeta").textContent="Kitchen · "+FILT.pos;
  await loadRosters();
  const pool=ROSTER.filter(p=>p.pos===FILT.pos);
  if(!pool.length){

    return;
  }
  host.innerHTML="<p class='hint'>"+pool.length+" "+FILT.pos+"s · last 18 logs coming in…</p>";
  const out=[];
  for(let i=0;i<pool.length;i+=8){
    const slice=pool.slice(i,i+8);
    await Promise.all(slice.map(async p=>{
      try{
        const games=await loadLog(p.id);
        const hits=games.filter(g=>valOf(g, FILT.stat)>=FILT.line).length;
        const n=games.length;
        const last5=games.slice(-5);
        const l5h=last5.filter(g=>valOf(g, FILT.stat)>=FILT.line).length;
        const l5n=last5.length;
        out.push({p,hits,n,l5h,l5n,rate:n?hits/n:0,score:sauceScore(hits,n,l5h,l5n)});
      }catch(e){}
    }));
    $("kitMeta").textContent="Loading "+out.length+" / "+pool.length+" "+FILT.pos+"s…";
  }
  paintKitRows(out, host);
  }catch(e){
    host.innerHTML="<p class='hint'>Kitchen error: "+(e.message||e)+"</p>";
  }
}

function coreStat(cats, names){
  const want=names.map(n=>String(n).toLowerCase());
  for(const c of cats||[]){
    for(const s of (c.stats||[])){
      const nm=String(s.name||"").toLowerCase();
      const ab=String(s.abbreviation||"").toLowerCase();
      if(want.includes(nm) || want.includes(ab)){
        const v=s.displayValue!=null?s.displayValue:s.value;
        if(v!=null && v!=="") return String(v);
      }
    }
  }
  return "—";
}

    const d=await first.json();
    (d.items||[]).forEach(x=>out.push(x));
    const pages=Math.min(d.pageCount||1,5);
    for(let pg=2; pg<=pages; pg++){
      const r=await fetch("https://sports.core.api.espn.com/v2/sports/soccer/leagues/usa.1/events/"+id+"/competitions/"+id+"/plays?limit=400&page="+pg,{cache:"no-store"});
      if(!r.ok) break;
      const p=await r.json();
      (p.items||[]).forEach(x=>out.push(x));
    }
  }catch(e){}
  return out;
}
function xy(play, flip){
  let x=Number(play.fieldPositionX), y=Number(play.fieldPositionY);
  if(!Number.isFinite(x) || !Number.isFinite(y)) return null;
  if(flip){ x=100-x; y=100-y; }
  return {x: x*1.05, y: y*0.68};
}
function xy2(play, flip){
  let x=Number(play.fieldPosition2X), y=Number(play.fieldPosition2Y);
  if(!Number.isFinite(x) || !Number.isFinite(y)) return null;
  if(flip){ x=100-x; y=100-y; }
  return {x: x*1.05, y: y*0.68};
}
function pitchSvg(plays, awayId){
  const marks=`
    <rect class="mark" x="1" y="1" width="103" height="66"/>
    <line class="mark" x1="52.5" y1="1" x2="52.5" y2="67"/>
    <circle class="mark" cx="52.5" cy="34" r="9.15"/>
    <circle class="mark" cx="52.5" cy="34" r=".6" fill="#e8f7ea"/>
    <rect class="mark" x="1" y="13.84" width="16.5" height="40.32"/>
    <rect class="mark" x="1" y="24.84" width="5.5" height="18.32"/>
    <rect class="mark" x="87.5" y="13.84" width="16.5" height="40.32"/>
    <rect class="mark" x="98" y="24.84" width="5.5" height="18.32"/>`;
  const teamOf=p=>idFromRef((p.team&&p.team.$ref)||"");
  const shots=plays.filter(p=>{
    const t=((p.type&&p.type.text)||"").toLowerCase();
    return /shot|goal/.test(t) && p.fieldPositionX!=null;
  });
  const passes=plays.filter(p=>((p.type&&p.type.text)||"")==="Pass" && p.fieldPosition2X!=null).slice(-18);
  const shotDots=shots.map(p=>{
    const flip=teamOf(p) && String(teamOf(p))===String(awayId);
    const a=xy(p,flip); if(!a) return "";
    const t=((p.type&&p.type.text)||"").toLowerCase();
    const cls=p.scoringPlay||t==="goal"?"goal":/on target/.test(t)?"on":/off/.test(t)?"off":"shot";
    return `<circle class="shot ${cls}" cx="${a.x.toFixed(2)}" cy="${a.y.toFixed(2)}" r="${cls==="goal"?1.7:1.15}"><title>${(p.text||t)}</title></circle>`;
  }).join("");
  const passLines=passes.map((p,i)=>{
    const flip=teamOf(p) && String(teamOf(p))===String(awayId);
    const a=xy(p,flip), b=xy2(p,flip); if(!a||!b) return "";
    const last=i===passes.length-1;
    return `<line class="pass${last?" live":""}" x1="${a.x.toFixed(2)}" y1="${a.y.toFixed(2)}" x2="${b.x.toFixed(2)}" y2="${b.y.toFixed(2)}"/>`;
  }).join("");
  let ball="";
  const last=passes[passes.length-1];
  if(last){
    const flip=teamOf(last) && String(teamOf(last))===String(awayId);
    const b=xy2(last,flip)||xy(last,flip);
    if(b) ball=`<circle class="ball" cx="${b.x.toFixed(2)}" cy="${b.y.toFixed(2)}" r="1.2"/>`;
  }
  return `<svg class="pitch" viewBox="0 0 105 68" preserveAspectRatio="xMidYMid meet">${marks}${passLines}${shotDots}${ball}</svg>`;
}

  const want={
    passing:["CMP","ATT","YDS","TD","INT","RTG"],
    rushing:["CAR","ATT","YDS","AVG","TD","LNG"],
    receiving:["REC","TGTS","YDS","AVG","TD","LNG"],
    defensive:["TOT","SOLO","SACK","TFL","PD","INT"],
    kicking:["FGM","FGA","XPM","PTS","LNG"],
    returning:["RET","YDS","AVG","TD","LNG"],
    punting:["PUNTS","YDS","AVG","LNG","IN20"],
    scoring:["TD","FG","XP","PTS"],
    batting:["AVG","HR","RBI","OPS","H","AB","SB"],
    pitching:["ERA","W","L","IP","K","WHIP","SV"],
    fielding:["PO","A","E","DP","FP"]
  }[cat] || ["YDS","TD","AVG"];
  const map={};
  (pack.stats||[]).forEach(s=>{ map[(s.abbreviation||s.shortDisplayName||s.name||"").toUpperCase()]=s.displayValue; });
  const bits=want.map(k=>map[k]!=null?k+" "+map[k]:"").filter(Boolean);
  return bits.join(" · ") || L.displayValue || "";
}

function prettyLead(name, value, display){
  const n=Number(value);
  const rate=/avg|obp|slg|ops|whip|era|pct|percentage|battingAverage|onBase|slug/i.test(name||"");
  if(rate && Number.isFinite(n)) return n<1 ? n.toFixed(3).replace(/^0/,"") : n.toFixed(2);
  const d=display!=null?String(display):"";
  if(d && d.length<=8 && !/,/.test(d)) return d;
  if(Number.isFinite(n)){
    if(Number.isInteger(n) || Math.abs(n-Math.round(n))<1e-6) return String(Math.round(n));
    return n.toFixed(1);
  }
  return d || "—";
}

async function openPolls(){
  const host=$("boardPanel");
  host.hidden=false;
  host.innerHTML="<p class='hint'>Loading AP and Coaches…</p>";
  try{
    const res=await fetch("https://site.api.espn.com/apis/site/v2/sports/football/college-football/rankings",{cache:"no-store"});
    const d=await res.json();
    const polls=(d.rankings||[]).filter(p=>{
      const n=(p.name||"")+" "+(p.shortName||"");
      if(/fcs|division ii|division iii|div ii|div iii/i.test(n)) return false;
      return /ap top|ap poll|afca coaches|coaches poll|playoff|cfp|committee/i.test(n);
    });
    const extra=(d.rankings||[]).filter(p=>!polls.includes(p) && /playoff|cfp/i.test((p.name||"")));
    const list=polls.length?polls:(d.rankings||[]).slice(0,2);
    const col=p=>{
      const rows=(p.ranks||[]).slice(0,25).map(r=>{
        const t=r.team||{};
        const logo=(t.logos&&t.logos[0]&&t.logos[0].href)||(t.id?("https://a.espncdn.com/i/teamlogos/ncaa/500/"+t.id+".png"):"");
        const rec=r.recordSummary||t.recordSummary||"";
        const tr=r.trend!=null?r.trend:"";
        return `<div class="pollrow" data-tid="${t.id||""}" data-tname="${String(t.displayName||t.nickname||"").replace(/"/g,"")}"><b class="rk">${r.current||""}</b><img alt="" src="${logo}"/><div><b>${t.abbreviation||t.nickname||""}</b><em>${t.displayName||""}${rec?(" · "+rec):""}</em></div><em>${tr?" "+tr:""}</em></div>`;
      }).join("");
      return `<div class="pollcol"><h3>${p.name||p.shortName}</h3>${rows||"<p class='hint'>No ballot this week.</p>"}</div>`;
    };
    const cfp = extra[0] || (d.rankings||[]).find(p=>/playoff|cfp|committee/i.test(p.name||""));
    host.innerHTML = `<p class="hint">${(d.latestWeek&&d.latestWeek.displayName)||"Week polls"} · tap a team</p><div class="pollgrid">${list.map(col).join("")}</div>` +
      (cfp && !list.includes(cfp) ? `<div class="pollgrid">${col(cfp)}</div>` : `<p class="hint">College Football Playoff ranking publishes later in the season. This board will pick it up when ESPN adds the ballot.</p>`);
    host.querySelectorAll("[data-tid]").forEach(b=>b.onclick=()=>openTeam(b.dataset.tid, b.dataset.tname||"Team"));
  }catch(e){
    host.innerHTML="<p class='hint'>Could not load polls. "+(e.message||"")+"</p>";
  }
}

async function openLeaders(lg){

  host.hidden=false;

  try{
    let cats=[];
    if(lg==="nfl"){
      const res=await fetch("https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2026/types/2/leaders?limit=20",{cache:"no-store"});
      if(!res.ok) throw new Error("ESPN "+res.status);
      const d=await res.json();
      cats=(d.categories||[]).map(c=>{
        const leaders=(c.leaders||[]).slice(0,15).map(L=>{
          const aid=refId((L.athlete&&L.athlete.$ref)||L.athlete);

        return {name:c.name||"", displayName:c.displayName||c.name||"", leaders};
      });
      await fillLeadNames("nfl", cats);
      window.LEAD_NOTE="2026 regular season";
    }else{
      const res=await fetch("https://site.api.espn.com/apis/site/v2/sports/football/college-football/statistics",{cache:"no-store"});
      const d=await res.json();
      cats=((d.stats||{}).categories)||[];
      window.LEAD_NOTE="College season";
    }
    window.LEAD_CATS = cats;
    window.LEAD_SIDE = "off";

}
function paintLeaders(){
  const host=$("boardPanel");
  const cats=window.LEAD_CATS||[];
  const side=window.LEAD_SIDE||"off";
  const mlb = /avg|homeRun|ERA|WHIP|OPS|stolen/i.test((cats[0]&&(cats[0].name||cats[0].displayName))||"") || /MLB/i.test(window.LEAD_NOTE||"");
  const offTest = mlb ? /avg|homeRun|RBI|runs|OPS|onBase|slug|hits|stolen|WAR|gameScore|rating/i : OFF_CAT;
  const defTest = mlb ? /ERA|wins|strikeout|saves|WHIP|quality|opponentAvg|holds/i : DEF_CAT;
  const shown=cats.filter(c=> side==="off" ? offTest.test(c.name||c.displayName||"") && !defTest.test(c.name||"") : defTest.test(c.name||c.displayName||""));
  const shot = a => {
    if(!a) return "";
    if(a.headshot) return typeof a.headshot==="string"?a.headshot:(a.headshot.href||"");
    const folder = LEAGUE==="mlb" || mlb ? "mlb" : LEAGUE==="nfl" ? "nfl" : "college-football";
    return a.id ? ("https://a.espncdn.com/i/headshots/"+folder+"/players/full/"+a.id+".png") : "";
  };
  host.innerHTML = `<div class="ldhead">
      <button type="button" class="${side==="off"?"on":""}" data-side="off">Offense</button>
      <button type="button" class="${side==="def"?"on":""}" data-side="def">Defense</button>
    </div>
    <p class="hint">${window.LEAD_NOTE||""}</p>
    <div class="ltable">${shown.map(c=>{
      const rows=(c.leaders||[]).slice(0,15).map((L,i)=>{
        const a=L.athlete||{};
        const tm=(L.team&&(L.team.displayName||L.team.location||L.team.abbreviation))||(a.team&&(a.team.displayName||a.team.location||a.team.abbreviation))||"";
        return `<div class="lrow prow" data-pid="${a.id||""}" data-pname="${String(a.displayName||"").replace(/"/g,"")}"><span class="rk">${i+1}</span><img alt="" src="${shot(a)}"/><div><b>${a.displayName||a.shortName||""}</b><em>${tm}</em></div><span class="val">${L.displayValue||L.value||""}</span></div>`;
      }).join("");
      return `<h3>${c.displayName||c.name}</h3>${rows}`;
    }).join("")||"<p class='hint'>No categories in this bucket.</p>"}</div>`;
  host.querySelectorAll("[data-side]").forEach(b=>b.onclick=()=>{ window.LEAD_SIDE=b.dataset.side; paintLeaders(); });
}

(function usageEngine(){
  const NS="lhinson00";
  const A="https://abacus.jasoncameron.dev";
  const PASS="sauce";
  const STORE="sauceUse";
  const dayKey="sauceHitDay";
  const locKey="sauceHitsLocal";
  const today=new Date().toISOString().slice(0,10);
  const lastHit={};
  function loadUse(){
    try{ return JSON.parse(localStorage.getItem(STORE)||"{}"); }catch(e){ return {}; }
  }
  function saveUse(u){ try{ localStorage.setItem(STORE, JSON.stringify(u)); }catch(e){} }
  function use(){
    const u=loadUse();
    u.events=u.events||[];
    u.totals=u.totals||{};
    u.sec=Number(u.sec||0);
    u.clicks=Number(u.clicks||0);
    u.sess=u.sess||{id:Date.now(), start:Date.now(), last:Date.now(), sec:0};
    return u;
  }
  function fmtDur(s){
    s=Math.max(0,Math.floor(s));
    const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
    if(h) return h+"h "+m+"m";
    if(m) return m+"m "+x+"s";
    return x+"s";
  }
  function clock(ts){
    const d=new Date(ts);
    return d.toLocaleString([], {month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"});
  }
  function abacus(key, hit){
    const now=Date.now();
    if(hit && lastHit[key] && now-lastHit[key]<2500) return Promise.resolve(null);
    if(hit) lastHit[key]=now;
    const path=hit?"/hit/":"/get/";
    return fetch(A+path+NS+"/"+key,{cache:"no-store"}).then(r=>r.json()).then(d=>Number(d.value||d.count||0)||0).catch(()=>0);

  }

    const u=use();

    u.totals[kind+":"+(detail||"")]=(u.totals[kind+":"+(detail||"")]||0)+1;
    u.events.unshift({t:Date.now(), k:kind, d:String(detail||"").slice(0,48)});

  };

    if(document.visibilityState==="visible" && add>0){
      u.sess.last=now;
      u.sess.sec=(u.sess.sec||0)+add;

      saveUse(u);
    }
  }
  setInterval(beat, 15000);

    const u=use();

  });
  document.addEventListener("click", e=>{

  const el=$("hitLine");

  const paint=n=>{

  };

  }
  if(el) el.addEventListener("click", ()=>{
    const n=Date.now();
    if(n-tapT>1400) taps=0;

    if(taps>=5){ taps=0; openOwnerGate(); }
  });

    host.innerHTML=`<div class="owncard"><h3>This phone</h3>
      <div class="owngrid">
        <div class="ownstat"><b>${fmtDur(u.sec)}</b><span>Time on site</span></div>
        <div class="ownstat"><b>${(u.clicks||0).toLocaleString()}</b><span>Clicks</span></div>
        <div class="ownstat"><b>${(u.events||[]).length}</b><span>Logged actions</span></div>
        <div class="ownstat"><b>${fmtDur(u.sess.sec||0)}</b><span>This session</span></div>
        <div class="ownstat"><b>${u.totals.league||0}</b><span>League opens</span></div>

      </div>
      <p class="hint" style="margin:10px 0 0">Time and clicks live only on this device. Clear site data and this log is gone.</p>

    <div class="owncard"><h3>All devices · board totals</h3>

      <p class="hint" style="margin:10px 0 0">sendit = unique days · raw = every load · mins = minutes someone had the tab open</p>
    </div>
    <div class="owncard"><h3>Recent on this phone</h3>
      <div class="ownlog">${(u.events||[]).slice(0,80).map(x=>`<div class="ownrow"><em>${clock(x.t)}</em><span>${x.k} · ${x.d||"—"}</span></div>`).join("")||"<p class='hint'>Nothing yet.</p>"}</div>
      <button type="button" class="ownbtn" id="ownLock" style="margin-top:12px">Lock board</button>
    </div>`;
    $("ownLock").onclick=()=>{ localStorage.removeItem("sauceOwner"); paintOwner(); };
    counts.forEach(k=>{
      abacus(k,false).then(n=>{
        const box=host.querySelector('[data-k="'+k+'"] b');
        if(box) box.textContent=(n||0).toLocaleString();
      });
    });
  }
})();
