<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Volume Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <p class="eyebrow">Data first · FanDuel second</p>
    <h1>Volume Board</h1>
    <p class="sub">2025 + 2026 Week 1. Hits/Games only. Open FanDuel after the list is short.</p>
  </header>

  <section class="controls">
    <label>
      Position
      <select id="pos"></select>
    </label>
    <label>
      Market
      <select id="market"></select>
    </label>
    <label>
      Yardage / line
      <select id="line"></select>
    </label>
    <div class="row">
      <label>
        Min games
        <input id="minGames" type="number" min="1" max="20" value="10" />
      </label>
      <label>
        Min hits
        <input id="minHits" type="number" min="1" max="20" value="16" />
      </label>
    </div>
    <label>
      Search player
      <input id="q" type="search" placeholder="Name…" autocomplete="off" />
    </label>
    <div class="presets" id="presets"></div>
  </section>

  <section class="summary" id="summary"></section>
  <section class="list" id="list"></section>
  <div class="sheet" id="sheet"><div class="sheet-body" id="sheetBody"></div></div>

  <footer>
    <p>Full NFL. Last 18 games from 2025 REG + 2026 Week 1 box scores (nflverse). Not a top-25 list.</p>
    <p>Not betting advice. Counts are history, not this week’s script.</p>
  </footer>

  <script src="full_stats.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
