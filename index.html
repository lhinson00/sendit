<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#05060a"/>
<title>Sports Sauce</title>
<link rel="stylesheet" href="styles.css"/>
</head><body>
<header class="top">
  <div class="brand">
    <div class="word">
      <div class="mark">S</div>
      <div>
        <p class="eyebrow">NFL desk</p>
        <h1>Sports Sauce</h1>
      </div>
    </div>
    <span class="livepill">LIVE</span>
  </div>
</header>
<section id="viewLive">
  <div class="livetop"><span id="liveMeta">Loading slate…</span></div>
  <div id="wire" class="wire"></div>
  <div id="liveList"></div>
</section>
<section id="viewGame" hidden>
  <div id="gameRoom"></div>
</section>
<section id="viewSlip" hidden>
  <p class="sec">Board slip</p>
  <div id="slipBoard"></div>
</section>
<section id="viewResearch" hidden>
  <p class="sec">Betting desk</p>
  <div class="tabs">
    <button type="button" class="on" data-mode="players">Players</button>
    <button type="button" data-mode="teams">Teams</button>
  </div>
  <section class="controls" id="playerControls">
    <div class="row">
      <label>Position<select id="pos"></select></label>
      <label>Stat<select id="market"></select></label>
    </div>
    <label>Line<select id="line"></select></label>
    <input id="minGames" type="hidden" value="0" />
    <input id="minHits" type="hidden" value="0" />
    <label>Game<select id="game"></select></label>
    <label>Search<input id="q" type="search" placeholder="Player name" autocomplete="off" /></label>
  </section>
  <section class="controls" id="teamControls" hidden>
    <div class="row">
      <label>Market<select id="tMarket"></select></label>
      <label>Home / Away<select id="tSplit"></select></label>
    </div>
    <input id="tMinGames" type="hidden" value="0" />
    <input id="tMinHits" type="hidden" value="0" />
    <label>Search<input id="tQ" type="search" placeholder="Team code (DET)" autocomplete="off" /></label>
  </section>
  <section class="summary" id="summary"></section>
  <section class="list" id="list"></section>
</section>
<nav class="dock">
  <button type="button" class="on" data-nav="live">Live</button>
  <button type="button" data-nav="research">Desk</button>
  <button type="button" data-nav="slip">Slip <i id="slipCount"></i></button>
</nav>
<div class="sheet" id="sheet"><div class="sheet-body" id="sheetBody"></div></div>
<script src="full_stats.js"></script>
<script src="data.js"></script>
<script src="team_stats.js"></script>
<script src="matchup.js"></script>
<script src="media.js"></script>
<script src="injuries.js"></script>
<script src="app.js"></script>
<script src="live.js"></script>
</body></html>
